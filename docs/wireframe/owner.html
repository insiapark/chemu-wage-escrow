<style>
/* =========================================================
   체무 사장님 앱 v49: 캡처와 화면 표(69화면 480x1200 캡처 review/owner_cap_v49, 기록 맞춰 보기 웹 상태별 캡처 review/verify_cap, handoff/화면표_사장님.md). 55 첫 줄이 제목을 되풀이하던 것을 "늘 켜진 알림도 지금은 이 휴대폰에 오지 않아요"로
   v48: 점검 도구 전부 0(audit, isoaudit 21 네 칸 예외, uxlint, 화면 밖 uxlint, 360x640, 글자 200%, 긴 글)
   v47: 모의 사용 최종 검토 반영. 05 초대 상태를 상태와 다음 일로, 09 12 확정해도 돈은 급여일에 나간다는 줄을 맨 위로,
        13 "A님 일당이 5,160원 줄어요", 16 결정이 끝났다는 줄을 먼저, 29 "사장님이 할 일은 없어요", 40 남는 돈은 입력 칸 아래 결과 줄,
        41 다음 날 오전 9:00 안내를 42 한 곳에만, 11월 14일 시점을 PANEL 이름과 주석에(06, 08, 13~16, 25, 26, 33, 64), 11월 21일에 본 급여 예상은 근무표대로 계산한 값(18, 26, 31)
   v46: 모의 UX 라이터 최종 검토 반영. 36 이름표 "결근으로 남기기", 40~46 채울 날짜 버튼을 한 이름 "채울 날짜 알리기",
        51 [직접 쓰기로 넣기], 55 휴대폰 알림이 꺼져 늘 켜진 알림도 오지 않는다는 첫 줄, 61 가게와 계정이 함께 없어짐, 58 64 채워 둔 돈 묶음 이름,
        28 66 "A님 11월분 월급", 67 "채워 둔 돈 450,000원은 그대로 있어요". PANEL 이름의 옛 말(이의, 기록 대조, 결근 처리)을 용어집 말로,
        상대 앱 화면을 잘못 이은 주석을 바로잡음(21, 54, 55 등). 39의 [받는 사람 화면 보기]는 같은 폴더의 verify.html
   v40: 다섯 버전 점검(audit, isoaudit, 캡처, 360x640, 글자 200%와 긴 글 잘림·겹침). 39의 [받는 사람 화면 보기]는 같은 폴더의 verify.html,
        행 오른쪽 스위치가 0px로 그려져 보이지 않던 것을 46x28로(17, 18, 23, 54, 55)
   v39: 기록 맞춰 보기 웹(verify.html)으로 이어짐. 39의 주 버튼 [받는 사람 화면 보기]가 링크를 받은 사람이 보는 페이지를 새 탭으로 엶
   v38: 모의 사용 과제 반영 (1 [계약서 등록하고 초대하기], 오늘 탭 돈 카드 "지금까지 보관된 돈"과 "12월 10일 급여일에 나가요",
        결과 화면의 끝난 단계는 "~함, ~됨" 꼴: 보관된 돈 보냄, 급여명세서 보냄, A님에게 알림 보냄)
   v37: 에러 체계 다시 보기 (v13 틀: 무엇이 안 됐는지, 돈이 어디 있는지, 해결 방법, 해결 버튼 하나. 47 "인터넷 연결이 끊겼어요", 48 어떤 돈이 그대로인지,
        빠진 실패 상태 67 채워 둔 돈 꺼내기, 68 자동 채우기), 금액 결과 화면 정렬(작은 사물, 금액 제목, 보조 줄은 가운데, 진행 단계는 왼쪽: 10, 15, 16, 28, 44, 45, 66)
   v36: 긴 글과 큰 글씨 (?long=1 점검 모드: 가게 이름 20자, 금액 7자리, 긴 알바생 이름. 480x1200과 360x640에서 기본, 긴 글, 글자 200% 잘림과 겹침 0),
        가게 닫기를 막는 조건 넷(보관된 돈, 아직 보관 못 한 돈, 확정 대기 근무, 다르다고 알린 뒤 결정 전)을 걸리는 만큼 행으로,
        52를 알바생 탭 빈 상태로 되돌리고 처음 연 날 오늘 탭은 63, 입금이 안 된 뒤에는 A님이 받을 곳을 고치면 체무가 바로 다시 보냄(29, 66),
        화면 읽기 이름 8절(계좌, 기록 번호, 종 버튼, 진행 단계 앞 상태 말), "한 주 15시간 이상", 시연 안내 줄 하나
   v35: 화면 읽기 (금액, 시각, 날짜, 배지, 상태, 금액 비교 카드의 읽기 이름. 기호와 시각은 말로: 오후 10:00 ~ 오전 8:00은 "오후 10시부터 오전 8시까지",
        × 곱하기, · 쉼표, 30m 30미터, 계좌 끝자리. 행 하나는 한 번에 "제목, 설명, 배지, 금액"으로, 비교 카드는 한 문장으로. 그림은 계속 빈 alt와 aria-hidden)
   v34: 처음 연 날 (52를 첫 오늘 탭으로: 할 일 하나 [알바생 초대하기], 한 메시지 화면이라 히어로 iso_13 사장님 책상, 첫날이라 알림 0)
   v33: 도움말 (자주 묻는 질문 6개, 답은 두 문장 안팎이고 앱 화면 문구와 대조한 사실만, 상담은 나 화면의 고용노동부 1350 행)
   v32: 로그아웃, 가게 닫기(보관된 돈 있음, 채워 둔 돈만 있음, 남은 돈 없음), 가게 정보 바꾸기(이름, 주소, 출근할 수 있는 거리)
   v31: 알림 설정 (돈이 걸린 알림은 끌 수 없고 이유 한 줄, 휴대폰 알림이 꺼져 있으면 맨 위 한 줄과 알림 켜기),
        오늘 탭 할 일을 상태 제목 바로 아래로, 주휴수당이 섞인 금액은 "몫", 1350 상담 행 ic_scale
   v30: 그림 검수 (isoaudit 위반 0, 네 칸 장면 예외만. 그림과 제목 대조, 토스 좋은 화면 예시 대조, audit 다섯 목표, 캡처)
   v29: 그림 크기 3단계와 자리 (히어로 208px, 작은 사물 96px, 행 아이콘 40px, 모두 제목 위 가운데나 행 왼쪽)
   v28: 돈이 움직이는 길 네 칸 장면 (iso_40~43, 칸마다 한 줄, 원화로 바꿔요는 넷째 칸 아래)
   v27: 목록 행 3D 아이콘 40px (모서리 16 정사각 바탕 위, 한 행에 하나, 빈 alt). 사람 자리는 이름 글자 원 그대로
   v26: 장면마다 전용 히어로 (그림 배정표, 금액 결과는 작은 사물 96px, 웹용 webp), 탭 첫 화면 순서, 되돌리기 어려운 확인 창 한 줄
   v25: 화면 밖 문구 (알림 배너, 알림 한 줄, 토스트, 확인 창, 화면 읽기 이름도 같은 규칙)
   v24: 숫자 표기 (금액은 숫자 뒤 '원', 날짜 '11월 21일 토요일', 시각 '오전 9:00', 덜 받는 돈은 말로, 원 단위 아래 버림 한 번)
   v23: 쉬운 말 (헷갈린 말을 바꾸거나 처음 나올 때 한 줄 풀이, 외래어와 법률 말 줄이기)
   v22: 숨은 감정과 제안 (돈이 묶이는 부담, 감시받는 느낌, 탓받는 느낌을 주는 문장을 바꿈)
   v21: 잡초 뽑기와 빈 문장 빼기 (에러 2문장, 빈 상태 1문장, 카드 2문장, 본문 3문장, 같은 뜻 두 번 금지)
   v20: 돈이 움직이는 문장은 주어가 보이는 능동형 (사장님이 확정하면 체무가 보관해요)
   v19: 버튼은 누르면 일어날 일. 비활성 버튼 이유는 버튼 위 한 줄(.dock-why)
   v18: 제목만 읽어도 상태. 탭 첫 화면도 상단 바는 이름표, 본문 큰 제목이 상태. 글자 200%에서 제목은 36px에서 멈춤
   v17: 용어집 한 이름, 사건 표(../design/EVENTS.md) 한 문장 틀
   v16: 화면 문구를 토스 공개 라이팅 원칙 규칙집 기준선에 맞춤 (../design/UX_WRITING_RULES.md)
   v15: 제목만 읽어도 상태가 보이게, 3D 그림은 한 메시지 화면에만 200~260px (COMPONENTS_owner.md)
   v14: 완료 순간에만 짧은 움직임 (MOTION_owner.md)
   v13: 에러, 실패, 빈 상태를 한 틀로 (토스 좋은 에러 메시지 6원칙)
   v10: 접근성 마무리 (누르는 대상 44px, 대화상자 포커스, 글자 크기 200%, 움직임 줄이기)
   v9: 역할 이름 토큰, 글자 일곱 단계(rem), 명암비
   v8 뼈대(TDS·SEED 구조 대조)는 그대로 두고 값을 토큰으로 바꿈. 토큰 표는 TOKENS.md, tokens.json
   - 색은 속성(fg, bg, stroke) × 역할(neutral, brand, positive, warning, critical, informative, layer) [SEED-Color]
   - 글자 30, 26, 22, 20, 17, 15, 13px 일곱 단계만, rem으로 [TDS-Type, SEED-Type, HIG-A11y]
   - 본문 글자 4.5:1, 큰 글자와 UI 부품 3:1 [WCAG22 1.4.3, WCAG-1.4.11]
   ========================================================= */
:root{
  /* 글자와 아이콘 (fg) */
  --fg-neutral:#19181d;                    /* 제목, 강한 글자 (v2 --c-ink) */
  --fg-neutral-secondary:#47454f;          /* 설명 글자 (v2 --c-body) */
  --fg-neutral-muted-on-basement:#66636e;  /* 보조 글자, 화면 바탕과 옅은 색 바탕 위 (v2 --c-mute #8a8792) */
  --fg-neutral-muted:var(--fg-neutral-muted-on-basement);  /* 쓰는 이름. 흰 카드 안에서는 아래 값으로 바뀜 */
  --fg-neutral-muted-on-layer:#6e6b76;     /* 보조 글자, 흰 카드 위 */
  --fg-neutral-ui:#8a8792;                 /* 화살표, 연필 같은 UI 아이콘 (3:1 부품) */
  --fg-neutral-inverted:#ffffff;           /* 먹색 위 글자 */
  --fg-neutral-inverted-muted:rgba(255,255,255,.7);
  --fg-neutral-inverted-subtle:rgba(255,255,255,.6);
  --fg-brand:#5b4bdb;                      /* 글자 버튼, 강조 배지 글자 (v2 --c-accent) */
  --fg-brand-on-dark:#a89dff;              /* 먹색 카드 위 강조 (v2 --c-accent-light) */
  --fg-informative:#0a6658;                /* 안내 글자 (v2 --c-news #0f8574) */
  --fg-informative-icon:#0f8574;           /* 안내 아이콘과 점 */
  --fg-warning:#8f5200;                    /* 주의 글자 (v2 --c-help #c27200) */
  --fg-warning-icon:#c27200;               /* 주의 아이콘과 점 */
  --fg-critical:#d6383e;                   /* 위험 글자, 흰 바탕 위 (v2 --c-urgent) */
  --fg-critical-on-weak:#c02a30;           /* 위험 글자, 옅은 빨강 바탕 위 */
  --fg-positive:var(--fg-informative);     /* 보관됨, 확정: 체무는 초록 계열 하나를 안내와 함께 씀 */
  --fg-positive-icon:var(--fg-informative-icon);
  --fg-disabled:var(--fg-neutral-muted-on-basement);
  /* 바탕 (bg) */
  --bg-layer-basement:#f4f3f0;             /* 화면 바탕, 따뜻한 회색 (v2 --c-page) */
  --bg-layer-default:#ffffff;              /* 카드, 목록 묶음 (v2 --c-card) */
  --bg-layer-default-pressed:#fafaf8;
  --bg-layer-floating:#ffffff;             /* 다이얼로그, 알림 배너 */
  --bg-neutral-solid:#19181d;              /* 채운 주 버튼, 먹색 카드, 토스트 */
  --bg-neutral-solid-pressed:#000000;
  --bg-neutral-inverted:rgba(25,24,29,.94);/* 떠 있는 탭바 */
  --bg-neutral-weak:#ecebe8;               /* 회색 배지, 세그먼트 바탕, 비활성 버튼 (v2 --c-daily-soft) */
  --bg-neutral-weak-alpha:rgba(25,24,29,.07);         /* 옅은 버튼 */
  --bg-neutral-weak-alpha-pressed:rgba(25,24,29,.12);
  --bg-neutral-strong:#8a8792;             /* 꺼진 스위치, 근무표의 다른 사람 칸 (3:1) */
  --bg-brand-solid:#5b4bdb;                /* 켜진 스위치, 내 근무 칸, 읽지 않음 점 */
  --bg-brand-weak:#ece9fd;                 /* 보관된 돈 카드, 강조 배지 (v2 --c-accent-soft) */
  --bg-informative-solid:#0f8574;          /* 보관 단계 표시 */
  --bg-informative-weak:#e1f2ef;           /* (v2 --c-news-soft) */
  --bg-positive-weak:var(--bg-informative-weak);
  --bg-positive-solid:var(--bg-informative-solid);
  --bg-warning-weak:#faefdc;               /* (v2 --c-help-soft) */
  --bg-critical-solid:#d6383e;             /* 알림 개수 배지 */
  --bg-critical-weak:#fbe8e8;              /* (v2 --c-urgent-soft) */
  --bg-overlay:rgba(25,24,29,.45);         /* 시트와 다이얼로그 딤 */
  /* 선 (stroke) */
  --stroke-neutral-weak:#e6e4df;           /* 칩과 요일 칸 테두리, 상단 바 아래 선 (v2 --c-line) */
  --stroke-neutral-subtle:#efede9;         /* 목록 행 사이 구분선 (v2 --c-line2) */
  --stroke-neutral-strong:#8a8792;         /* 입력칸, 체크 상자, 고른 세그먼트 테두리 (3:1) */
  --stroke-neutral-solid:#19181d;          /* 고르는 중인 금액, 날짜 입력칸 테두리 */
  --stroke-informative:#0f8574;            /* 근무 중 카드 테두리 */
  --stroke-inverted-subtle:rgba(255,255,255,.12);
  /* 간격 [SEED-Spacing] */
  --space-gutter:24px; --space-gutter-table:20px; --space-component:12px; --space-section:24px; --space-screen-bottom:56px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px;
  /* 모서리 [SEED-Radius] */
  --radius-s:8px; --radius-m:16px; --radius-l:24px; --radius-full:9999px;
  /* 글자 크기: TDS Typography 1~7과 같은 일곱 단계, rem이라 사용자 글자 크기를 따름 [TDS-Type] */
  --type-t1:1.875rem;  /* 30 */
  --type-t2:1.625rem;  /* 26 */
  --type-t3:1.375rem;  /* 22 */
  --type-t4:1.25rem;   /* 20 */
  --type-t5:1.0625rem; /* 17 */
  --type-t6:.9375rem;  /* 15 */
  --type-t7:.8125rem;  /* 13 */
  /* 움직임 (v14). 완료 순간만, 400ms 안, 반복 없음 */
  --motion-rise:320ms;        /* 3D 그림, 결과 표시가 아래에서 8px 떠오름 */
  --motion-draw:240ms;        /* 체크 표시 그리기 */
  --motion-draw-delay:80ms;   /* 떠오름이 조금 진행된 뒤 그리기 시작, 끝은 320ms */
  --motion-toast:200ms;       /* 토스트가 아래에서 올라옴 */
  --motion-sheet:240ms;       /* 바텀시트 */
  --motion-screen:300ms;      /* 화면 전환 (v3 값 유지) */
  --motion-modal:320ms;       /* 전체 화면 열기 (v3 값 유지) */
  --motion-rise-distance:8px;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --font:'IBM Plex Sans KR', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
}
/* 흰 카드 위 보조 글자는 흰 바탕용 값으로 (#6e6b76, 5.21:1) */
.group,.card,.paper,.quote,.flow,.calc,.steps,.diff > div,.amt-box,.mpair > div,.wk,.store-band,.dialog,.push,.datef,.ta{--fg-neutral-muted:var(--fg-neutral-muted-on-layer)}
.result .steps,.payday .steps,.diff .boss,.mpair .lk{--fg-neutral-muted:var(--fg-neutral-muted-on-basement)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:#d9d7d2;color:var(--fg-neutral);overflow:hidden;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
.i *{vector-effect:non-scaling-stroke}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* 무대 (휴대폰 틀은 측정 대상이 아님, px 그대로) */
.stage{height:100vh;display:flex;align-items:center;justify-content:center;gap:48px}
.device{flex:none;width:417px;height:876px;padding:12px;border-radius:67px;background:#1c1b20;box-shadow:0 0 0 2px #35333b,0 30px 60px rgba(0,0,0,.18);transform:scale(var(--s,1))}
.screen{position:relative;width:393px;height:852px;border-radius:55px;overflow:hidden;background:var(--bg-layer-basement)}
.island{position:absolute;z-index:600;top:11px;left:50%;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000}
.statusbar{position:absolute;z-index:500;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 28px 0 50px;pointer-events:none;font-weight:600;font-size:16px;color:var(--fg-neutral)}
.statusbar .sb-r{display:flex;gap:6px;align-items:center}
.home-ind{position:absolute;z-index:600;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--fg-neutral);pointer-events:none}
@media (max-width:900px){.stage{justify-content:flex-start;padding-left:11px}}

/* 화면 목록 패널 (휴대폰 밖, 발표용이라 px 그대로) */
.panel{width:262px;max-height:94vh;display:flex;flex-direction:column;padding:0;border-radius:0;background:transparent;overflow:visible;scrollbar-width:none}
.panel::-webkit-scrollbar{display:none}
.plist{position:relative;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-right:2px}
.plist::-webkit-scrollbar{display:none}
.panel h2{font-size:22px;font-weight:800;color:var(--fg-neutral);margin-bottom:4px;letter-spacing:-.03em}
.panel .sub{font-size:12.5px;color:#666;margin-bottom:6px;line-height:1.5}
.panel h3{font-size:12px;font-weight:700;color:#5b4bdb;margin:12px 0 2px;letter-spacing:0}
.panel button{display:block;width:100%;min-height:30px;padding:5px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:#333;line-height:1.35}
.panel button:hover{background:rgba(0,0,0,.06)}
.panel button.on{background:var(--bg-neutral-solid);color:#fff}
.panel button .nw{display:inline-block;margin-left:6px;padding:0 5px;border-radius:5px;background:var(--bg-brand-weak);color:var(--fg-brand);font-size:10px;font-weight:700;line-height:16px;vertical-align:1px}
.panel button.on .nw{background:rgba(255,255,255,.18);color:#fff}
.panel button .nw.v6{background:#e1f2ef;color:#0f8574}
.panel button .nw.v7{background:#faefdc;color:#c27200}
.panel button .nw.v13{background:#fbe8e8;color:#c02a30}
/* v10: 글자 크기 전환 (휴대폰 안 rem만 바뀜) [WCAG22 1.4.4, TDS-Type] */
.fsw{display:flex;align-items:center;gap:6px;margin:4px 0 10px;font-size:12.5px;font-weight:700;color:#333}
.fsw > span{margin-right:4px}
.panel .fsw button{display:inline-block;width:auto;min-height:30px;padding:4px 10px;border-radius:999px;background:#fff;font-size:12.5px;font-weight:700;color:#333;box-shadow:inset 0 0 0 1px #cfccc6}
.panel .fsw button.on{background:#19181d;color:#fff;box-shadow:none}
.pnote{flex:none;margin-top:12px;padding:14px 14px 12px;border-radius:16px;background:#fff;font-size:12px;line-height:1.55;color:var(--fg-neutral-secondary)}
.pnote b{display:block;margin-bottom:6px;font-size:13.5px;color:var(--fg-neutral)}
.pnote dl{display:grid;grid-template-columns:auto 1fr;gap:3px 8px}
.pnote dt{font-weight:700;color:var(--fg-brand)}
.pnote dd{margin:0}
.pnote .empty-n{color:#8a8792}
@media (max-width:900px){.panel{display:none}}

/* 화면 틀 */
#viewport{position:absolute;inset:0;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg-layer-basement);transition:transform var(--motion-screen) var(--ease-out)}
.view.enter{transform:translateX(100%)}
.view.under{transform:translateX(-24%)}
.view.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.vtop{flex:none;height:54px;background:var(--bg-layer-basement)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:var(--space-2) var(--space-gutter) var(--space-screen-bottom)}
.scroll.wide{padding-left:var(--space-gutter-table);padding-right:var(--space-gutter-table)}
.scroll::-webkit-scrollbar,.chips::-webkit-scrollbar,.sheet-body::-webkit-scrollbar,.ob-body::-webkit-scrollbar,.mbody::-webkit-scrollbar{display:none}
.view.root .scroll{padding-bottom:calc(24px + 42px + 1.6rem + var(--space-section))}

/* 상단 바 56px [SEED-TopNav]. 탭 첫 화면 큰 제목 26(t2), 부제목 17(t5) [TDS-Top] */
.tab-head{flex:none;display:flex;align-items:center;gap:var(--space-2);height:56px;padding:0 12px 0 var(--space-gutter);background:var(--bg-layer-basement);transition:box-shadow .2s}
.tab-head h1{flex:1;min-width:0;font-size:var(--type-t2);font-weight:700;line-height:1.35;color:var(--fg-neutral);letter-spacing:-.03em}
.tab-head .tab-name{flex:1;min-width:0;font-size:var(--type-t5);font-weight:700;line-height:1.3;color:var(--fg-neutral)}
.tab-lead{margin-bottom:var(--space-1)}
.top-sub{margin-bottom:var(--space-4);font-size:var(--type-t5);font-weight:500;line-height:1.45;color:var(--fg-neutral-muted)}
.head-ic{position:relative;flex:none;width:44px;height:44px;border-radius:var(--radius-full);display:grid;place-items:center;color:var(--fg-neutral);background:transparent}
.head-ic:active{background:var(--stroke-neutral-subtle)}
.head-ic b{position:absolute;top:2px;right:2px;min-width:1.25rem;height:1.25rem;padding:0 5px;border-radius:var(--radius-full);border:2px solid var(--bg-layer-basement);background:var(--bg-critical-solid);color:var(--fg-neutral-inverted);font-size:var(--type-t7);font-weight:700;line-height:calc(1.25rem - 4px);text-align:center}
/* 뒤로 가기(<)는 이전 화면. 제목은 상태를 담으므로 두 줄까지 (v6) */
.back-head{flex:none;display:flex;align-items:center;gap:var(--space-1);height:56px;padding:0 12px;background:var(--bg-layer-basement);transition:box-shadow .2s}
.back-head h2,.back-head .h-t{flex:1;min-width:0;font-size:var(--type-t5);font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.back-head .act{font-size:var(--type-t6);font-weight:600;color:var(--fg-brand);padding:0 var(--space-3);min-height:44px;white-space:nowrap}
.back-head > span{display:none}
.scrolled{box-shadow:0 1px 0 var(--stroke-neutral-weak)}
/* 다른 가게(동네 식당) 화면 머리 (v6) */
.store-band{flex:none;display:flex;align-items:center;gap:var(--space-2);margin:0 var(--space-gutter) var(--space-2);padding:var(--space-2) var(--space-3);border-radius:var(--radius-s);background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-weak);font-size:var(--type-t7);font-weight:700;color:var(--fg-neutral)}
.store-band .i{color:var(--fg-warning-icon)}
.store-band small{margin-left:auto;font-size:var(--type-t7);font-weight:600;color:var(--fg-warning)}

/* 하단 고정 CTA [TDS-BottomCTA]: 위 12, 좌우 24, 아래 max(안전 영역, 20px). 위쪽 24px 페이드만 그라데이션 */
.dock{position:relative;flex:none;display:flex;gap:var(--space-2);padding:var(--space-3) var(--space-gutter) max(env(safe-area-inset-bottom),20px);background:var(--bg-layer-basement);transition:visibility 0s}
.dock-why{flex-basis:100%;margin:0;font-size:var(--type-t6);line-height:1.45;color:var(--fg-neutral-secondary)}
.dock:has(.dock-why){flex-wrap:wrap}
.dock::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:var(--space-6);background:linear-gradient(rgba(244,243,240,0),var(--bg-layer-basement));pointer-events:none}
/* 시트나 다이얼로그가 열리면 뒤 화면은 inert. 그 아래 가려진 하단 CTA는 숨겨 버튼을 하나만 남김 */
.screen.ovl #viewport .dock,.screen.ovl #modal .dock{visibility:hidden;transition:visibility 0s .2s}

/* 하단 탭: 떠 있는 탭바, 네 칸 [AIT-UX] */
.tabbar{position:absolute;z-index:50;left:16px;right:16px;bottom:24px;min-height:66px;display:flex;gap:var(--space-2);padding:var(--space-2);border-radius:var(--radius-l);background:var(--bg-neutral-inverted);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.tabbar.hide{transform:translateY(160%)}
.tabbar > button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:var(--radius-m);font-size:var(--type-t7);font-weight:500;line-height:1.2;color:var(--fg-neutral-inverted-subtle)}
.tabbar > button.on{background:rgba(255,255,255,.12);color:var(--fg-neutral-inverted);font-weight:700}

/* 공통 부품 */
.mt8{margin-top:var(--space-2)}.mt12{margin-top:var(--space-component)}.mt16{margin-top:var(--space-4)}.mt24{margin-top:var(--space-6)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-2);margin:var(--space-section) 0 var(--space-3);font-size:var(--type-t6);font-weight:700;color:var(--fg-neutral)}
.sec-h button{min-height:44px;min-width:44px;margin-right:calc(-1 * var(--space-2));padding:0 var(--space-2);font-size:var(--type-t7);font-weight:500;color:var(--fg-brand)}
.sec-h:has(> button){align-items:center;margin-top:var(--space-3);margin-bottom:var(--space-2)}
.sec-h:first-child{margin-top:0}
.sec-h .sr{font-size:var(--type-t7);font-weight:500;color:var(--fg-neutral-muted)}

/* 버튼 [TDS-Button, SEED-ActionButton]: 채운 버튼(fill)은 화면에 하나, 나머지는 옅은 버튼(weak) */
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:var(--space-2);width:100%;min-height:56px;padding:var(--space-2) var(--space-3);border-radius:var(--radius-m);background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted);font-size:var(--type-t5);font-weight:600;line-height:1.3;text-align:center;white-space:nowrap;transition:transform .12s,background .12s}
.btn:active{transform:scale(.98);background:var(--bg-neutral-solid-pressed)}
a.btn{text-decoration:none}   /* v39: 다른 페이지를 여는 버튼 */
.btn.sec{background:var(--bg-neutral-weak-alpha);color:var(--fg-neutral)}
.btn.sec:active{background:var(--bg-neutral-weak-alpha-pressed)}
.btn.danger{background:var(--bg-critical-solid)}
.btn.done{background:var(--bg-informative-weak);color:var(--fg-informative)}
.btn.sm{min-height:44px;font-size:var(--type-t6)}
/* 비활성: 글자도 4.5:1을 지켜 무엇을 기다리는지 읽히게 */
.btn[disabled]{background:var(--bg-neutral-weak);color:var(--fg-disabled);transform:none;cursor:default}
.btnrow{display:flex;gap:var(--space-2);margin-top:var(--space-4)}
.link-btn{display:inline-flex;align-items:center;min-height:44px;padding:0;font-size:var(--type-t6);font-weight:600;color:var(--fg-brand)}

/* 배지 [TDS-Badge]: 옅은 바탕에 글자. 상태는 늘 글자로 [SEED-Inclusive] */
.tags{display:flex;flex-wrap:wrap;gap:var(--space-2) 6px}
.tag{display:inline-flex;align-items:center;min-height:1.5rem;padding:0 var(--space-2);border-radius:var(--radius-full);font-size:var(--type-t7);font-weight:600;background:var(--bg-neutral-weak);color:var(--fg-neutral-secondary)}
.tag.ok{background:var(--bg-positive-weak);color:var(--fg-positive)}
.tag.warn{background:var(--bg-warning-weak);color:var(--fg-warning)}
.tag.danger{background:var(--bg-critical-weak);color:var(--fg-critical-on-weak)}
.tag.acc{background:var(--bg-brand-weak);color:var(--fg-brand)}

/* 알약 칩 */
.chips{display:flex;gap:var(--space-2);overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--space-gutter));padding:0 var(--space-gutter) var(--space-1)}
.chip{flex:none;display:inline-flex;align-items:center;height:36px;padding:0 var(--space-4);border-radius:var(--radius-full);background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-strong);color:var(--fg-neutral-secondary);font-size:var(--type-t7);font-weight:600}
.chip.on{background:var(--bg-neutral-solid);box-shadow:none;color:var(--fg-neutral-inverted)}

/* 단일 선택 [TDS-Segmented]: 고른 칸은 흰 바탕과 3:1 테두리, 굵은 글자 (색만으로 알리지 않음) */
.seg{display:flex;gap:var(--space-2);padding:var(--space-1);margin-bottom:var(--space-4);border-radius:var(--radius-m);background:var(--bg-neutral-weak)}
.seg > *{flex:1;display:grid;place-items:center;min-height:44px;padding:var(--space-1) var(--space-2);border-radius:var(--radius-s);font-size:var(--type-t6);font-weight:500;color:var(--fg-neutral-secondary);text-align:center}
.seg > .on{background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-strong);color:var(--fg-neutral);font-weight:700}

/* 카드 */
.card{display:block;width:100%;padding:var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default);text-align:left;position:relative}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--bg-layer-default-pressed)}
.card.acc{box-shadow:inset 0 0 0 2px var(--stroke-informative)}
.card + .card{margin-top:var(--space-component)}
.c-row{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);margin-top:var(--space-2)}
.c-title{font-size:var(--type-t5);font-weight:700;line-height:1.4}
.tags + .c-title{margin-top:var(--space-2)}
.c-title.big{font-size:var(--type-t3);font-weight:700;letter-spacing:-.02em}
.c-body{margin-top:var(--space-1);font-size:var(--type-t6);line-height:1.5;color:var(--fg-neutral-secondary)}
.c-price{flex:none;font-size:var(--type-t5);font-weight:700}

/* 먹색 카드 (v8에서 보라 글로우를 뺌) */
.pcard{display:block;width:100%;padding:var(--space-6) 20px var(--space-4);border-radius:var(--radius-m);background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted);text-align:left;position:relative}
.pc-top{display:flex;align-items:flex-start;gap:var(--space-3)}
.pc-ic{flex:none;order:2;width:40px;height:40px;border-radius:var(--radius-full);display:grid;place-items:center;background:rgba(255,255,255,.1);color:var(--fg-neutral-inverted)}
.pc-dday{flex:none;order:2;display:grid;place-items:center;min-height:2rem;padding:0 var(--space-3);border-radius:var(--radius-full);background:rgba(255,255,255,.1);color:var(--fg-neutral-inverted);font-size:var(--type-t7);font-weight:700}
.pc-top .m{flex:1;min-width:0}
.pc-top small{display:block;font-size:var(--type-t7);font-weight:500;color:var(--fg-neutral-inverted-subtle)}
.pc-top b{display:block;margin:var(--space-1) 0;font-size:var(--type-t1);font-weight:700;letter-spacing:-.03em}
.pc-top b.pc-name{font-size:var(--type-t3)}
.pc-top p{font-size:var(--type-t6);color:var(--fg-neutral-inverted-muted)}
.pc-bot{margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--stroke-inverted-subtle)}
.pc-line{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);font-size:var(--type-t7);font-weight:600}
.pc-line + .pc-line{margin-top:var(--space-2)}
.pc-line span{font-weight:500;color:var(--fg-neutral-inverted-muted)}
.pc-line .lbl{font-weight:600;color:var(--fg-neutral-inverted)}
.pc-line .num{flex:none;font-size:var(--type-t6);font-weight:700;color:var(--fg-neutral-inverted)}
.pc-line .acc{color:var(--fg-brand-on-dark);font-weight:700}
.pc-line em{font-style:normal;font-weight:500;color:var(--fg-neutral-inverted-subtle)}
.pc-bot small{display:block;margin-top:var(--space-2);font-size:var(--type-t7);line-height:1.5;color:var(--fg-neutral-inverted-subtle)}

/* 목록 [TDS-ListRow]: 행 위아래 12, 왼쪽 24px 아이콘 또는 40px 원, 들여쓴 구분선 */
.group{border-radius:var(--radius-m);overflow:hidden;background:var(--bg-layer-default)}
.row{position:relative;display:flex;align-items:center;gap:var(--space-3);width:100%;min-height:56px;padding:var(--space-3) var(--space-4);text-align:left}
.row + .row::before{content:'';position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--stroke-neutral-subtle)}
.row + .row:has(> .ri)::before,.row + .row:has(> .ck)::before{left:52px}
.row + .row:has(> .av)::before,.row + .row:has(> .ri3)::before{left:68px}
/* v27: 행 아이콘은 3D 아이콘 하나. 모든 행 같은 처리: 40px 정사각, 모서리 16, 화면 바탕색(#f4f3f0) 위에 아이콘. 장식이라 빈 alt와 aria-hidden [GRAPHIC_RULES 4.3, TDS ListRow 3D 이모지 높이 40] */
.ri3{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:var(--radius-m);overflow:hidden;isolation:isolate;background:var(--bg-layer-basement)}
.ri3 img{display:block;width:36px;height:36px;object-fit:contain;filter:brightness(1.06);mix-blend-mode:darken}
.row.tap{cursor:pointer}
.row.tap:active{background:var(--bg-layer-default-pressed)}
.ri{flex:none;width:24px;height:24px;display:grid;place-items:center;color:var(--fg-neutral-secondary)}
.ri.acc{color:var(--fg-brand)}
.ri.ok{color:var(--fg-positive-icon)}
.ri.warn{color:var(--fg-warning-icon)}
.ri.danger{color:var(--fg-critical)}
.av{flex:none;width:40px;height:40px;border-radius:var(--radius-full);display:grid;place-items:center;background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted);font-size:var(--type-t6);font-weight:700}
.av.rest{background:var(--bg-neutral-weak);color:var(--fg-neutral-secondary)}
.rm{flex:1;min-width:0;display:flex;flex-direction:column}
.rt{font-size:var(--type-t6);font-weight:600;line-height:1.4}
.rt.mute{color:var(--fg-neutral-muted)}
.rs{font-size:var(--type-t7);line-height:1.45;color:var(--fg-neutral-muted)}
.rm .tags{margin-top:var(--space-2)}
.rr{flex:none;font-size:var(--type-t6);color:var(--fg-neutral-muted);text-align:right}
.rr.strong{color:var(--fg-neutral);font-weight:700}
.rr.acc{color:var(--fg-brand);font-weight:700}
.chev{flex:none;display:flex;color:var(--fg-neutral-ui)}
.dot{flex:none;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bg-brand-solid)}
.ck{position:relative;flex:none;width:24px;height:24px;border-radius:var(--radius-s);border:2px solid var(--stroke-neutral-strong);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.ck::before{content:'';position:absolute;inset:-10px}
.ck.on{border-color:var(--bg-neutral-solid);background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted)}
.rk{flex:none;display:flex;color:transparent}
.rk.on{color:var(--fg-neutral)}
.pick .rm .rt{font-weight:700}
.row .btn.sm{flex:none;width:auto;min-height:44px;padding:0 var(--space-3);font-size:var(--type-t7)}

/* 단계 목록: 24px 원 표시와 가는 선 */
.steps{display:flex;flex-direction:column;padding:var(--space-2) var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default)}
.result .steps,.payday .steps{background:transparent;padding:0}
.step{position:relative;display:flex;align-items:center;gap:var(--space-3);width:100%;padding:var(--space-3) 0;text-align:left}
.step::before{content:'';position:absolute;left:11.5px;top:36px;bottom:-12px;width:1px;background:var(--stroke-neutral-weak)}
.steps > :last-child::before{display:none}
.step.top{align-items:flex-start}
.st-c{position:relative;z-index:1;flex:none;width:24px;height:24px;border-radius:var(--radius-full);display:grid;place-items:center;background:var(--bg-neutral-weak);color:var(--fg-neutral-muted);transition:background .3s,color .3s}
.st-c svg{width:16px;height:16px}
.step.cur .st-c,.step.done .st-c{background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted)}
.step.ok .st-c{background:var(--bg-informative-solid);color:var(--fg-neutral-inverted)}
.step.warn .st-c{background:var(--bg-warning-weak);color:var(--fg-warning-icon)}
.step.bad .st-c{background:var(--bg-critical-weak);color:var(--fg-critical)}
.st-m{flex:1;min-width:0}
.st-t{font-size:var(--type-t6);font-weight:600;line-height:1.6}
.step.next .st-t{color:var(--fg-neutral-muted)}
.st-s{font-size:var(--type-t7);line-height:1.5;color:var(--fg-neutral-muted)}
.st-m .tags{margin-top:var(--space-2)}
.st-r{flex:none;font-size:var(--type-t7);font-weight:700;line-height:1.85;color:var(--fg-brand)}
.st-r.mute{font-weight:500;color:var(--fg-neutral-muted)}

/* 금액이 제목인 머리 [TDS-Top]: 위 15, 금액 26, 아래 17 */
.sum{padding:0}
.sum-k{font-size:var(--type-t6);font-weight:500;color:var(--fg-neutral-muted)}
.sum-big{margin-top:var(--space-1);font-size:var(--type-t2);font-weight:700;letter-spacing:-.03em}
.sum-big.acc{color:var(--fg-neutral)}
.sum-s{margin-top:var(--space-1);font-size:var(--type-t5);line-height:1.5;color:var(--fg-neutral-secondary)}
.sum .tags{margin-top:var(--space-3)}

/* 화면 머리 [TDS-Top]: 위 15, 제목 22, 아래 부제목 17 */
.lead-k{margin-bottom:var(--space-1);font-size:var(--type-t6);font-weight:500;color:var(--fg-neutral-muted)}
.lead-t{font-size:var(--type-t3);font-weight:700;line-height:1.4;letter-spacing:-.02em}
.sum-t{margin-top:var(--space-1);font-size:var(--type-t2);font-weight:700;line-height:1.3;letter-spacing:-.03em}
.lead-s.conf-pay{margin-top:0}
.lead-s{margin-top:var(--space-2);font-size:var(--type-t5);line-height:1.5;color:var(--fg-neutral-secondary)}

.diff{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-4)}
.diff div{padding:var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default)}
.diff small{display:block;font-size:var(--type-t7);font-weight:500;color:var(--fg-neutral-muted)}
.diff b{display:block;margin-top:var(--space-1);font-size:var(--type-t4);font-weight:700}
.diff .boss{background:var(--bg-warning-weak)}
.diff .boss b{color:var(--fg-warning)}
.diff b.tfield{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}
.tfield .i{color:var(--fg-neutral-ui)}
.diff .tap{cursor:pointer}

/* 안내 상자: 아이콘 24px과 글자를 함께 (색만으로 알리지 않음) */
.callout{display:flex;gap:var(--space-3);margin-top:var(--space-component);padding:var(--space-4);border-radius:var(--radius-m);background:var(--bg-warning-weak)}
.callout .i{flex:none;color:var(--fg-warning-icon)}
.callout b{display:block;font-size:var(--type-t6);font-weight:700;line-height:1.6;color:var(--fg-warning)}
.callout span{font-size:var(--type-t7);line-height:1.55;color:var(--fg-neutral-secondary)}
.callout.danger{background:var(--bg-critical-solid)}
.callout.danger .i,.callout.danger b,.callout.danger span,.callout.danger .chev{color:var(--fg-neutral-inverted)}
.callout.danger .btn.sec{background:rgba(255,255,255,.16);color:var(--fg-neutral-inverted)}
.callout.ok{background:var(--bg-informative-weak)}
.callout.ok .i{color:var(--fg-informative-icon)}
.callout.ok b{color:var(--fg-informative)}
.callout.acc{background:var(--bg-brand-weak)}
.callout.acc .i,.callout.acc b{color:var(--fg-brand)}
.callout .btnrow{margin-top:var(--space-3)}
.callout .btn.sm{min-height:44px;font-size:var(--type-t6)}
.callout.tap{cursor:pointer}
.callout .chev{align-self:center;color:var(--fg-neutral-secondary)}
/* 맺음 글 */
.note{margin-top:var(--space-4);font-size:var(--type-t7);line-height:1.55;color:var(--fg-neutral-muted)}
.note + .note{margin-top:var(--space-2)}
.note .cite{display:block;margin-top:var(--space-1);font-size:inherit}

.paper{margin-top:var(--space-component);padding:var(--space-6) var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default)}
.paper h3{font-size:var(--type-t5);font-weight:700}
.paper .pm{margin-top:var(--space-1);font-size:var(--type-t7);color:var(--fg-neutral-muted);line-height:1.55}
.paper table{width:100%;margin-top:var(--space-3);border-collapse:collapse;font-size:var(--type-t7)}
.paper th{padding:var(--space-2) 4px;border-bottom:1px solid var(--stroke-neutral-weak);text-align:left;font-weight:600;color:var(--fg-neutral-muted)}
.paper td{padding:var(--space-2) 4px;border-bottom:1px solid var(--stroke-neutral-subtle)}
.paper td:last-child,.paper th:last-child{text-align:right}
.paper table.ex th,.paper table.ex td{text-align:left;vertical-align:top;line-height:1.5}
.paper table.ex th:first-child,.paper table.ex td:first-child{width:60px;color:var(--fg-neutral-muted);font-weight:600}
.paper table.ex thead th{color:var(--fg-neutral);font-size:var(--type-t7)}
.paper table.ex td b{font-size:var(--type-t6)}
.paper table.ex .lkc{color:var(--fg-brand)}
.kv{display:flex;justify-content:space-between;padding:var(--space-3) 0;border-bottom:1px dashed var(--stroke-neutral-weak);font-size:var(--type-t6)}
.kv span{color:var(--fg-neutral-muted)}
.kv b{font-weight:600}
.kv.total{border-bottom:0;padding-top:var(--space-4);font-size:var(--type-t6)}
.kv.total b{font-size:var(--type-t3);font-weight:700;color:var(--fg-neutral)}
.foot{padding:var(--space-6) 0 0;text-align:center;font-size:var(--type-t7);color:var(--fg-neutral-muted)}

/* 전체 화면 (독립 흐름): 상단 바 56px 왼쪽 닫기(X) [SEED-TopNav] */
.modal{position:absolute;z-index:250;inset:0;padding-top:54px;display:flex;flex-direction:column;background:var(--bg-layer-basement);transform:translateY(100%);transition:transform var(--motion-modal) var(--ease-out)}
.modal.open{transform:none}
.modal.noanim{transition:none}
.mhead{flex:none;display:flex;align-items:center;gap:var(--space-1);min-height:56px;padding:0 12px}
.mhead span{font-size:var(--type-t5);font-weight:700;color:var(--fg-neutral)}
.mbody{flex:1;overflow-y:auto;padding:var(--space-2) var(--space-gutter) var(--space-6);scrollbar-width:none;display:flex;flex-direction:column}
.modal .dock{background:var(--bg-layer-basement)}
.modal .store-band{margin:0 var(--space-gutter) var(--space-2)}

.result .r-ic{width:56px;height:56px;border-radius:var(--radius-full);display:grid;place-items:center;background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted);margin:var(--space-2) 0 var(--space-6)}
.result h2{font-size:var(--type-t2);font-weight:700;line-height:1.3;letter-spacing:-.03em}
.result h2.t22{font-size:var(--type-t3);line-height:1.4;letter-spacing:-.02em}
.result .amt{margin-top:var(--space-2);font-size:var(--type-t5);line-height:1.5;color:var(--fg-neutral-secondary)}
.result .steps{margin-top:var(--space-6)}
.result .hero{margin:0 0 var(--space-6)}
.result .obj{margin:var(--space-2) 0 var(--space-6)}

.payday{flex:1;display:flex;flex-direction:column}
.payday .pk{margin-top:var(--space-6);font-size:var(--type-t6);font-weight:500;color:var(--fg-neutral-muted)}
.payday .pa{margin-top:var(--space-1);font-size:var(--type-t2);font-weight:700;line-height:1.3;letter-spacing:-.03em}
.payday .pd{margin-top:var(--space-1);font-size:var(--type-t5);line-height:1.5;color:var(--fg-neutral-secondary);min-height:24px}
.payday .steps{margin:var(--space-6) 0 0}
/* v37: 금액 결과 화면 정렬을 두 앱이 하나로 [판단 v30-14]. 작은 사물, 금액 제목, 보조 줄은 가운데, 그 아래 진행 단계 목록은 왼쪽 */
.mres > .obj,.mres > h2,.mres > .amt,.mres > .pk,.mres > .pa,.mres > .pd{text-align:center}
.mres > .obj{align-self:center}

/* 온보딩 (독립 흐름) */
.ob-top{flex:none;position:relative;min-height:56px}
.ob-top .head-ic{position:absolute;left:12px;top:6px}
.ob-body{flex:1;overflow-y:auto;padding:var(--space-2) var(--space-gutter) var(--space-6);scrollbar-width:none}
.ob-title{margin:var(--space-4) 0 var(--space-2);font-size:var(--type-t2);line-height:1.3;font-weight:700;letter-spacing:-.03em}
.ob-lead{margin-bottom:var(--space-6);font-size:var(--type-t5);line-height:1.55;color:var(--fg-neutral-secondary)}
.ob-foot{position:relative;flex:none;padding:var(--space-3) var(--space-gutter) max(env(safe-area-inset-bottom),20px)}
.ob-foot::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:var(--space-6);background:linear-gradient(rgba(244,243,240,0),var(--bg-layer-basement));pointer-events:none}
.dots{display:flex;gap:var(--space-2);padding:0 0 var(--space-4)}
.dots i{width:20px;height:4px;border-radius:var(--radius-full);background:var(--stroke-neutral-weak);transition:background .2s}
.dots i.on{background:var(--bg-neutral-solid)}

/* 바텀시트 [SEED-BottomSheet, TDS-BottomSheet] */
.sheet-layer{position:absolute;z-index:300;inset:0;pointer-events:none}
.scrim{position:absolute;inset:0;background:var(--bg-overlay);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;display:flex;flex-direction:column;border-radius:var(--radius-l) var(--radius-l) 0 0;background:var(--bg-layer-basement);transform:translateY(110%);transition:transform var(--motion-sheet) var(--ease-out)}
.sheet-layer.open{pointer-events:auto}
.sheet-layer.open .scrim{opacity:1}
.sheet-layer.open .sheet{transform:none}
.sheet .handle{flex:none;width:36px;height:4px;margin:var(--space-2) auto 0;border-radius:var(--radius-full);background:var(--stroke-neutral-strong)}
.sheet-h{position:relative;flex:none;padding:var(--space-6) var(--space-4) var(--space-4)}
.sheet .handle + .sheet-h{padding-top:var(--space-3)}
.sheet-h.has-x{padding-right:64px}
.sheet-h h2{font-size:var(--type-t4);font-weight:700;line-height:1.4;letter-spacing:-.02em}
.sheet-h p{margin-top:var(--space-1);font-size:var(--type-t6);line-height:1.5;color:var(--fg-neutral-muted)}
.sheet-x{position:absolute;top:12px;right:8px;width:52px;height:52px;border-radius:var(--radius-full);display:grid;place-items:center;color:var(--fg-neutral)}
.sheet-x:active{background:var(--stroke-neutral-subtle)}
.sheet-body{overflow-y:auto;padding:0 var(--space-4) var(--space-2);scrollbar-width:none}
.sheet .dock{padding:var(--space-3) var(--space-4) max(env(safe-area-inset-bottom),20px)}
.sheet .ta{margin-top:0}

/* 다이얼로그 [TDS-Dialog, AIT-UX] */
.dialog-layer{position:absolute;z-index:400;inset:0;display:flex;align-items:flex-end;padding:0 var(--space-4) var(--space-4);background:var(--bg-overlay);opacity:0;pointer-events:none;transition:opacity .16s}
.dialog-layer.open{opacity:1;pointer-events:auto}
.dialog{width:100%;max-height:calc(100% - 72px);overflow-y:auto;padding:var(--space-6) var(--space-6) var(--space-4);border-radius:var(--radius-l);background:var(--bg-layer-floating);text-align:left;transform:translateY(24px);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.dialog-layer.open .dialog{transform:none}
.dialog h2{font-size:var(--type-t4);line-height:1.4;font-weight:700}
.dialog p{margin-top:var(--space-2);font-size:var(--type-t6);line-height:1.6;color:var(--fg-neutral-secondary);white-space:pre-line}
.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-6)}
.dialog-actions.stack{grid-template-columns:1fr}
.dialog-actions button{min-height:52px;border-radius:var(--radius-m);background:var(--bg-neutral-weak-alpha);font-size:var(--type-t5);font-weight:600;color:var(--fg-neutral);text-align:center}
.dialog-actions .primary{background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted)}
.dialog-actions .danger{background:var(--bg-critical-solid);color:var(--fg-neutral-inverted)}

/* 토스트 [TDS-Toast]: 하단 고정 CTA(없으면 탭바) 바로 위, 3초 */
.toast{position:absolute;z-index:450;left:var(--space-gutter);right:var(--space-gutter);bottom:var(--toast-b,102px);display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--radius-m);background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted);font-size:var(--type-t6);line-height:1.45;
  transform:translateY(var(--motion-rise-distance));opacity:0;pointer-events:none;transition:opacity var(--motion-toast) var(--ease-out),transform var(--motion-toast) var(--ease-out)}
.toast.show{opacity:1;transform:none;pointer-events:auto}

/* 휴대폰 위 알림 배너 (출근 알림, 운영체제 화면) */
.push{position:absolute;z-index:460;left:8px;right:8px;top:52px;display:flex;gap:var(--space-3);align-items:center;padding:var(--space-3) var(--space-4);border-radius:var(--radius-l);background:rgba(255,255,255,.97);box-shadow:0 14px 34px rgba(25,24,29,.2);opacity:0;transform:translateY(-14px);pointer-events:none;transition:opacity .2s,transform .2s;cursor:pointer}
.push.show{opacity:1;transform:none;pointer-events:auto}
.push .pi{flex:none;width:40px;height:40px;border-radius:var(--radius-s);display:grid;place-items:center;background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted)}
.push .pb{flex:1;min-width:0}
.push small{display:flex;justify-content:space-between;font-size:var(--type-t7);color:var(--fg-neutral-muted)}
.push b{display:block;font-size:var(--type-t6);font-weight:700}
.push .ps{display:block;font-size:var(--type-t7);line-height:1.45;color:var(--fg-neutral-secondary)}

/* 3D 그림: 화면에 하나. 그림을 6% 밝힌 뒤 darken으로 섞어 화면 바탕과 같은 색이 되게 함 (v8) */
.hero{display:flex;justify-content:center;margin:0 0 var(--space-6);isolation:isolate;background:var(--bg-layer-basement)}
.hero img{display:block;width:208px;height:208px;object-fit:contain;filter:brightness(1.06);mix-blend-mode:darken}
.hero.md img{width:208px;height:208px}
.hero.sm img{width:208px;height:208px}
/* v26: 작은 사물 96px (사물 하나짜리 3D 아이콘을 크게). 히어로가 없는 화면에 하나, 제목 위 가운데 [GRAPHIC_RULES 4.2] */
.obj{display:flex;justify-content:center;margin:0 0 var(--space-6);isolation:isolate;background:var(--bg-layer-basement)}
.obj img{display:block;width:96px;height:96px;object-fit:contain;filter:brightness(1.06);mix-blend-mode:darken}
.state .obj{align-self:center}
/* v26: 360x640처럼 낮은 화면에서는 제목, 핵심 금액, 주 버튼이 첫 화면에 들도록 그림부터 줄임 (히어로 168px, 작은 사물 80px) [GRAPHIC_RULES R3] */
.screen{container-type:size}
@container (max-height:700px){.hero img,.hero.md img,.hero.sm img{width:168px;height:168px}.obj img{width:80px;height:80px}.state{padding-top:var(--space-2)}}

/* 입력 [TDS-TextField]: 모서리 8, 테두리는 바탕과 3:1 [WCAG-1.4.11] */
.ta{display:block;width:100%;height:80px;padding:var(--space-3) var(--space-4);border:0;outline:0;border-radius:var(--radius-s);background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-strong);font-size:var(--type-t6);line-height:1.5;resize:none}
.amt-in{display:flex;align-items:center;gap:var(--space-1);margin-top:var(--space-3);min-height:48px;padding:0 var(--space-4);border-radius:var(--radius-s);background:var(--bg-layer-basement);box-shadow:inset 0 0 0 1.5px var(--stroke-neutral-solid)}
.amt-in b{font-size:var(--type-t5);font-weight:700}
.amt-in input{flex:1;min-width:0;min-height:44px;border:0;outline:0;background:transparent;font-size:var(--type-t5);font-weight:700;font-variant-numeric:tabular-nums}
.amt-in small{flex:none;font-size:var(--type-t7);color:var(--fg-neutral-muted)}
.amt-after{display:block;margin-top:var(--space-2);font-size:var(--type-t6);line-height:1.5;color:var(--fg-neutral-secondary)}
/* v32: 글 넣는 칸(가게 정보). 칸 이름은 칸 위, 칸은 보관함 채우기 금액 칸과 같은 모양(높이 48, 모서리 8, 테두리 3:1). 라벨이 칸을 감싸 누르는 대상이 44px을 넘음 */
.fld{display:block;margin-top:var(--space-6)}
.fld .fl-l{display:block;font-size:var(--type-t6);font-weight:700;color:var(--fg-neutral)}
.fld .amt-in{margin-top:var(--space-2)}
.fld .amt-in input{font-weight:500}
/* v33: 자주 묻는 질문. 물음은 h3, 답은 그 아래 문단. 한 묶음 흰 판에 질문마다 구분선 */
.faq{padding:var(--space-4)}
.faq + .faq{border-top:1px solid var(--stroke-neutral-subtle)}
.faq h3{font-size:var(--type-t6);font-weight:700;line-height:1.5;color:var(--fg-neutral)}
.faq p{margin-top:var(--space-1);font-size:var(--type-t6);line-height:1.6;color:var(--fg-neutral-secondary)}
.fld .amt-in input.short{flex:0 0 56px;text-align:right}
/* v35: 화면 읽기만 읽는 글. 화면에는 보이지 않음(투명도 0이라 보이는 글 덤프에서도 빠짐). 보이는 글 쪽은 aria-hidden */
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;opacity:0;pointer-events:none}
.datef{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-4);border-radius:var(--radius-s);background:var(--bg-layer-default);box-shadow:inset 0 0 0 2px var(--stroke-neutral-solid)}
.datef small{display:block;font-size:var(--type-t7);color:var(--fg-neutral-muted)}
.datef b{display:block;margin-top:var(--space-1);font-size:var(--type-t3);font-weight:700;letter-spacing:-.02em}
.datef .i{color:var(--fg-neutral-ui)}
/* 스위치: 꺼짐도 바탕과 3:1, 켜짐은 손잡이 위치로도 구분 */
.sw{flex:none;display:block;position:relative;width:46px;height:28px;   /* v40: 행 오른쪽 .rr 안의 span이라 block으로 그려야 46x28이 보임 */ border-radius:var(--radius-full);background:var(--bg-neutral-strong)}
.sw.on{background:var(--bg-brand-solid)}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--bg-layer-default);transition:left .2s}
.sw.on::after{left:21px}

.quote{margin-top:var(--space-component);padding:var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default)}
.quote p{margin-top:var(--space-2);font-size:var(--type-t6);line-height:1.55;color:var(--fg-neutral)}
.quote p:first-child{margin-top:0}
.quote small{display:block;margin-top:var(--space-2);font-size:var(--type-t7);color:var(--fg-neutral-muted)}
.amt-box{margin-bottom:var(--space-component);padding:var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default)}
.amt-box small{font-size:var(--type-t7);color:var(--fg-neutral-muted)}
.amt-box b{display:block;margin-top:var(--space-1);font-size:var(--type-t1);font-weight:700;letter-spacing:-.03em}
.amt-box span{display:block;margin-top:var(--space-1);font-size:var(--type-t7);color:var(--fg-neutral-secondary)}
.btnrow2{display:flex;gap:var(--space-2)}

/* 채워 둔 돈과 보관된 돈 (v6). 채우기는 채워 둔 돈 카드 안의 옅은 버튼 (v8) */
.mpair{display:flex;flex-direction:column;gap:var(--space-2)}
.mpair > div{padding:var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default)}
.mpair small{display:block;font-size:var(--type-t7);font-weight:700;color:var(--fg-neutral)}
.mpair small em{font-style:normal;font-weight:500;color:var(--fg-neutral-muted)}
.mpair b{display:block;margin-top:var(--space-1);font-size:var(--type-t2);font-weight:700;letter-spacing:-.03em}
.mpair span{display:block;margin-top:var(--space-1);font-size:var(--type-t7);line-height:1.45;color:var(--fg-neutral-secondary)}
.mpair .lk{background:var(--bg-brand-weak)}
.mpair .btn{margin-top:var(--space-3);min-height:52px}
.mflow{margin-top:var(--space-3);font-size:var(--type-t7);line-height:1.55;color:var(--fg-neutral-secondary)}

/* 반복 근무표: 칸은 바탕과 3:1, 사람은 줄 이름으로도 구분 */
.days{display:flex;gap:var(--space-1)}
.days span{flex:1;height:44px;border-radius:var(--radius-s);display:grid;place-items:center;background:var(--bg-layer-default);font-size:var(--type-t6);font-weight:600;color:var(--fg-neutral-muted);box-shadow:inset 0 0 0 1px var(--stroke-neutral-strong)}
.days span.on{background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted);box-shadow:none}
.wk{display:grid;grid-template-columns:32px repeat(7,1fr);gap:var(--space-1);align-items:center;padding:var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default);font-size:var(--type-t7)}
.wk b{text-align:center;font-weight:600;color:var(--fg-neutral-muted)}
.wk em{font-style:normal;font-weight:700;color:var(--fg-neutral-secondary)}
.wk i{height:20px;border-radius:var(--radius-s);background:var(--bg-layer-basement)}
.wk i.on{background:var(--bg-neutral-strong)}
.wk i.me{background:var(--bg-brand-solid)}
.wk-l{display:flex;gap:var(--space-3);margin-top:var(--space-2);font-size:var(--type-t7);color:var(--fg-neutral-muted)}
.wk-l span{display:flex;align-items:center;gap:var(--space-1)}
.wk-l i{width:16px;height:12px;border-radius:var(--radius-full);background:var(--bg-neutral-strong)}
.wk-l i.me{background:var(--bg-brand-solid)}

/* 계산 풀이: 두 사람이면 40px 원을 겹침 [TDS-Asset Union] */
.calc{margin-top:var(--space-component);padding:var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default)}
.calc .who{display:flex;align-items:center;gap:var(--space-2);font-size:var(--type-t6);font-weight:700}
.calc .who .av + .av{margin-left:-20px;box-shadow:0 0 0 2px var(--bg-layer-default)}
.calc .ln{display:flex;justify-content:space-between;gap:var(--space-3);margin-top:var(--space-2);font-size:var(--type-t7);line-height:1.5;color:var(--fg-neutral-secondary)}
.calc .ln b{flex:none;color:var(--fg-neutral);font-weight:700;font-size:var(--type-t6)}
.calc .eq{margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px dashed var(--stroke-neutral-weak);display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-2);font-size:var(--type-t6);font-weight:700}
.calc .eq span{font-weight:600;color:var(--fg-neutral-secondary);font-size:var(--type-t7)}

/* 돈이 움직이는 길 (v7): 40px 원과 아래 화살표 */
.flow{padding:var(--space-2) var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default)}
.fnode{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0}
.fnode .fi{flex:none;width:40px;height:40px;border-radius:var(--radius-full);display:grid;place-items:center;background:var(--bg-neutral-weak);color:var(--fg-neutral-secondary)}
.fnode .fi.acc{background:var(--bg-brand-weak);color:var(--fg-brand)}
.fnode .fi.ok{background:var(--bg-informative-weak);color:var(--fg-informative-icon)}
.fnode .fm{flex:1;min-width:0}
.fnode b{display:block;font-size:var(--type-t6);font-weight:700;line-height:1.35}
.fnode .fm span{display:block;font-size:var(--type-t7);line-height:1.45;color:var(--fg-neutral-secondary)}
.fedge{display:flex;align-items:center;gap:var(--space-3);min-height:24px;font-size:var(--type-t7);font-weight:600;color:var(--fg-brand)}
.fedge i{flex:none;width:40px;display:flex;justify-content:center;color:var(--fg-neutral-ui)}
/* v28: 돈이 움직이는 길 네 칸 장면 (채우기, 확정, 보관, 급여일. 알바생 앱 52와 같은 순서). 칸은 흰 카드, 그림은 화면 바탕색 칸 안에 칸 폭만큼 */
.mpath{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-4)}
.mstep{display:flex;flex-direction:column;min-width:0;padding:var(--space-3);border-radius:var(--radius-m);background:var(--bg-layer-default)}
.mimg{isolation:isolate;overflow:hidden;border-radius:var(--radius-s);background:var(--bg-layer-basement)}
.mimg img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain;filter:brightness(1.06);mix-blend-mode:darken}
.mstep b{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-3);font-size:var(--type-t6);font-weight:700;line-height:1.4}
.mstep b em{flex:none;display:grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:var(--radius-full);background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted);font-style:normal;font-size:var(--type-t7);font-weight:700}
.mstep p{margin-top:var(--space-1);font-size:var(--type-t7);line-height:1.55;color:var(--fg-neutral-secondary)}
.mstep .mfx{margin-top:var(--space-2);padding-top:var(--space-2);border-top:1px dashed var(--stroke-neutral-weak)}
html[data-fs="200"] .mpath{grid-template-columns:1fr}


/* =========================================================
   v10: 접근성 마무리
   ========================================================= */
/* 키보드 포커스가 보이게 [FF-a11y, SEED-Inclusive] */
:focus{outline:none}
:focus-visible{outline:2px solid var(--fg-brand);outline-offset:2px}
.row:focus-visible,.callout:focus-visible{outline-offset:-2px}

/* 글자 크기 130%, 200%: 높이를 고정하지 않고 줄을 바꾸며, 나란한 버튼은 세로로 쌓음 [WCAG22 1.4.4, TDS-Type] */
/* v36: 나란한 버튼의 글이 길면(긴 이름) 버튼 안에서 두 줄로 (글이 버튼 밖으로 나가지 않게) */
.dock .btn,.btnrow .btn,.btnrow2 .btn,.state-act .btn{white-space:normal;min-width:0;text-wrap:balance}
html[data-fs] .dock,html[data-fs] .btnrow,html[data-fs] .btnrow2{flex-direction:column}
html[data-fs] .dock .btn,html[data-fs] .btnrow .btn,html[data-fs] .btnrow2 .btn{flex:none}
html[data-fs] .btn{white-space:normal}
html[data-fs] .dialog-actions{grid-template-columns:1fr}
html[data-fs] .tab-head,html[data-fs] .back-head{height:auto;min-height:56px;padding-top:var(--space-2);padding-bottom:var(--space-2)}
html[data-fs] .back-head h2,html[data-fs] .back-head .h-t{display:block;overflow:visible}
html[data-fs] .row{flex-wrap:wrap}
html[data-fs] .row .rm{flex:1 1 6em}
html[data-fs] .row .rr{margin-left:auto}
html[data-fs] .store-band,html[data-fs] .pc-line,html[data-fs] .c-row,html[data-fs] .calc .ln,html[data-fs] .calc .eq,html[data-fs] .kv{flex-wrap:wrap}
html[data-fs] .head-ic{width:auto;display:flex;align-items:center;gap:var(--space-1);padding:0 var(--space-2)}
html[data-fs] .head-ic b{position:static}
html[data-fs="200"] .pc-top{flex-wrap:wrap}
html[data-fs="200"] .pc-top .m{flex-basis:100%}
html[data-fs="200"] .diff{grid-template-columns:1fr}
/* v18: 글자 200%에서 화면 제목은 36px(본문 34px보다 한 단계 위)에서 멈춰 두 줄 안에 들게 함 */
html[data-fs="200"] .lead-t,html[data-fs="200"] .sum-t,html[data-fs="200"] .result h2,html[data-fs="200"] .payday .pa,html[data-fs="200"] .ob-title,html[data-fs="200"] .state-t,html[data-fs="200"] .dialog h2,html[data-fs="200"] .sheet-h h2{font-size:1.125rem}
html[data-fs] .paper{overflow-x:auto}
/* v36: 20 두 돈 표. 글자 200%에서는 돈마다 한 묶음으로 쌓음 (가로 스크롤 없이) */
.ex-stack{display:none}
html[data-fs="200"] .paper table.ex{display:none}
html[data-fs="200"] .ex-stack{display:block}
.ex-h{font-size:var(--type-t6);font-weight:700;line-height:1.4}
.ex-h.lkc{color:var(--fg-brand)}
.ex-h + dl{margin-top:var(--space-1)}
dl + .ex-h{margin-top:var(--space-6)}
.ex-stack dl > div{padding:var(--space-2) 0;border-top:1px solid var(--stroke-neutral-subtle)}
.ex-stack dt{font-size:var(--type-t7);font-weight:600;color:var(--fg-neutral-muted)}
.ex-stack dd{margin-top:2px;font-size:var(--type-t7);line-height:1.5}
html[data-fs="200"] .seg{flex-direction:column}
html[data-fs="200"] .sheet-h.has-x{padding-right:var(--space-4);padding-top:64px}

/* =========================================================
   v13: 에러, 실패, 빈 상태 한 틀 [REFERENCE 1부 2절, AIT-UX, SEED-Inclusive]
   제목(무슨 일) → 돈이 어디 있는지 → 이유와 할 수 있는 일 → 주 버튼(바로 푸는 동작)과 닫기
   색: 돈이 안 들어간 일만 위험(빨강), 기다림과 확인은 주의(주황), 안내와 빈 상태는 안내(초록)
   ========================================================= */
.state{display:flex;flex-direction:column;align-items:flex-start;padding:var(--space-6) 0 var(--space-4)}
.state .hero{align-self:center}
.state-ic{flex:none;width:40px;height:40px;margin-bottom:var(--space-4);border-radius:var(--radius-full);display:grid;place-items:center}
.state.critical .state-ic{background:var(--bg-critical-weak);color:var(--fg-critical)}
.state.warn .state-ic{background:var(--bg-warning-weak);color:var(--fg-warning-icon)}
.state.info .state-ic{background:var(--bg-informative-weak);color:var(--fg-informative-icon)}
.state-t{font-size:var(--type-t3);font-weight:700;line-height:1.4;letter-spacing:-.02em;color:var(--fg-neutral)}
.state-money{margin-top:var(--space-2);font-size:var(--type-t5);font-weight:600;line-height:1.5;color:var(--fg-neutral)}
.state-s{margin-top:var(--space-2);font-size:var(--type-t6);line-height:1.55;color:var(--fg-neutral-secondary)}
.state-act{display:flex;gap:var(--space-2);width:100%;margin-top:var(--space-6)}
.state + .steps{margin-top:var(--space-2)}
/* 돈 위치 줄: 화면 머리와 안내 상자 안에서 둘째 줄 */
.lead-m{margin-top:var(--space-2);font-size:var(--type-t5);font-weight:600;line-height:1.5;color:var(--fg-neutral)}
.callout .c-money{display:block;font-weight:700;color:var(--fg-neutral)}
html[data-fs] .state-act{flex-direction:column}

/* =========================================================
   v14: 움직임. 완료 순간(보관 완료, 확정 완료, 급여일 입금, 이의 받아들여짐)에만 [AIT-UX, HIG-A11y]
   - 3D 그림이나 결과 표시가 아래에서 8px 떠오르며 나타남 320ms, 체크 표시 그리기 240ms(80ms 뒤 시작)
   - 금액 숫자는 세지 않음. 무한 반복과 꾸밈 움직임 없음
   - .moment는 전체 화면을 열 때 붙였다가 450ms 뒤 떼므로, 화면이 다시 그려져도 되풀이되지 않음
   - 움직임 줄이기와 캡처(?i=N)에서는 모두 꺼지고 끝난 모습만 보임
   ========================================================= */
@keyframes rise{from{opacity:0;transform:translateY(var(--motion-rise-distance))}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.moment .hero,.moment .obj,.moment .r-ic{animation:rise var(--motion-rise) var(--ease-out) both}
.i .draw{vector-effect:none}
.r-ic .i .draw{stroke-width:1.43}
.st-c .i .draw{stroke-width:2.85}
.rk .i .draw,.ck .i .draw{stroke-width:1.9}
.ck .i .draw{stroke-width:3.26}
.moment .r-ic .draw,.step.just .st-c .draw{stroke-dasharray:1;animation:draw var(--motion-draw) var(--motion-draw-delay) var(--ease-out) both}

/* 움직임 줄이기: 화면 전환, 시트, 토스트 움직임을 끔 (스크립트도 전환 대기 시간을 0으로) */
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* 캡처할 때(?i=N)는 움직임을 끈다 */
.cap *,.cap *::before,.cap *::after{transition:none!important;animation:none!important}
</style>
</head>

<div class="stage">

          <svg width="27" height="13" viewBox="0 0 27 13" fill="currentColor"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" opacity=".4"/></svg>

<script>
/* 아이콘: 성재 님 v3 그대로 */
const ICONS = {

  `<svg class="i" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* 데이터: 성재 님 v3 PEOPLE 그대로 (A, B 숫자의 원본) */
const PEOPLE = {
  haneul: {
    name:'A', short:'A', store:'새싹편의점 연희점', boss:'박정민 사장님',
    wage:10320, shiftLabel:'토, 일 오후 10:00 ~ 오전 8:00', rest:'쉬는 시간 1시간', hours:9, weekly:18,

/* =========================================================
   v35: 화면 읽기 이름 [ds_screenreader 2절 숫자 기호 읽기, 3절 같은 말 두 번 읽지 않기]
   보이는 글은 그대로 두고, 화면 읽기에는 기호와 시각을 말로 바꾼 글을 읽힌다.
   ========================================================= */
const WDAY = { 월:'월요일', 화:'화요일', 수:'수요일', 목:'목요일', 금:'금요일', 토:'토요일', 일:'일요일' };
const SR_T = '(?:오전|오후) \\d+시(?: \\d+분)?';
const srJong = c => /[0136780]/.test(c) || (c >= '가' && c <= '힣' && (c.charCodeAt(0) - 0xAC00) % 28 > 0);   // 받침이 있나 (숫자는 읽는 소리로)
function srText(t) {
  return String(t).replace(/<[^>]*aria-label="([^"]*)"[^>]*>/g, ' $1 ').replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ')
    .replace(/(\d{1,2}):(\d\d)/g, (m, h, mm) => `${+h}시${mm === '00' ? '' : ` ${+mm}분`}`)                 // 오후 10:00 → 오후 10시, 오전 7:30 → 오전 7시 30분
    .replace(new RegExp(`(${SR_T}) ~ (${SR_T})`, 'g'), '$1부터 $2까지')                                     // 시각 범위
    .replace(/(\d+월 \d+일) ~ (\d+월 \d+일|\d+일)/g, '$1부터 $2까지')                                          // 날짜 범위
    .replace(/(^|[^가-힣])([월화수목금토일]) ~ ([월화수목금토일])(?![가-힣])/g, (m, p, a, b) => `${p}${WDAY[a]}부터 ${WDAY[b]}까지`)
    .replace(/(^|[^가-힣])([월화수목금토일]), ([월화수목금토일])(?![가-힣])/g, (m, p, a, b) => `${p}${WDAY[a]}, ${WDAY[b]}`)   // 토, 일 → 토요일, 일요일
    .replace(/ ~ /g, '부터 ')
    .replace(/(은행) \*{3}-\d+-(\d+)/g, '$1 계좌, 끝자리 $2').replace(/\*{3}-\d+-(\d+)/g, '계좌, 끝자리 $1')                  // v36: 계좌 국민은행 ***-21-3021 → 국민은행 계좌, 끝자리 3021
    .replace(/(?:기록 번호 · )?0x[0-9a-f]+…([0-9a-f]+)/g, '기록 번호, 끝자리 $1')                               // v36: 기록 번호, 끝자리 92af
    .replace(/(\d)m(?![a-z])/g, '$1미터').replace(/(^|\s)m 안/g, '$1미터 안')
    .replace(/(^|[^\d,])1350(?!\d)/g, (m, p) => p + '1 3 5 0')                                                          // 상담 전화 번호는 한 자리씩
    .replace(/\s×\s/g, ' 곱하기 ').replace(/\s÷\s/g, ' 나누기 ').replace(/\s\+\s/g, ' 더하기 ').replace(/\s−\s/g, ' 빼기 ')
    .replace(/(\S)\s=\s/g, (m, c) => c + (srJong(c) ? '은 ' : '는 '))                                          // = 은/는
    .replace(/\s*·\s*/g, ', ').replace(/^, |, $/g, '')
    .replace(/\s+/g, ' ').replace(/ ,/g, ',').trim();
}
const attrSafe = t => t.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
// 행 하나는 한 번에 "제목, 설명, 배지, 오른쪽 금액이나 상태"로 읽는다. 누르는 행은 그 이름이 버튼, 링크, 스위치 이름이 되고,
// 누르지 않는 행은 화면 읽기 전용 글 하나를 읽고 보이는 칸은 숨긴다.
function rowName({ t, s, tags, trail, attrs }) {
  const sw = /role="switch"/.test(attrs) || (/class="sw/.test(trail) && /켜짐|꺼짐/.test(s));   // 상태를 두 번 읽지 않게
  return srText([t, s, tags, sw ? '' : trail].filter(Boolean).join(' · '));
}
function row({ icon, tone = '', t, tCls = '', s = '', tags = '', trail = '', trailCls = '', go, act, attrs = '', arrow, lead = '' }) {
  const tap = go || act;
  // v10: 누르는 행은 키보드로도 누를 수 있게 role과 tabindex. 다른 화면으로 가는 행은 link, 시트나 확인 창을 여는 행은 button
  //      (role이 따로 오면 그것을 씀) [FF-a11y, APG]
  const kb = tap ? `tabindex="0" ${/role=/.test(attrs) ? '' : `role="${go || act === 'notice' ? 'link' : 'button'}"`}` : '';
  const rd = attrSafe(rowName({ t, s, tags, trail, attrs }));   // v35
  const hide = tap ? '' : ' aria-hidden="true"';
  return `<div class="row ${tap ? 'tap' : ''}" ${go ? `data-go="${go}"` : ''} ${act ? `data-act="${act}"` : ''} ${kb} ${attrs} ${tap && !/aria-label=/.test(attrs) ? `aria-label="${rd}"` : ''}>
    ${tap ? '' : `<span class="vh">${rd}</span>`}${lead.replace(/^<span /, `<span${hide} `)}${icon ? (icon.startsWith('ic_') ? `<span class="ri3"${hide}><img src="../assets/icon3d_web/${icon}.webp" alt="" aria-hidden="true"></span>` : `<span class="ri ${tone}"${hide}>${ic(icon, 24)}</span>`) : ''}
    <span class="rm"${hide}><span class="rt ${tCls}">${t}</span>${s ? `<span class="rs">${s}</span>` : ''}${tags ? `<span class="tags">${tags}</span>` : ''}</span>
    ${trail ? `<span class="rr ${trailCls}"${hide}>${trail}</span>` : ''}
    ${(arrow ?? !!tap) ? chev() : ''}
  </div>`;
}
// v36: 진행 단계는 화면 읽기가 단계 앞에 상태 말을 먼저 읽음 (끝남, 지금, 확인 필요, 문제 있음, 다음) [UX_WRITING_RULES 8절]
const STEP_SR = st => /\bbad\b/.test(st) ? '문제 있음' : /\bwarn\b/.test(st) ? '확인 필요' : /\bcur\b/.test(st) ? '지금' : /\b(done|ok)\b/.test(st) ? '끝남' : /\bnext\b/.test(st) ? '다음' : '';
function step({ icon, state = '', t, s = '', right = '', rightCls = '', extra = '', top = true }) {

}
// v13: 에러, 실패, 빈 상태 한 틀 [REFERENCE 1부 2절 토스 좋은 에러 메시지 6원칙]
// 제목은 무슨 일이 있었는지 사람 말로, 돈이 걸리면 둘째 줄은 돈이 어디 있는지, 주 버튼은 바로 푸는 동작, 물러나는 버튼은 닫기.
// tone: critical(돈이 안 들어간 일만), warn(기다림, 확인), info(안내, 빈 상태). kind: error, fail, empty
function stateBlock({ kind = 'error', tone = 'warn', icon = 'alert', hero: pic = '', title, money = '', desc = '', primary = '', secondary = '' }) {

const scrollOf = el => el.querySelector('.scroll');
function syncNav(el) { const s = scrollOf(el), h = el.querySelector('.tab-head,.back-head'); if (s && h) h.classList.toggle('scrolled', s.scrollTop > 2); }
function saveScroll() { const s = curEl && scrollOf(curEl); if (s) topEntry().scroll = s.scrollTop; }
function restoreScroll(el) { const s = scrollOf(el); if (s) s.scrollTop = topEntry().scroll || 0; syncNav(el); }

function after() { renderTabbar(); updatePanel(); }
function showTab(anim) {
  viewport.innerHTML = '';
  curEl = buildView(topEntry(), stack().length - 1);
  if (anim) curEl.classList.add('fade');
  viewport.append(curEl);
  restoreScroll(curEl);
  after();
}
function push(id, p) {
  if (busy) return;
  saveScroll();
  stack().push({ id, p });
  const el = buildView(topEntry(), stack().length - 1);
  el.classList.add('enter');
  viewport.append(el);
  el.offsetWidth;
  busy = true;
  const old = curEl;
  old.classList.add('under');
  el.classList.remove('enter');
  curEl = el;
  setTimeout(() => { old.remove(); busy = false; }, REDUCED ? 0 : 300);
  after();
}
function pop() {
  if (busy || stack().length < 2) return;
  stack().pop();
  const el = buildView(topEntry(), stack().length - 1);
  el.classList.add('under');
  viewport.insertBefore(el, curEl);
  restoreScroll(el);
  el.offsetWidth;
  busy = true;
  const old = curEl;
  el.classList.remove('under');
  old.classList.add('enter');
  curEl = el;
  setTimeout(() => { old.remove(); busy = false; }, REDUCED ? 0 : 300);
  after();
}
function refresh() {
  const s = scrollOf(curEl), y = s ? s.scrollTop : 0;
  const el = buildView(topEntry(), stack().length - 1);
  viewport.replaceChild(el, curEl);
  curEl = el;
  if (scrollOf(el)) scrollOf(el).scrollTop = y;
  syncNav(el);
  after();
}
function switchTab(t) {
  closeSheet(); hidePush();
  if (t === S.tab) { if (stack().length > 1) { S.stacks[t] = [stack()[0]]; showTab(true); } return; }
  saveScroll();
  S.tab = t;

}

}

const sheetLayer = $('#sheetLayer'), sheet = $('#sheet');
// v8: 바텀시트는 제목 필수, 아래에 붙고 위 모서리 24, 최대 높이 90%, 좌우 16 [SEED-BottomSheet, TDS-BottomSheet]
// firm: 되돌리기 어려운 시트(보관, 확정, 지급, 정산, 채우기)는 손잡이 없이 위 닫기(X), 바깥을 눌러도 닫히지 않음
//       나머지 시트(firm:false)는 손잡이와 바깥 누르면 닫힘
function openSheet(key, { title, sub = '', body, cta = '', firm = true }) {
  const was = !!S.sheet;
  S.sheet = key; S.sheetFirm = firm;
  sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-modal', 'true'); sheet.setAttribute('aria-labelledby', 'sheetTitle');
  sheet.innerHTML = clean(`${firm ? '' : '<div class="handle"></div>'}<div class="sheet-h${firm ? ' has-x' : ''}"><h2 id="sheetTitle">${title}</h2>${sub ? `<p>${sub}</p>` : ''}${firm ? `<button class="sheet-x" data-act="sheetClose" aria-label="닫기">${ic('x', 24)}</button>` : ''}</div>
    <div class="sheet-body">${body}</div>${cta ? `<div class="dock">${cta}</div>` : ''}`);
  sheetLayer.offsetWidth;
  sheetLayer.classList.add('open');
  syncLayers();
  if (!was) layerOpened(sheet); else { const f = sheet.querySelector(`[data-v="${S.fillPick}"]`); if (f && document.activeElement === document.body) f.focus({ preventScroll:true }); }
  updatePanel();
}
function closeSheet() { if (!S.sheet) return; S.sheet = null; sheetLayer.classList.remove('open'); syncLayers(); layerClosed(); updatePanel(); }
// v8: 시트나 다이얼로그가 열려 있으면 뒤 화면을 inert로 둔다 (가려진 뒤 화면 하단 CTA는 CSS에서 숨김)
// v10: 닫힌 층(전체 화면, 시트, 다이얼로그)도 inert로 두어 탭 키가 보이지 않는 곳으로 가지 않게 함 [APG-Dialog]
function syncLayers() {
  const mo = !!S.modal, sh = !!S.sheet, dl = $('#dialogLayer').classList.contains('open');
  document.querySelector('.screen').classList.toggle('ovl', sh || dl);
  const set = (q, on) => { const el = $(q); if (on) el.setAttribute('inert', ''); else el.removeAttribute('inert'); };
  set('#viewport', mo || sh || dl); set('#tabbar', mo || sh || dl);
  set('#modal', !mo || sh || dl); modal.setAttribute('aria-hidden', String(!mo));
  set('#sheetLayer', !sh || dl); set('#dialogLayer', !dl);
}
// v10: 대화상자를 열면 안으로 포커스를 옮기고, 닫으면 연 버튼으로 돌려준다 [APG-Dialog, Radix-Dialog]
const FOCUSABLE = 'button:not([disabled]),[href],input,textarea,select,[tabindex]:not([tabindex="-1"])';
const focusStack = [];
function layerOpened(layer, first) {
  const opener = document.activeElement && document.activeElement !== document.body ? document.activeElement : null;
  focusStack.push(opener);
  if (!opener) return;   // 화면 목록에서 바로 연 경우는 포커스를 옮기지 않음 (Tab을 누르면 아래 가둠이 첫 요소로 보냄)
  const f = first || layer.querySelector(FOCUSABLE);
  (f || layer).focus({ preventScroll:true });
}
function layerClosed() {
  const el = focusStack.pop();
  if (!el) return;   // 스크립트로 연 층(화면 목록에서 바로 연 경우)은 포커스를 옮기지 않음
  if (document.contains(el) && !el.closest('[inert]')) { el.focus({ preventScroll:true }); return; }
  const L = topLayer() || curEl;
  const f = L && L.querySelector(FOCUSABLE);
  if (f) f.focus({ preventScroll:true });
}
function topLayer() {
  if ($('#dialogLayer').classList.contains('open')) return $('#dialogLayer .dialog');
  if (S.sheet) return sheet;
  if (S.modal) return modal;
  return null;
}

let toastTimer;
function toastBottom() {
  const scr = document.querySelector('.screen').getBoundingClientRect(), k = scr.height / 852;
  const dock = (S.sheet && sheet.querySelector('.dock')) || (S.modal && modal.querySelector('.dock,.ob-foot')) || (curEl && curEl.querySelector('.dock'));
  if (dock) { const b = dock.querySelector('.btn') || dock; return Math.round((scr.bottom - b.getBoundingClientRect().top) / k) + 12; }
  return $('#tabbar').classList.contains('hide') ? 24 : 24 + 66 + 12;   // 탭바 아래 24, 높이 66

// v10: 글자 크기 100%, 130%, 200%. 휴대폰 안 글자는 rem이라 뿌리 글자 크기만 바꾼다 [WCAG22 1.4.4, TDS-Type]
let FONT_SCALE = 100;
function setFontScale(v) {
  FONT_SCALE = [130, 200].includes(v) ? v : 100;
  const h = document.documentElement;
  if (FONT_SCALE === 100) { h.style.fontSize = ''; delete h.dataset.fs; } else { h.style.fontSize = FONT_SCALE + '%'; h.dataset.fs = String(FONT_SCALE); }
  document.querySelectorAll('#panel .fsw button').forEach(b => { const on = +b.dataset.v === FONT_SCALE; b.classList.toggle('on', on); b.setAttribute('aria-checked', String(on)); });
}
// v10: 키보드. 대화상자 안에서 Tab 순환, Esc로 닫기, role 버튼은 Enter와 Space로 누름 [APG-Dialog, FF-a11y]
document.addEventListener('keydown', e => {
  const L = topLayer();
  if (e.key === 'Escape' && L) {
    e.preventDefault();
    if (L === sheet) closeSheet(); else if (L === modal) ACT.modalClose(); else closeDialog();
    return;
  }
  if (e.key === 'Tab' && L) {
    const f = [...L.querySelectorAll(FOCUSABLE)].filter(x => x.getClientRects().length);
    if (!f.length) { e.preventDefault(); return; }
    const first = f[0], last = f[f.length - 1], a = document.activeElement;
    if (!L.contains(a)) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
    else if (e.shiftKey && a === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if (e.target.matches && e.target.tagName !== 'BUTTON' && ((e.key === 'Enter' && e.target.matches('[role=link]')) || ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button],[role=radio],[role=checkbox]')))) {
    e.preventDefault(); e.target.click();
  }
});

document.addEventListener('click', e => {
  if (e.target.closest('input,textarea')) return;   // v6: 금액 입력칸을 눌러도 줄이 다시 그려지지 않게
  const a = e.target.closest('[data-act]');
  if (a) {
    if (a === dlg && e.target !== dlg) return;
    if (!a.disabled && ACT[a.dataset.act]) ACT[a.dataset.act](a.dataset, a);
    return;
  }
  const g = e.target.closest('[data-go]');
  if (g) { const { id, p } = parseGo(g.dataset.go); closeSheet(); push(id, p); return; }
  const t = e.target.closest('[data-tab]');
  if (t) switchTab(t.dataset.tab);
});

      note:{ v38:'v38: 과제 1 고칠 것 5(사장님 앱 같은 자리). 돈 카드 이름 "보관된 돈 · 급여일에 알바생에게 나가요"를 "지금까지 보관된 돈"으로, 보조 줄 "A님 몫 · 12월 10일"을 "A님 몫 · 12월 10일 급여일에 나가요"로(급여일에 나갈 월급 전부처럼 읽히지 않게)', v31:'v31: 할 일(채울 돈 안내, 퇴근 뒤 확정 카드)을 상태 제목 바로 아래로 (판단 7). 안내 둘째 줄 \'다음 주 일당이 모두\'를 \'다음 주 3명 몫이 모두\'로 (주휴수당이 섞인 금액, 판단 11)', v27:'v27: 행 아이콘을 3D 아이콘 40px로 (근무 ic_clock, 주휴수당 ic_coins, 보관 합계 ic_safe. 시간표의 사람 자리는 이름 글자 원 그대로)', v26:'v26: 판단 1로 날짜와 가게 이름 줄을 상태 제목 아래로. 채워 둔 돈 설명을 용어집 문장 \'아직 누구 몫도 아니라 언제든 꺼낼 수 있어요\'로', v24:'v24: 금액을 숫자 뒤 \'원\'으로(₩92,880을 92,880원으로), 날짜를 \'11월 21일 토요일\'로', v23:'v23: \'D-19\'를 \'급여일 19일 전\'으로, 채워 둔 돈 성질 줄, \'개근\'을 \'빠짐없이 나온 주\'로', v22:'v22: 할 일 \'다음 주 인건비가 ₩268,272 모자라요\'를 \'… ₩268,272만 더 채우면 돼요\'로', v21:'v21: 두 돈 아래 설명 줄을 빼고, 쉬는 사람 줄마다 되풀이되던 문장을 배지 \'쉬는 날\'로', v20:'v20: 두 돈 아래 줄을 \'근무를 확정하면 체무가 그날 일당을 … 옮겨요\'로', v18:'v18: 본문 큰 제목 \'오늘 밤 A님 근무가 있어요\', 상단 바 \'오늘\'은 이름표', v17:'v17: 다음 주 인건비 할 일 둘째 줄에서 금액을 빼고 \'채우면 다음 주 일당이 모두 보관돼요\'(규칙집 UX-17 예)', v9:'v9: 오늘 쉬는 C님, D님 원을 흰 글자 1.6:1에서 옅은 회색 바탕과 진한 글자 7.9:1로', v8:'v8: 먹색 카드 보라 글로우 뺌, 할 일 안내 상자 아이콘 24px, 오늘 시간표 사람 행 40px 원', q:'3명 몫으로 보관된 돈과 꺼낼 수 있는 채워 둔 돈은 얼마인가, 오늘 누가 일하나. 11월 21일(토) 기준이라 오늘 근무는 A님뿐이고 C님, D님은 쉬는 날로 보임. 시간표는 하루 근무 순서(D님 오전 8:00, C님 오후 5:30, A님 오후 10:00)', i:'오늘 탭', o:'다음 주 인건비, 근무 확정, 알바생 탭, 알림', w:'오늘 (각자 자기 몫만 보여요)',
        v:'v6: 두 돈 성질 한 줄, 최근 보관을 C님 주휴수당, D님 주휴수당 줄로 나누고 11월 20일 보관 합계 ₩165,120(₩41,280 × 4) 줄을 더함, 모자람 할 일은 해결 문장 먼저' } },
    { l:'출근 알림 (11월 21일)', key:'haneul/home/home/push', run:() => { reset(); S.shift = 'working'; jump('home', ['home'], H); showPush(); },

        v:'v6: 오늘 화면과 같은 두 돈 성질 한 줄, "가게 30m 안"으로 이름 맞춤' } },
    { l:'근무 확정', key:'haneul/home/confirm:today', run:() => { reset(); S.shift = 'out'; jump('home', ['home', 'confirm:today'], H); },
      note:{ v47:'v47: 맨 위에 "확정해도 돈은 지금 나가지 않아요. 12월 10일 급여일에 따로 누르지 않아도 A님에게 나가요", 안내 상자의 같은 줄은 뺌 (모의 사용 2). 시간 고치기 줄은 [시간 고치기]로 실제로 가서 그대로', v46:'v46: 상대 앱 화면을 알바생 21, 59 퇴근 뒤 확정 대기로 바로잡음 (판단 v40-6)', v31:'v31: \'확정하면 체무가 채워 둔 돈에서\'를 \'확정하면 채워 둔 돈에서 체무가\'로 (주어를 동사 가까이)', v24:'v24: 금액을 숫자 뒤 \'원\'으로(₩92,880을 92,880원으로)', v23:'v23: \'누르지 않아도\'를 \'급여일에는 따로 누르지 않아도\'로 (무엇을 안 눌러도 되는지)', v22:'v22: 출근 줄의 \'가게 30m 안에서 눌렀어요\'를 빼고 머리를 \'A님이 가게에서 남긴 기록\' 하나로 (감시하는 느낌)', v21:'v21: 제목에 있는 날짜를 위 줄에서 빼고, 퇴근 줄의 되풀이 설명을 뺌', v20:'v20: \'확정하면 체무가 채워 둔 돈에서 ₩92,880을 A님 몫으로 보관해요\', 출퇴근 단계 주어 \'A님이\', \'고치면 체무가 A님에게 바로 알려요\'', v19:'v19: 버튼 \'확정하고 보관하기\'를 사건 표 이름 \'확정하기\'로. 보관 금액은 바로 위 안내 상자에 있음', v17:'v17: 제목을 E01 \'A님 11월 21일 근무를 확정해 주세요\'로. \'급여일에 따로 이체하지 않아도 돼요\'를 용어집대로 \'누르지 않아도 급여일에 A님에게 나가요\'로. 쉬는 시간', v10:'v10: 글자 130%, 200%에서 아래 두 버튼을 세로로 쌓고 상단 바 제목이 줄을 바꿈', v8:'v8: 금액 머리를 위 15, 금액 28, 설명 17로. 시간 고치기는 옅은 버튼, 확정하고 보관하기만 채운 버튼. 기록 단계 24px 원', q:'이 근무 기록을 그대로 인정할까', i:'오늘의 할 일, 퇴근 알림', o:'확정 완료 또는 시간 고치기', w:'퇴근 뒤 확정 대기, 오늘: 퇴근 뒤 확정 대기',
        v:'v6: 제목 "A님 근무를 확정할까요?", 확정 문장은 한 번만 "채워 둔 돈에서 ₩92,880을 A님 몫으로 보관해요", 이름을 "퇴근 확정"에서 "근무 확정"으로' } },

      note:{ v46:'v46: 상대 앱에 알바생 60 오늘: 퇴근 뒤 보관됨을 더함 (판단 v40-6)', v38:'v38: 과제 2 고칠 것 3. 끝난 단계 "근무 확정", "…A님 몫으로 보관", "A님에게 알림"을 "근무를 확정함", "…보관함", "A님에게 알림 보냄"으로', v37:'v37: 금액 결과 화면 정렬(판단 v30-14): 작은 사물, 금액 제목, 보조 줄은 가운데, 진행 단계 목록은 왼쪽. 알바생 15와 같은 틀', v31:'v31: 둘째 단계 \'체무가 채워 둔 돈에서 A님 몫으로 보관\'을 \'채워 둔 돈에서 체무가 A님 몫으로 보관\'으로 (\'체무가 채워 둔 돈\'으로 끊어 읽히지 않게)', v26:'v26: 금액 결과 화면이라 히어로 iso_13을 빼고 금액 제목 위 작은 사물 ic_check 96px. 채워 둔 돈 설명을 용어집 문장 \'아직 누구 몫도 아니라 언제든 꺼낼 수 있어요\'로', v24:'v24: 금액을 숫자 뒤 \'원\'으로(₩92,880을 92,880원으로), 날짜를 \'11월 21일 토요일\'로', v23:'v23: 채워 둔 돈 성질 줄 \'누구 몫도 아니라 언제든 꺼낼 수 있어요\'', v20:'v20: \'12월 10일에 체무가 A님에게 보내요\', 단계 \'체무가 채워 둔 돈에서 A님 몫으로 보관\'', v17:'v17: 제목을 E03 \'A님 일당 ₩92,880을 보관했어요\'로, 아래 줄은 이름을 빼고 날짜만', v15:'v15: 3D 그림을 iso_04 금고에서 iso_13 사장님 카운터로 (사장님이 확정한 순간. 알바생 앱 보관 완료는 금고)', v14:'v14: 확정 완료 순간: 3D 그림이 아래에서 8px 떠오르며 나타남 320ms, 첫 단계 근무 확정의 체크를 그림 240ms. 금액은 세지 않고 그대로', v10:'v10: 전체 화면을 대화상자(role dialog, aria-modal)로 알리고 제목 근무 확정에 이음. Esc로 닫힘', v8:'v8: 닫기(X)가 있는 독립 흐름 끝 화면. 아래 버튼 "확인"을 "오늘로 돌아가기"로, 3D 마스크 뺌, 제목 28과 설명 17', q:'오늘 일당이 어디로 갔나', i:'근무 확정', o:'오늘', w:'퇴근, 일당 보관, 오늘: 퇴근 뒤 보관됨',
        v:'v6: 단계 "채워 둔 돈에서 A님 몫으로 보관"과 남은 채워 둔 돈의 성질, A님 앱 상태 칩 이름을 "보관됨"으로' } },
    { l:'확정 안 한 근무가 쌓였을 때', key:'haneul/home/home/backlog', run:() => { reset(); S.backlog = true; jump('home', ['home'], H); },
      note:{ v38:'v38: 과제 1 고칠 것 5(사장님 앱 같은 자리). 돈 카드 이름 "보관된 돈 · 급여일에 알바생에게 나가요"를 "지금까지 보관된 돈"으로, 보조 줄 "A님 몫 · 12월 10일"을 "A님 몫 · 12월 10일 급여일에 나가요"로(급여일에 나갈 월급 전부처럼 읽히지 않게)', v31:'v31: 2건 확정 창 본문 \'체무가 채워 둔 돈에서\'를 \'채워 둔 돈에서 체무가\'로', v29:'v29: 360x640에서 주 버튼이 첫 화면 밖이라 2건 확정하기를 안내 상자 바로 아래로', v27:'v27: 행 아이콘을 3D 아이콘 40px로 (확정할 근무 ic_clock, 주휴수당 ic_coins)', v26:'v26: 판단 1로 날짜와 가게 이름 줄을 상태 제목 아래로. 2건 확정 확인 창에 판단 2 한 줄 \'보관한 뒤에는 다시 꺼낼 수 없어요\'', v24:'v24: 금액을 숫자 뒤 \'원\'으로(₩92,880을 92,880원으로), 날짜를 \'11월 21일 토요일\'로', v23:'v23: \'D-17\'을 \'급여일 17일 전\'으로, 채워 둔 돈 성질 줄', v22:'v22: 탓하는 느낌의 배지 \'하루 지남\'을 뺌', v21:'v21: 안내 상자를 두 문장으로, 버튼과 확인 창을 \'2건 확정하기\'로, 확인 창 첫 줄(제목 되풀이)을 뺌', v20:'v20: \'확정하면 체무가 그날 일당을 바로 보관해요\', 주휴수당 줄 \'두 날을 확정하면 체무가 보관해요\', 확정 창 \'체무가 채워 둔 돈에서 ₩222,912를 …\'', v19:'v19: 확정 창 버튼 \'확정하기\'를 \'2개 확정하기\'로', v18:'v18: 본문 큰 제목을 E02 \'확정할 근무가 2건 남아 있어요\'로 올리고, 아래 안내 상자는 같은 줄을 빼고 돈 위치부터', v17:'v17: 안내 제목을 E02 \'확정할 근무가 2건 남아 있어요\'로 (확정 전 대신 남은 건수). \'A님 몫 · 12월 10일\'', v16:'v16: 버튼 \'2개 확정하고 ₩222,912 보관하기\'(21자)를 \'2개 확정하기\'로. 금액은 바로 위 안내와 확정 창에 있음 (UX-14)', v15:'v15: 안내 제목을 탓하지 않는 "어제 근무 2개가 확정 전이에요"로', v8:'v8: 한 번에 확정하는 버튼만 채운 버튼, 줄마다 왼쪽 24px 아이콘, 먹색 카드 글로우 뺌', q:'확정하지 않은 근무가 몇 개, 얼마인가', i:'오늘 (월요일 아침)', o:'한 번에 확정하기, 줄마다 그날 근무 확정 (11월 21일, 11월 22일)', w:'근무 기록 (확정 대기)',

    { l:'시간 고치기 (11월 15일)', key:'haneul/staff/edit:h1114', run:() => { reset(); jump('staff', ['staff', 'edit:h1114'], H); },

      note:{ v47:'v47: 금액 줄 아래 "차이 나는 5,160원은 체무가 채워 둔 돈으로 돌려놨어요"로 결정이 끝난 것을 먼저 쓰고, 사장님이 정할 때까지 남겨 둔다는 옛 단계를 뺌 (모의 사용 4). 시점: 급여일 금액과 다른 갈래라 PANEL 이름에 적음 (모의 사용 5)', v46:'v46: PANEL 이름 "이의 정리: 내 기록 유지"를 "내 기록 그대로 둠"으로 (판단 v40-3). 상대 앱 화면을 알바생 27 다르다고 알린 결과: 기록 그대로 둠으로 바로잡음 (판단 v40-6)', v38:'v38: 과제 2 고칠 것 3. 끝난 단계를 "체무가 5,160원을 채워 둔 돈으로 돌려놓음", "A님에게 알림 보냄"으로', v37:'v37: 금액 결과 화면 정렬(판단 v30-14): 작은 사물, 금액 제목, 보조 줄은 가운데, 진행 단계 목록은 왼쪽. 알바생 15와 같은 틀', v29:'v29: 금액이 결과인 화면이라 히어로 iso_08을 빼고 작은 사물 ic_scale 96px', v26:'v26: 그림 iso_08 경로를 웹용 webp로', v24:'v24: 금액을 숫자 뒤 \'원\'으로(₩92,880을 92,880원으로)', v22:'v22: \'A님은 기록을 내보내 상담에 쓸 수 있어요\'(사장님을 겨누는 느낌)를 A님 앱에 보이는 문장(사건 표 E07)으로', v21:'v21: \'그대로\'를 제목 한 번만', v20:'v20: \'체무가 ₩5,160을 채워 둔 돈으로 돌려놨어요\'', v17:'v17: 제목을 E07 \'내 기록을 그대로 뒀어요\'로, 유지와 차액을 \'그대로\', \'차이 나는 돈\'으로, 버튼 \'기록 맞춰 보기\'', v15:'v15: 결과 표시 원 대신 3D 그림 iso_08 저울(두 기록을 견준 결과)을 206px로. 사장님 앱에서 빠진 그림을 장면이 맞는 곳에', v8:'v8: 기록 대조 보기는 옅은 버튼, "확인"을 "오늘로 돌아가기"로', q:'내 기록을 그대로 두면 무엇이 남나', i:'다르다고 알림 받음 → 이유 남기기 시트', o:'기록 맞춰 보기, 오늘', w:'다르다고 알린 결과: 기록 그대로 둠',
