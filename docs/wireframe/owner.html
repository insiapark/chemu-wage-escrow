    { l:'보관함', key:'haneul/vault/vault', run:() => { reset(); jump('vault', ['vault'], H); },
      note:{ v40:'v40: 확정하면 바로 보관 행 오른쪽 스위치가 보이지 않던 것(0px)을 46x28로', v27:'v27: 행 아이콘을 3D 아이콘 40px로 (다음 주 예상 인건비 ic_coins, 더 채워 둔 상태 ic_check, 확정하면 바로 보관 ic_safe, 급여일 미리 보기 ic_calendar)', v26:'v26: 판단 1로 가게 이름 줄을 상태 제목 아래로. 채워 둔 돈 설명을 용어집 문장 \'아직 누구 몫도 아니라 언제든 꺼낼 수 있어요\'로', v25:'v25: 스위치에 화면 읽기 이름 \'켜져 있어요\'', v24:'v24: 금액을 숫자 뒤 \'원\'으로(₩92,880을 92,880원으로), 시각을 \'오전 9:00\'으로', v23:'v23: \'자동 보관\'(은행 자동이체와 헷갈림)을 \'확정하면 바로 보관\'과 \'사업자 계좌가 아니라 채워 둔 돈에서 옮겨요\'로, 채워 둔 돈 설명을 \'사장님이 사업자 계좌에서 채워 둔 돈\'으로', v22:'v22: \'다음 주 인건비를 빼도 ₩227,088이 남아요\'(통장 사정을 계산하는 느낌)를 \'다음 주 인건비보다 ₩227,088 더 채워 뒀어요\'로', v21:'v21: 자동 보관 줄과 같은 설명 줄, 제목과 같은 \'넉넉해요\'를 뺌', v20:'v20: \'근무를 확정하면 체무가 그날 일당을 … 옮겨요\', 자동 보관 줄에 \'체무가\'', v18:'v18: 상단 바 \'보관함\'은 이름표, 본문 큰 제목 \'다음 주 인건비까지 채워 뒀어요\'', v17:'v17: 채워 둔 돈 설명 \'넣어 두고\'를 \'채워 두고\'로. 보관된 돈 칸의 \'급여일 전에는 사장님이 꺼낼 수 없어요\'를 뺌(바로 위 \'급여일에 알바생에게 나가요\'와 같은 뜻, 정책 문장은 비교표와 꺼내기 화면에)', v8:'v8: 보관함 채우기를 화면 맨 아래 채운 버튼에서 채워 둔 돈 카드 안 옅은 버튼으로 옮김(채우는 돈 바로 옆). 두 돈 이름 앞 작은 아이콘과 돈이 움직이는 길 보기 뒤 화살표를 뺌', q:'보관함에 다음 주 인건비만큼 돈이 있나', i:'보관함 탭, 알림', o:'보관함 채우기, 급여일 미리보기, 돈이 움직이는 길', w:'급여: 보관 현황', v7:'v7: 두 돈 설명 아래 "돈이 움직이는 길 보기"',
        v:'v6: 두 돈(채워 둔 돈, 보관된 돈)과 성질 한 줄, 옮겨가는 방향을 화면 맨 위에. 3D 그림은 뺌(한 화면 한 메시지 화면이 아님)' } },
    { l:'보관함: 알바 3명', nw:true, key:'team/vault/vault', run:() => teamJump('vault', ['vault']),
      note:{ v47:'v47: 12월 10일에 나갈 인건비 행 설명을 "3명 11월분 · 근무표대로 예상"으로 (26과 같은 시점, 모의 사용 5)', v40:'v40: 확정하면 바로 보관, 자동 채우기 행 오른쪽 스위치가 보이지 않던 것(0px)을 46x28로', v31:'v31: 채울 돈 안내 \'다음 주 일당이 모두 보관돼요\'를 \'다음 주 3명 몫이 모두 보관돼요\'로 (주휴수당이 섞인 금액, 판단 11)', v27:'v27: 행 아이콘을 3D 아이콘 40px로 (확정하면 바로 보관 ic_safe, 자동 채우기 ic_repeat, 나갈 인건비 ic_coins, 꺼내기 ic_bankbook, 두 돈 비교표 ic_magnifier)', v26:'v26: 판단 1로 가게 이름 줄을 상태 제목 아래로. 채워 둔 돈 설명을 용어집 문장 \'아직 누구 몫도 아니라 언제든 꺼낼 수 있어요\'로', v25:'v25: 스위치에 화면 읽기 이름 \'켜져 있어요\', \'꺼져 있어요\'', v24:'v24: 금액을 숫자 뒤 \'원\'으로(₩92,880을 92,880원으로), 시각을 \'오전 9:00\'으로', v23:'v23: \'자동 보관\'을 \'확정하면 바로 보관\'으로, 채워 둔 돈 성질 줄과 설명', v22:'v22: 제목 \'다음 주 인건비가 ₩268,272 모자라요\'(되풀이해 찌르는 느낌)를 \'₩268,272만 더 채우면 돼요\'로 (글자 200%에서 두 줄)', v21:'v21: 자동 보관 줄과 같은 설명 줄을 뺌', v20:'v20: 보관함과 같이 주어 \'체무가\'', v18:'v18: 본문 큰 제목 \'다음 주 인건비가 ₩268,272 모자라요\', 아래 안내 상자는 할 일 \'채우면 다음 주 일당이 모두 보관돼요\'만', v17:'v17: 보관함과 같이 \'채워 두고\', 꺼낼 수 없다는 줄을 뺌. 모자람 둘째 줄에서 금액을 뺌', v8:'v8: 보관함 채우기를 채워 둔 돈 카드 안 옅은 버튼으로 옮김. 두 돈 이름 앞 작은 아이콘 뺌, 할 일 안내 상자 아이콘 24px', q:'채워 둔 돈과 보관된 돈이 각각 얼마이고, 다음 주 3명 인건비가 채워져 있나', i:'보관함 탭', o:'돈이 움직이는 길, 두 돈 비교표, 다음 주 인건비, 자동 채우기, 12월 10일 인건비 미리 보기, 꺼내기, 보관함 채우기', w:'급여: 보관 현황', v7:'v7: 두 돈 설명 아래 "돈이 움직이는 길 보기"',
        v:'v6: "두 돈은 어떻게 달라요?" 버튼을 없애고 두 돈의 차이를 맨 위에 늘 보이게, 표는 아래 "두 돈 비교표" 줄로' } },
    { l:'보관함 채우기', key:'sheet:fill', run:() => { reset(); jump('vault', ['vault'], H); openFill(); },
      note:{ v27:'v27: 뒤 화면 보관함의 행 아이콘을 3D 아이콘 40px로 (시트 안 선택지 행은 그림 없음)', v26:'v26: 뒤 화면 보관함의 가게 이름 줄을 상태 제목 아래로. 채워 둔 돈 설명을 용어집 문장 \'아직 누구 몫도 아니라 언제든 꺼낼 수 있어요\'로', v25:'v25: 채운 뒤 토스트를 한 줄 결과 \'222,912원을 채웠어요\'로', v24:'v24: 금액을 숫자 뒤 \'원\'으로(₩92,880을 92,880원으로), 시각을 \'오전 9:00\'으로', v23:'v23: 뒤 보관함 화면의 \'확정하면 바로 보관\' 줄과 채워 둔 돈 설명', v22:'v22: 뒤 보관함 화면 줄을 \'다음 주 인건비보다 ₩227,088 더 채워 뒀어요\'로', v21:'v21: 채우기와 상관없는 둘째 문장을 뺌', v20:'v20: 시트 설명 \'체무가 사업자 계좌에서 보관함으로 옮겨요\'', v18:'v18: 뒤 화면 제목이 \'다음 주 인건비까지 채워 뒀어요\'로 (시트 제목은 그대로)', v16:'v16: \'직접 입력\'을 \'직접 쓰기\'로 (UX-09)', v14:'v14: 시트가 올라오는 시간을 280ms에서 240ms로. 채운 뒤 토스트는 하단 버튼 위로 200ms 동안 올라옴', v10:'v10: 열면 시트 안으로 포커스, Tab은 시트 안에서만 돌고 닫으면 보관함 채우기 단추로 돌아감. 금액 행은 role radio', v8:'v8: 시트를 화면 아래에 붙이고 위 모서리 24, 좌우 16, 최대 높이 90%. 돈이 옮겨지는 시트라 손잡이를 빼고 위 닫기(X), 바깥을 눌러도 닫히지 않음. 아래 닫기 버튼을 빼고 채우기 버튼 하나. 설명 15', q:'얼마를 넣어 둘까', i:'보관함, 내 정보의 사업자 계좌', o:'보관함 (채워 둔 돈 늘어남)', w:'없음',
        v:'v6: 시트는 그대로, 뒤의 보관함 화면이 두 돈 맨 위 구성으로 바뀜' } },
    { l:'채워 둔 돈과 보관된 돈', nw:true, key:'team/vault/explain', run:() => teamJump('vault', ['vault', 'explain']),
      note:{ v24:'v24: 금액을 숫자 뒤 \'원\'으로(₩92,880을 92,880원으로), 시각을 \'오전 9:00\'으로', v23:'v23: 맨 아래 \'프로토타입\'(외래어)을 \'시연 버전\'으로', v22:'v22: 꺼내기 칸을 \'이미 알바생 몫이라 꺼낼 수 없어요\'로 (내 돈을 막는 느낌 대신 이유)', v21:'v21: 표의 \'바뀔 때\' 줄과 같은 아래 줄을 빼고, 책임 두 문장을 한 문장으로', v20:'v20: 아래 줄 \'근무를 확정하면 체무가 그날 일당을 … 옮겨요\'', v18:'v18: \'보관함의 두 가지 돈\'은 이름표로, 본문 큰 제목 \'보관함 돈은 두 가지로 나뉘어요\'', v17:'v17: \'급여일까지 묶인 돈\'을 \'급여일에 알바생에게 나갈 돈\'으로, \'넣어 둔 돈\'을 \'채워 둔 돈\'으로, 꺼내기 칸에 이유 \'알바생 몫이라\', 책임 문장 \'임금\'을 \'일당과 월급\'으로', v8:'v8: 넓은 표 화면이라 좌우 여백 20px, 표 상자 모서리 16', q:'사장님이 꺼낼 수 있는 돈과 급여일까지 묶인 돈은 무엇이 다른가 (그림 없이 표로)', i:'보관함의 "두 돈 비교표"', o:'보관함', w:'보관된 돈은 누가 꺼낼 수 있나요',
        v:'v6: 꺼내기 칸을 "급여일 전에는 사장님이 꺼낼 수 없어요. 알바생이 그만두면 다음 날 정산으로 나가요"로, "임금을 주는 책임은 사장님에게 있어요. 체무는 보관과 기록을 맡아요" 한 줄을 더함' } },
    { l:'돈이 움직이는 길', nw7:true, key:'team/vault/moneyflow', run:() => teamJump('vault', ['vault', 'moneyflow']),
      note:{ v46:'v46: 상대 앱 화면을 알바생 52 돈이 움직이는 길과 30으로 바로잡음 (판단 v40-6)', v28:'v28: 행 다섯 개 흐름을 iso_40~43 네 칸 장면(채우기 iso_40, 확정 iso_42, 보관 iso_41, 급여일 iso_43. 알바생 앱 52와 같은 순서와 단계 이름)과 칸마다 한 줄로. v21에서 되살린 원화로 바꿔요 단계는 넷째 칸 아래 한 줄. 네 칸 그림은 히어로 한 화면 하나 규칙의 예외', v26:'v26: 채워 둔 돈 설명을 용어집 문장 \'아직 누구 몫도 아니라 언제든 꺼낼 수 있어요\'로', v24:'v24: 시각을 \'오전 9:00\'으로', v23:'v23: 채워 둔 돈 설명을 \'누구 몫도 아니라 언제든 꺼낼 수 있어요\'로', v21:'v21: 판단 1: v15의 \'원화로 바꿔요\' 단계를 쉬운 말로 되살림(바꾸는 수수료 한 줄, 시연 버전 한 줄). 책임 두 문장을 한 문장으로', v20:'v20: 단계에 주어 \'사장님이 근무 확정\', \'체무가 알바생 계좌로 보내요\'', v18:'v18: 이름표 \'돈이 움직이는 길\', 본문 큰 제목 \'돈은 사업자 계좌에서 알바생 계좌로 가요\'', v17:'v17: 보관된 돈 칸을 \'급여일까지 알바생 몫으로 보관해요\'로, 책임 문장 \'일당과 월급\'', v16:'v16: 시스템 말을 뺌. \'테스트넷의 연습용 원화(KRWt)\'를 \'연습용 돈\'으로, \'원화로 바꿔요\'와 \'알바생 원화 계좌\'를 \'알바생 계좌로 보내요\', \'알바생 은행 계좌\'로 (UX-10)', v15:'v15: "테스트넷 모의 원화 토큰(KRWt)"을 생활 말 "테스트넷의 연습용 원화(KRWt)"로', v8:'v8: 다섯 행 왼쪽을 40px 원으로, 맺음 글 두 줄의 아이콘 뺌', q:'사장님 사업자 계좌의 돈이 어떤 길로 알바생 원화 계좌까지 가나, 원화로 바꾸는 수수료와 1:1 상환은 누가 맡나 (심사 질문용, 그림 없이 행 다섯 개)', i:'보관함 맨 위 두 돈 설명의 "돈이 움직이는 길 보기"', o:'보관함', w:'돈이 움직이는 길, 보관된 돈은 누가 꺼낼 수 있나요',
        v7:'v7: 새 화면. 사업자 계좌 → (사장님이 채움) → 채워 둔 돈 → (근무 확정) → 보관된 돈 → (급여일 오전 9시, 또는 그만둔 다음 날) → 원화로 바꿔요 → 알바생 원화 계좌, 맨 아래 책임 한 줄과 시연 버전 한 줄. 미정: 수수료 부담 주체(화면은 "알바생이 내지 않아요"까지만), 실제 서비스에서 원화로 바꾸는 곳(상환 주체)' } },
    { l:'다음 주 인건비가 모자랄 때', nw:true, key:'team/vault/need', run:() => teamJump('vault', ['vault', 'need']),

  ['설정과 도움', [

function fit() {
  const s = Math.min(1, (innerHeight - 32) / 876, (innerWidth - 24) / 417);
  document.documentElement.style.setProperty('--s', s);
}
addEventListener('resize', fit);

// v35: 보이는 글에 기호나 시각이 있으면 aria-hidden 보이는 글 + 화면 읽기 전용 글로 나눔. data-sr 묶음은 한 문장으로 읽고 안쪽은 숨김
const SR_SKIP = 'textarea,input,script,style,.vh,[aria-hidden="true"]:not(#modal),:is([role=button],[role=link],[role=switch],[role=radio],[role=img],button,a)[aria-label],.panel';
const SR_NAMED = '[role=link],[role=radio],[role=checkbox],[role=button]';
function a11yPass(root) {
  if (!root || root.nodeType !== 1 || root.closest(SR_SKIP)) return;

  for (const el of [root, ...root.querySelectorAll(SR_NAMED)]) {
    if (!el.matches(SR_NAMED) || el.hasAttribute('aria-label')) continue;
    const parts = [], w2 = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    for (let n = w2.nextNode(); n; n = w2.nextNode()) { if (n.parentElement.closest('[aria-hidden="true"],.vh')) continue; const t = n.textContent.replace(/\s+/g, ' ').trim(); if (t) parts.push(t); }
    if (parts.length > 1 || srText(parts.join('')) !== parts.join('')) el.setAttribute('aria-label', srText(parts.join(' · ')));
  }
  for (const el of [root, ...root.querySelectorAll('[data-sr]')]) {
    if (!el.dataset || el.dataset.sr === undefined || el.dataset.srDone) continue;
    el.dataset.srDone = '1';
    for (const k of [...el.children]) k.setAttribute('aria-hidden', 'true');
    const v = document.createElement('span'); v.className = 'vh'; v.textContent = srText(el.dataset.sr); el.prepend(v);
  }
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const list = [];
  for (let n = w.nextNode(); n; n = w.nextNode()) {
    const t = n.textContent;
    if (!t.trim() || n.parentElement.closest(SR_SKIP)) continue;
    const r = srText(t);
    if (r !== t.replace(/\s+/g, ' ').trim()) list.push([n, r]);

// v36: 긴 글 점검 모드 (?long=1). 기본 데이터는 그대로 두고, 화면에 그려진 글만 가게 이름 20자, 금액 7자리, 긴 알바생 이름으로 바꿔 그린다.
//      기본 화면(쿼리 없음)의 글과 숫자는 바뀌지 않는다. 0원은 그대로, 7자리가 안 되는 금액은 앞에 9를 채워 7자리로
const LONG = /[?&]long=1(&|$)/.test(location.search) ? {
  names: { A:'남궁알렉산드라', B:'제갈바르톨로메오', C:'황보크리스티나', D:'선우도미니크' },
} : null;
function longStr(t) {
  return t.replace(/새싹편의점 연희점/g, '새싹편의점 서대문구 연희동 먹자골목점').replace(/동네 식당(?! 마포구)/g, '동네 식당 마포구 연남동 경의선숲길점')
    .replace(/(^|[^A-Za-z])([ABCD])님/g, (m, p, c) => p + LONG.names[c] + '님')
    .replace(/(^|[^\d,])(\d{1,3}(?:,\d{3})*)원/g, (m, p, n) => { const d = n.replace(/,/g, ''); return /^0+$/.test(d) || d.length >= 7 ? m : p + Number('9'.repeat(7 - d.length) + d).toLocaleString('ko-KR') + '원'; });

function longify(root) {

new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) { if (LONG) longify(n); a11yPass(n.nodeType === 3 ? n.parentElement : n); } })

setFontScale(+(new URLSearchParams(location.search).get('fs') || 100));   // v10: ?fs=130, ?fs=200 으로도 열 수 있음
