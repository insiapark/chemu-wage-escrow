<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체무 알바생 앱 v7</title>
<!-- 글꼴: 기기 기본 글꼴 -->
<style>
/* =========================================================
   체무 v2 디자인
   VOICE  차분하고 단단한 금융 앱
   IDEA   통장 앞면처럼 짙은 카드 한 장에 내 돈이 쌓인다
   COLOUR 따뜻한 회색 바탕, 먹색 카드, 보라 포인트 하나
   TYPE   IBM Plex Sans KR, 숫자는 크게
   ========================================================= */
:root{
  --c-page:#f4f3f0; --c-card:#ffffff; --c-line:#e6e4df; --c-line2:#efede9;
  --c-ink:#19181d; --c-body:#47454f; --c-mute:#8a8792;
  --c-accent:#5b4bdb; --c-accent-press:#4a3bc4; --c-accent-soft:#ecE9fd; --c-accent-light:#a89dff;
  --c-urgent:#d6383e; --c-urgent-soft:#fbe8e8;
  --c-help:#c27200; --c-help-soft:#faefdc;
  --c-news:#0f8574; --c-news-soft:#e1f2ef;
  --c-daily:#6f6c78; --c-daily-soft:#ecebe8;
  --font:'IBM Plex Sans KR', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:#d9d7d2;color:var(--c-ink);overflow:hidden;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
.i *{vector-effect:non-scaling-stroke}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* 무대 */
.stage{height:100vh;display:flex;align-items:center;justify-content:center;gap:48px}
.device{flex:none;width:417px;height:876px;padding:12px;border-radius:67px;background:#1c1b20;box-shadow:0 0 0 2px #35333b,0 30px 60px rgba(0,0,0,.18);transform:scale(var(--s,1))}
.screen{position:relative;width:393px;height:852px;border-radius:55px;overflow:hidden;background:var(--c-page)}
.island{position:absolute;z-index:600;top:11px;left:50%;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000}
.statusbar{position:absolute;z-index:500;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 28px 0 50px;pointer-events:none;font-weight:600;font-size:16px;color:var(--c-ink)}
.statusbar .sb-r{display:flex;gap:6px;align-items:center}
.home-ind{position:absolute;z-index:600;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--c-ink);pointer-events:none}

.panel{width:252px;max-height:86vh;overflow-y:auto;scrollbar-width:none;padding:18px;border-radius:24px;background:#fff}
.panel::-webkit-scrollbar{display:none}
.panel h2{font-size:18px;font-weight:700;color:var(--c-ink);margin-bottom:4px}
.panel .sub{font-size:12px;color:var(--c-mute);margin-bottom:6px;line-height:1.55}
.panel h3{font-size:11px;font-weight:700;color:var(--c-accent);margin:16px 0 4px;letter-spacing:.02em}
.panel button{display:block;width:100%;min-height:32px;padding:6px 10px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--c-body);line-height:1.35}
.panel button:hover{background:var(--c-page)}
.panel button.on{background:var(--c-ink);color:#fff}
@media (max-width:900px){.panel{display:none}}

/* 화면 틀 */
#viewport{position:absolute;inset:0;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--c-page);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.view.enter{transform:translateX(100%)}
.view.under{transform:translateX(-24%)}
.view.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.vtop{flex:none;height:54px;background:var(--c-page)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:0 18px 28px}
.scroll::-webkit-scrollbar,.chips::-webkit-scrollbar,.sheet-body::-webkit-scrollbar,.ob-body::-webkit-scrollbar,.mbody::-webkit-scrollbar{display:none}
.view.root .scroll{padding-bottom:112px}

.tab-head{flex:none;display:flex;align-items:center;gap:8px;min-height:68px;padding:4px 14px 8px 20px;background:var(--c-page);transition:box-shadow .2s}
.tab-head .tt{display:flex;flex-direction:column}
.tab-head .tt small{font-size:12.5px;font-weight:500;color:var(--c-mute)}
.tab-head h1{font-size:23px;font-weight:700;color:var(--c-ink);letter-spacing:-.03em}
.tab-head .sp{flex:1}
.head-ic{position:relative;flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--c-ink);background:#fff}
.head-ic:active{background:var(--c-line2)}
.head-ic b{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;border:2px solid var(--c-page);background:var(--c-urgent);color:#fff;font-size:10px;font-weight:700;line-height:13px;text-align:center}
.head-pill{display:flex;align-items:center;gap:5px;height:40px;padding:0 14px 0 11px;border-radius:14px;background:var(--c-ink);color:#fff;font-size:13.5px;font-weight:600}
.head-pill.on{background:var(--c-news)}
.store-pill{display:none}

.back-head{flex:none;display:flex;align-items:center;gap:6px;height:56px;padding:0 12px;background:var(--c-page);transition:box-shadow .2s}
.back-head .head-ic{background:transparent}
.back-head h2{flex:1;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back-head .act{font-size:14px;font-weight:600;color:var(--c-accent);padding:0 8px;height:40px;white-space:nowrap}
.back-head > span{display:none}
.scrolled{box-shadow:0 1px 0 var(--c-line)}

.dock{flex:none;display:flex;gap:8px;padding:12px 18px 38px;background:var(--c-page)}

/* 하단 탭: 가운데 버튼 없이 네 칸 */
.tabbar{position:absolute;z-index:50;left:12px;right:12px;bottom:24px;height:66px;display:flex;padding:7px;border-radius:24px;background:rgba(25,24,29,.94);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.tabbar.hide{transform:translateY(160%)}
.tabbar > button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:18px;font-size:10.5px;font-weight:500;color:rgba(255,255,255,.55)}
.tabbar > button.on{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
.tabbar .gap,.fab{display:none}

/* 공통 부품 */
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px;font-size:15px;font-weight:700;color:var(--c-ink)}
.sec-h button{font-size:13px;font-weight:500;color:var(--c-accent);height:28px}
.sec-h:first-child{margin-top:6px}

.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:54px;padding:0 16px;border-radius:999px;background:var(--c-accent);color:#fff;font-size:16px;font-weight:600;white-space:nowrap;transition:transform .12s,background .12s}
.btn:active{transform:scale(.98);background:var(--c-accent-press)}
.btn.sec{background:#fff;color:var(--c-ink);box-shadow:inset 0 0 0 1px var(--c-line)}
.btn.sec:active{background:var(--c-line2)}
.btn.line{background:#fff;box-shadow:inset 0 0 0 1px var(--c-line);color:var(--c-ink)}
.btn.danger{background:var(--c-urgent)}
.btn.done{background:var(--c-news-soft);color:var(--c-news)}
.btn.sm{height:44px;font-size:14.5px}
.btn[disabled]{background:#e4e2de;color:#a5a2ab;transform:none;cursor:default;box-shadow:none}
.btnrow{display:flex;gap:8px;margin-top:16px}

.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px 0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--c-daily-soft);color:var(--c-daily)}
.tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.ok{background:var(--c-news-soft);color:var(--c-news)}
.tag.warn{background:var(--c-help-soft);color:var(--c-help)}
.tag.danger{background:var(--c-urgent-soft);color:var(--c-urgent)}
.tag.acc{background:var(--c-accent-soft);color:var(--c-accent)}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 4px}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 14px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--c-line);color:var(--c-body);font-size:13px;font-weight:600;transition:transform .12s}
.chip.on{background:var(--c-ink);box-shadow:none;color:#fff}
.chip:active{transform:scale(.96)}
.chip .cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--c-urgent);color:#fff;font-size:11px}

.card{display:block;width:100%;padding:18px;border-radius:22px;background:#fff;text-align:left;position:relative;box-shadow:0 1px 2px rgba(25,24,29,.04)}
.card.tap{cursor:pointer}
.card.tap:active{background:#fafaf8}
.card.acc{box-shadow:inset 0 0 0 2px var(--c-news)}
.card + .card{margin-top:10px}
.c-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:10px}
.c-title{font-size:17px;font-weight:700;line-height:1.4}
.tags + .c-title{margin-top:10px}
.c-title.big{font-size:22px;font-weight:700;letter-spacing:-.02em}
.c-body{margin-top:4px;font-size:14px;line-height:1.5;color:var(--c-body)}
.c-price{flex:none;font-size:18px;font-weight:700}

/* 히어로: 짙은 카드 한 장에 쌓이는 돈 */
.pcard{display:block;width:100%;padding:22px 20px 18px;border-radius:26px;background:var(--c-ink);color:#fff;text-align:left;overflow:hidden;position:relative}
.pcard::after{content:'';position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(91,75,219,.55),rgba(91,75,219,0) 70%)}
.pc-top{position:relative;z-index:1;display:flex;align-items:flex-start;gap:12px}
.pc-ic{flex:none;order:2;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff}
.pc-top .m{flex:1;min-width:0}
.pc-top small{display:block;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.6)}
.pc-top b{display:block;margin:6px 0 2px;font-size:34px;font-weight:700;letter-spacing:-.03em}
.pc-top p{font-size:13.5px;color:rgba(255,255,255,.7)}
.pc-bot{position:relative;z-index:1;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.pc-line{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:600}
.pc-line span{font-weight:500;color:rgba(255,255,255,.65)}
.pc-line .acc{color:var(--c-accent-light);font-weight:700}
.pc-bot small{display:block;margin-top:8px;font-size:12px;line-height:1.5;color:rgba(255,255,255,.5)}

.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{width:24px;height:24px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.28);display:grid;place-items:center;color:var(--c-ink)}
.slot.kept{border:0;background:var(--c-accent-light)}
.slot.pending{border:0;background:#f0b65a}
.slot.missing{border:0;background:#ff6b6f}
.slot.today{border:1.5px solid #fff}
.slots.dense .slot{width:14px;height:14px}
.slot-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:11.5px;color:rgba(255,255,255,.55)}
.slot-legend span{display:flex;align-items:center;gap:5px}
.slot-legend i{width:9px;height:9px;border-radius:50%;background:var(--c-accent-light)}
.slot-legend i.p{background:#f0b65a}
.slot-legend i.m{background:#ff6b6f}
.slot-legend i.n{background:none;border:1.5px dashed rgba(255,255,255,.35)}

/* 묶음 목록 */
.group{border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(25,24,29,.04)}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:13px 16px;text-align:left}
.row + .row::before{content:'';position:absolute;top:0;left:62px;right:16px;height:1px;background:var(--c-line2)}
.row.tap{cursor:pointer}
.row.tap:active{background:#fafaf8}
.ri{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--c-page);color:var(--c-body)}
.ri.acc{background:var(--c-accent-soft);color:var(--c-accent)}
.ri.ok{background:var(--c-news-soft);color:var(--c-news)}
.ri.warn{background:var(--c-help-soft);color:var(--c-help)}
.ri.danger{background:var(--c-urgent-soft);color:var(--c-urgent)}
.rm{flex:1;min-width:0;display:flex;flex-direction:column}
.rt{font-size:15px;font-weight:600;line-height:1.4}
.rt.mute{color:var(--c-mute)}
.rs{margin-top:1px;font-size:12.5px;line-height:1.45;color:var(--c-mute)}
.rm .tags{margin-top:6px}
.rr{flex:none;font-size:14px;color:var(--c-mute);text-align:right}
.rr.strong{color:var(--c-ink);font-weight:700}
.rr.acc{color:var(--c-accent);font-weight:700}
.rr.red{color:var(--c-urgent);font-weight:700}
.chev{flex:none;display:flex;color:#c4c1bb}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c-accent)}

.ck{position:relative;flex:none;width:24px;height:24px;border-radius:8px;border:2px solid #cfccc6;display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.ck::before{content:'';position:absolute;inset:-9px}
.ck.on{border-color:var(--c-ink);background:var(--c-ink);color:#fff}

/* 단계 목록: 작은 사각 아이콘 + 가는 선 */
.steps{display:flex;flex-direction:column;padding:6px 16px;border-radius:20px;background:#fff}
.result .steps,.payday .steps{background:transparent;padding:0}
.step{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:9px 0;text-align:left}
.step::before{content:'';position:absolute;left:14.5px;top:42px;bottom:-9px;width:1px;background:var(--c-line)}
.steps > :last-child::before{display:none}
.step.top{align-items:flex-start}
.st-c{position:relative;z-index:1;flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--c-page);color:var(--c-mute);transition:background .3s,color .3s}
.st-c svg{width:16px;height:16px}
.step.cur .st-c,.step.done .st-c{background:var(--c-ink);color:#fff}
.step.ok .st-c{background:var(--c-news);color:#fff}
.step.warn .st-c{background:var(--c-help-soft);color:var(--c-help)}
.step.bad .st-c{background:var(--c-urgent);color:#fff}
.st-m{flex:1;min-width:0}
.step.top .st-m{padding-top:4px}
.st-t{font-size:14.5px;font-weight:600;line-height:1.4}
.step.next .st-t{color:var(--c-mute)}
.st-s{margin-top:1px;font-size:12.5px;line-height:1.5;color:var(--c-mute)}
.st-m .tags{margin-top:6px}
.st-r{flex:none;font-size:13px;font-weight:700;color:var(--c-accent);padding-top:6px}
.st-r.mute{font-weight:500;color:var(--c-mute)}
.st-link{display:inline-flex;align-items:center;gap:2px;margin-top:6px;font-size:12.5px;font-weight:600;color:var(--c-accent)}

/* 요약 숫자 */
.sum{padding:6px 2px 4px}
.sum-k{font-size:12.5px;font-weight:500;color:var(--c-mute)}
.sum-big{margin-top:4px;font-size:34px;font-weight:700;letter-spacing:-.03em}
.sum-big.acc{color:var(--c-ink)}
.sum-big.red{color:var(--c-urgent)}
.sum-s{margin-top:4px;font-size:14px;line-height:1.5;color:var(--c-body)}
.sum .tags{margin-top:10px}

.diff{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.diff div{padding:14px;border-radius:18px;background:#fff}
.diff small{display:block;font-size:12px;font-weight:500;color:var(--c-mute)}
.diff b{display:block;margin-top:4px;font-size:20px;font-weight:700}
.diff .boss{background:var(--c-help-soft)}
.diff .boss b{color:var(--c-help)}

.callout{display:flex;gap:10px;margin-top:10px;padding:15px 16px;border-radius:18px;background:var(--c-help-soft)}
.callout .i{flex:none;color:var(--c-help);margin-top:1px}
.callout b{display:block;font-size:14.5px;font-weight:700;color:var(--c-help)}
.callout span{font-size:13px;line-height:1.55;color:var(--c-body)}
.callout.danger{background:var(--c-urgent);}
.callout.danger .i,.callout.danger b,.callout.danger span,.callout.danger .chev{color:#fff}
.callout.danger span{opacity:.88}
.callout.danger .btn.sec{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.callout.ok{background:var(--c-news-soft)}
.callout.ok .i,.callout.ok b{color:var(--c-news)}
.callout.acc{background:var(--c-accent-soft)}
.callout.acc .i,.callout.acc b{color:var(--c-accent)}
.callout .btnrow{margin-top:12px}
.callout .btn.sm{height:38px;font-size:13.5px}
.callout.tap{cursor:pointer}
.note{display:flex;gap:8px;margin-top:14px;padding:0 2px;font-size:12.5px;line-height:1.55;color:var(--c-mute)}
.note .i{flex:none;margin-top:1px}

.paper{margin-top:12px;padding:20px 18px;border-radius:20px;background:#fff;box-shadow:0 1px 2px rgba(25,24,29,.04)}
.paper h3{font-size:16px;font-weight:700}
.paper .pm{margin-top:4px;font-size:12px;color:var(--c-mute);line-height:1.55}
.paper table{width:100%;margin-top:12px;border-collapse:collapse;font-size:12.5px}
.paper th{padding:7px 4px;border-bottom:1px solid var(--c-line);text-align:left;font-weight:600;color:var(--c-mute)}
.paper td{padding:7px 4px;border-bottom:1px solid var(--c-line2)}
.paper td:last-child,.paper th:last-child{text-align:right}
.paper .red{color:var(--c-urgent);font-weight:700}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--c-line);font-size:14px}
.kv span{color:var(--c-mute)}
.kv b{font-weight:600}
.kv.total{border-bottom:0;padding-top:14px;font-size:15px}
.kv.total b{font-size:22px;font-weight:700;color:var(--c-ink)}

.empty{padding:56px 24px;text-align:center}
.empty b{display:block;font-size:16px;font-weight:700}
.empty p{margin:6px 0 20px;font-size:14px;color:var(--c-mute)}
.foot{padding:26px 0 0;text-align:center;font-size:11.5px;color:var(--c-mute)}

/* 전체 화면 */
.modal{position:absolute;z-index:250;inset:0;padding-top:54px;display:flex;flex-direction:column;background:var(--c-page);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.modal.open{transform:none}
.modal.noanim{transition:none}
.mhead{flex:none;display:flex;align-items:center;gap:4px;height:52px;padding:0 12px}
.mhead .head-ic{background:#fff}
.mhead span{font-size:15px;font-weight:600;color:var(--c-body)}
.mbody{flex:1;overflow-y:auto;padding:0 22px;scrollbar-width:none;display:flex;flex-direction:column}
.modal .dock{background:var(--c-page)}

.clock{flex:1;display:flex;flex-direction:column;align-items:stretch;justify-content:center;text-align:left;padding-bottom:20px}
.clock small{font-size:13px;font-weight:500;color:var(--c-mute)}
.clock h2{margin-top:4px;font-size:28px;font-weight:700;letter-spacing:-.03em}
.clock .sched{margin-top:4px;font-size:15px;color:var(--c-body)}
.big-btn{position:relative;width:100%;height:168px;margin:28px 0 16px;border-radius:30px;background:var(--c-ink);color:#fff;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:4px;padding:22px 24px;font-size:24px;font-weight:700;text-align:left;transition:transform .12s}
.big-btn > svg{position:absolute;top:22px;right:22px;width:40px;height:40px;opacity:.9}
.big-btn:active{transform:scale(.98)}
.big-btn.out{background:var(--c-news)}
.big-btn span{font-size:13.5px;font-weight:500;opacity:.7}
.loc{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:#fff;color:var(--c-news);font-size:12.5px;font-weight:600}
.timer{margin-top:10px;font-size:46px;font-weight:700;letter-spacing:-.03em}

.result{padding-top:12px}
.result .r-ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--c-ink);color:#fff;margin:8px 0 18px}
.result h2{font-size:28px;font-weight:700;line-height:1.3;letter-spacing:-.03em}
.result .amt{margin-top:6px;font-size:15px;color:var(--c-body)}
.result .steps{margin-top:24px}

.payday{flex:1;display:flex;flex-direction:column;padding-top:8px}
.vault{position:relative;width:100%;height:150px;margin:8px 0 0;border-radius:28px;display:grid;place-items:center;background:var(--c-ink);color:#fff;transition:background .4s}
.vault.open{background:var(--c-news)}
.vault .ring{position:absolute;left:24px;right:24px;bottom:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}
.vault .ring::after{content:'';position:absolute;left:0;top:0;bottom:0;width:40%;border-radius:2px;background:var(--c-accent-light);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.vault.open .ring{display:none}
.payday .pk{margin-top:24px;font-size:13px;font-weight:500;color:var(--c-mute)}
.payday .pa{margin-top:4px;font-size:40px;font-weight:700;letter-spacing:-.03em}
.payday .pd{margin-top:2px;font-size:14.5px;color:var(--c-body);min-height:22px}
.payday .steps{margin:22px 0 0}
.pop{animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* 온보딩 */
.ob-top{flex:none;position:relative;height:52px}
.ob-top .head-ic{position:absolute;left:12px;top:6px}
.ob-body{flex:1;overflow-y:auto;padding:0 20px;scrollbar-width:none}
.brand{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:6px 12px 6px 9px;border-radius:999px;background:var(--c-ink);color:#fff;font-size:13px;font-weight:700}
.ob-title{margin:18px 0 10px;font-size:28px;line-height:1.3;font-weight:700;letter-spacing:-.03em}
.ob-lead{margin-bottom:22px;font-size:15px;line-height:1.6;color:var(--c-body)}
.opt{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:8px;padding:16px;border-radius:20px;background:#fff;text-align:left;box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .15s}
.opt.on{box-shadow:inset 0 0 0 2px var(--c-ink)}
.opt .rm b{font-size:15.5px;font-weight:700}
.opt .rm span{margin-top:2px;font-size:13px;color:var(--c-mute);line-height:1.5}
.opt .rm .tags{margin-top:8px}
.ob-foot{flex:none;padding:8px 20px 42px}
.dots{display:flex;justify-content:flex-start;gap:6px;padding:0 2px 16px}
.dots i{width:20px;height:4px;border-radius:2px;background:#d8d5cf;transition:background .2s}
.dots i.on{background:var(--c-ink)}

/* 시트, 확인 팝업, 토스트 */
.sheet-layer{position:absolute;z-index:300;inset:0;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(25,24,29,.45);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:86%;display:flex;flex-direction:column;border-radius:34px;background:var(--c-page);transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet-layer.open{pointer-events:auto}
.sheet-layer.open .scrim{opacity:1}
.sheet-layer.open .sheet{transform:none}
.sheet .handle{flex:none;width:36px;height:4px;margin:10px auto 0;border-radius:2px;background:#d0cdc6}
.sheet-h{flex:none;padding:16px 22px 14px}
.sheet-h h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.sheet-h p{margin-top:4px;font-size:13px;line-height:1.5;color:var(--c-mute)}
.sheet-body{overflow-y:auto;padding:0 16px 8px;scrollbar-width:none}
.sheet .dock{padding:12px 16px 26px}
.sheet textarea{width:100%;height:84px;margin-top:10px;padding:14px;border:0;outline:0;border-radius:18px;background:#fff;font-size:15px;resize:none}
.rk{flex:none;display:flex;color:transparent}
.rk.on{color:var(--c-ink)}

.dialog-layer{position:absolute;z-index:400;inset:0;display:flex;align-items:flex-end;padding:0 10px 14px;background:rgba(25,24,29,.45);opacity:0;pointer-events:none;transition:opacity .16s}
.dialog-layer.open{opacity:1;pointer-events:auto}
.dialog{width:100%;padding:24px 20px 16px;border-radius:30px;background:#fff;text-align:left;transform:translateY(20px);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.dialog-layer.open .dialog{transform:none}
.dialog h2{font-size:19px;line-height:1.4;font-weight:700}
.dialog p{margin:8px 0 20px;font-size:14px;line-height:1.6;color:var(--c-body);white-space:pre-line}
.dialog-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.dialog-actions button{min-height:50px;border-radius:999px;background:var(--c-page);font-size:15px;font-weight:600;color:var(--c-body);text-align:center}
.dialog-actions .primary{background:var(--c-ink);color:#fff}
.dialog-actions .danger{background:var(--c-urgent);color:#fff}

.toast{position:absolute;z-index:450;left:14px;right:14px;top:58px;display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:18px;background:var(--c-ink);color:#fff;font-size:13.5px;line-height:1.45;
  box-shadow:0 10px 26px rgba(0,0,0,.2);transform:translateY(-12px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;background:var(--c-accent-light)}
.toast.show{opacity:1;transform:none;pointer-events:auto}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* =========================================================
   v3: 회색 바탕 + 검정, 흰색만. 장식 줄이고 단순하게.
   ========================================================= */
:root{
  --c-page:#ececec; --c-line:#d4d4d4; --c-line2:#e2e2e2;
  --c-ink:#111111; --c-body:#3a3a3a; --c-mute:#808080;
  --c-accent:#111111; --c-accent-press:#000000; --c-accent-soft:#e6e6e6; --c-accent-light:#ffffff;
  --c-urgent:#111111; --c-urgent-soft:#e6e6e6;
  --c-help:#555555; --c-help-soft:#e6e6e6;
  --c-news:#111111; --c-news-soft:#e6e6e6;
  --c-daily:#555555; --c-daily-soft:#e6e6e6;
  --font:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", 'Noto Sans KR', sans-serif;
}
body{background:#d6d6d6}
.device{background:#111;box-shadow:0 0 0 2px #333}

/* 화면 바로가기: v1처럼 크게, 분류 제목만 보라 */
.panel{width:240px;padding:0;border-radius:0;background:transparent}
.panel h2{font-size:22px;font-weight:800;color:var(--c-ink);margin-bottom:4px;letter-spacing:-.03em}
.panel .sub{font-size:12.5px;color:#666;margin-bottom:8px;line-height:1.5}
.panel h3{font-size:12px;font-weight:700;color:#5b4bdb;margin:16px 0 4px;letter-spacing:0}
.panel button{min-height:34px;padding:7px 12px;border-radius:10px;font-size:14px;font-weight:600;color:#333}
.panel button:hover{background:rgba(0,0,0,.06)}
.panel button.on{background:#111;color:#fff}

/* 머리, 탭 */
.tab-head h1{font-size:22px}
.head-ic{border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px var(--c-line)}
.head-ic b{background:#111;border-color:var(--c-page)}
.head-pill{border-radius:10px}
.head-pill.on{background:#444}
.tabbar{left:0;right:0;bottom:0;height:84px;padding:6px 8px 28px;border-radius:0;background:#fff;border-top:1px solid var(--c-line);box-shadow:none}
.tabbar > button{border-radius:8px;color:#999}
.tabbar > button.on{background:transparent;color:#111}
.view.root .scroll{padding-bottom:110px}

/* 버튼, 칩, 태그 */
.btn{border-radius:10px;background:#111}
.btn:active{background:#000}
.btn.sec,.btn.line{background:#fff;box-shadow:inset 0 0 0 1px var(--c-line)}
.btn[disabled]{background:#d9d9d9;color:#999}
.chip{border-radius:8px}
.chip.on{background:#111}
.chip .cnt{background:#fff;color:#111}
.tag{border-radius:6px;padding:0 7px;background:#e3e3e3;color:#333}
.tag::before{display:none}
.tag.ok{background:#fff;color:#111;box-shadow:inset 0 0 0 1px #bdbdbd}
.tag.warn{background:#e3e3e3;color:#333}
.tag.danger{background:#111;color:#fff}
.tag.acc{background:#e3e3e3;color:#111}

/* 카드, 목록 */
.card,.group,.paper,.steps,.diff div,.opt{border-radius:12px;box-shadow:inset 0 0 0 1px var(--c-line)}
.card.acc{box-shadow:inset 0 0 0 2px #111}
.ri{border-radius:8px;background:#efefef;color:#333}
.ri.acc,.ri.ok,.ri.warn{background:#efefef;color:#111}
.ri.danger{background:#111;color:#fff}
.rr.red,.sum-big.red,.paper .red{color:#111;text-decoration:underline;text-underline-offset:3px}
.dot{background:#111}

/* 홈 상단 카드: 흰 카드로 단순하게 */
.pcard{border-radius:14px;background:#fff;color:#111;box-shadow:inset 0 0 0 1px var(--c-line)}
.pcard::after{display:none}
.pc-ic{background:#efefef;color:#111}
.pc-top small{color:#808080}
.pc-top b{font-size:30px}
.pc-top p{color:#555}
.pc-bot{border-top:1px solid var(--c-line2)}
.pc-line span{color:#808080}
.pc-line .acc{color:#111}
.pc-bot small{color:#808080}
.slot{border-radius:4px;border:1.5px dashed #b5b5b5;color:#fff}
.slot.kept{background:#111}
.slot.pending{background:#9a9a9a}
.slot.missing{background:repeating-linear-gradient(45deg,#111 0 2px,#fff 2px 5px);border:1.5px solid #111}
.slot.today{border:1.5px solid #111;background:#fff}
.slot-legend{color:#808080}
.slot-legend i{border-radius:2px;background:#111}
.slot-legend i.p{background:#9a9a9a}
.slot-legend i.m{background:repeating-linear-gradient(45deg,#111 0 1.5px,#fff 1.5px 3.5px);border:1px solid #111}
.slot-legend i.n{border:1.5px dashed #b5b5b5}

/* 단계 */
.st-c{border-radius:8px;background:#efefef;color:#999}
.step.cur .st-c,.step.done .st-c,.step.ok .st-c,.step.bad .st-c{background:#111;color:#fff}
.step.warn .st-c{background:#d0d0d0;color:#111}
.st-link{color:#111;text-decoration:underline;text-underline-offset:3px}

/* 안내 상자 */
.callout,.callout.ok,.callout.acc{border-radius:12px;background:#e0e0e0}
.callout .i,.callout b,.callout.ok .i,.callout.ok b,.callout.acc .i,.callout.acc b{color:#111}
.callout.danger{background:#111}
.diff .boss{background:#e0e0e0}
.diff .boss b{color:#111}

/* 전체 화면 */
.big-btn{border-radius:16px;background:#111}
.big-btn.out{background:#444}
.loc{background:#fff;color:#111;box-shadow:inset 0 0 0 1px var(--c-line)}
.result .r-ic{border-radius:12px}
.vault{border-radius:16px;background:#111}
.vault.open{background:#444}
.vault .ring::after{background:#fff}
.brand{border-radius:8px}
.opt.on{box-shadow:inset 0 0 0 2px #111}
.dots i.on{background:#111}
.ck{border-radius:6px}
.sheet{border-radius:18px}
.sheet textarea{border-radius:10px}
.dialog{border-radius:16px}
.dialog-actions button{border-radius:10px}
.toast{border-radius:10px;background:#111}
.toast::before{background:#fff}

/* =========================================================
   v4: BRIEF 디자인 값(따뜻한 회색 바탕, 먹색, 보라 포인트)과 상태색을 다시 얹는다.
   v3의 모양(평평한 카드, 검은 버튼, 반경)은 그대로 둔다.
   빨강은 돈이 안 들어온 상황에만, 위치 밖과 확정 대기는 주의색.
   ========================================================= */
:root{
  --c-page:#f4f3f0; --c-line:#e6e4df; --c-line2:#efede9;
  --c-ink:#19181d; --c-body:#47454f; --c-mute:#8a8792;
  --c-accent:#5b4bdb; --c-accent-press:#4a3bc4; --c-accent-soft:#ecE9fd; --c-accent-light:#a89dff;
  --c-urgent:#d6383e; --c-urgent-soft:#fbe8e8;
  --c-help:#c27200; --c-help-soft:#faefdc;
  --c-news:#0f8574; --c-news-soft:#e1f2ef;
  --c-daily:#6f6c78; --c-daily-soft:#ecebe8;
  --font:'IBM Plex Sans KR', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", 'Noto Sans KR', sans-serif;
}
.btn,.big-btn,.chip.on,.panel button.on,.toast,.dialog-actions .primary,.brand{background:var(--c-ink)}
.btn.sec,.btn.line{background:#fff}
.btn[disabled]{background:#e4e2de;color:#a5a2ab}
.btn.danger{background:var(--c-urgent)}
.tag.ok{background:var(--c-news-soft);color:var(--c-news);box-shadow:none}
.tag.warn{background:var(--c-help-soft);color:var(--c-help)}
.tag.danger{background:var(--c-urgent-soft);color:var(--c-urgent)}
.tag.acc{background:var(--c-accent-soft);color:var(--c-accent)}
.ri{background:var(--c-page);color:var(--c-body)}
.ri.acc{background:var(--c-accent-soft);color:var(--c-accent)}
.ri.ok{background:var(--c-news-soft);color:var(--c-news)}
.ri.warn{background:var(--c-help-soft);color:var(--c-help)}
.ri.danger{background:var(--c-urgent-soft);color:var(--c-urgent)}
.rr.red,.sum-big.red,.paper .red{color:var(--c-urgent);text-decoration:none}
.rr.acc{color:var(--c-accent)}
.callout{background:var(--c-help-soft)}
.callout .i,.callout b{color:var(--c-help)}
.callout.ok{background:var(--c-news-soft)}.callout.ok .i,.callout.ok b{color:var(--c-news)}
.callout.acc{background:var(--c-accent-soft)}.callout.acc .i,.callout.acc b{color:var(--c-accent)}
.callout.danger{background:var(--c-urgent)}.callout.danger .i,.callout.danger b{color:#fff}
.diff .boss{background:var(--c-help-soft)}.diff .boss b{color:var(--c-help)}
.step.ok .st-c{background:var(--c-news);color:#fff}
.step.warn .st-c{background:var(--c-help-soft);color:var(--c-help)}
.step.bad .st-c{background:var(--c-urgent);color:#fff}
.st-link{color:var(--c-accent)}
.slot.missing{background:repeating-linear-gradient(45deg,var(--c-urgent) 0 2px,#fff 2px 5px);border-color:var(--c-urgent)}
.slot-legend i.m{background:repeating-linear-gradient(45deg,var(--c-urgent) 0 1.5px,#fff 1.5px 3.5px);border-color:var(--c-urgent)}
.loc.warn{color:var(--c-help);box-shadow:inset 0 0 0 1px var(--c-help-soft);background:var(--c-help-soft)}
.big-btn[disabled]{background:#e4e2de;color:#a5a2ab;cursor:default;transform:none}

/* 3D 일러스트: 바탕 위에만, 한 화면에 하나 */
.iso{display:block;object-fit:contain;-webkit-mask-image:radial-gradient(closest-side,#000 82%,transparent 100%);mask-image:radial-gradient(closest-side,#000 82%,transparent 100%)}
.iso.hero{width:220px;height:220px;margin:4px auto 24px}
.iso.hero.s{width:200px;height:200px;margin:0 auto 20px}
.iso.top{width:104px;height:104px;flex:none;margin:-6px -8px 0 0}
.iso.rowi{width:48px;height:48px;flex:none}
.sum-wrap{display:flex;align-items:flex-start;gap:8px}.sum-wrap .sum{flex:1;min-width:0}
.result h2 + .amt{margin-top:8px}
.empathy{margin-top:6px;font-size:14px;color:var(--c-accent);font-weight:600}
.pbar{position:relative;height:4px;margin:0 32px;border-radius:2px;background:var(--c-line);overflow:hidden}
.pbar::after{content:'';position:absolute;left:0;top:0;bottom:0;width:40%;border-radius:2px;background:var(--c-accent);animation:slide 1.1s ease-in-out infinite}
.sheet-h.withiso{display:flex;align-items:center;gap:12px}
.sheet-h.withiso .iso{border-radius:12px}

/* 패널 아래 기획 주석 */
.panel{display:flex;flex-direction:column}
.panel .pnote{position:sticky;bottom:0;margin-top:14px;padding:12px 12px 14px;border-radius:12px;background:#fff;box-shadow:0 -8px 16px #d6d6d6;font-size:12px;line-height:1.55;color:#333}
.panel .pnote b{display:block;margin-bottom:4px;font-size:12.5px;color:#5b4bdb}
.panel .pnote span{display:block}
.panel .pnote i{font-style:normal;font-weight:700;color:#111}
@media (max-width:900px){.stage{justify-content:flex-start;padding-left:11px}}

/* =========================================================
   v5: 빠진 흐름 화면
   ========================================================= */
.panel button .nw{display:inline-block;margin-left:6px;padding:0 5px;border-radius:5px;background:#ecE9fd;color:#5b4bdb;font-size:10.5px;font-weight:700;line-height:17px;vertical-align:1px}
.panel button.on .nw{background:rgba(255,255,255,.2);color:#fff}
/* 입력 칸 */
.field{position:relative;margin-bottom:8px;padding:12px 16px 14px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--c-line)}
.field.on{box-shadow:inset 0 0 0 2px var(--c-ink)}
.field small{display:block;font-size:12.5px;font-weight:500;color:var(--c-mute)}
.field > b{display:block;margin-top:4px;font-size:18px;font-weight:600;letter-spacing:.01em}
.field .tags{position:absolute;right:14px;top:12px}
.field .ftime{position:absolute;right:16px;top:12px;font-size:13px;font-weight:600;color:var(--c-help)}
.otp{display:flex;gap:8px;margin-top:8px}
.otp i{width:38px;height:44px;border-radius:8px;background:var(--c-page);display:grid;place-items:center;font-style:normal;font-size:20px;font-weight:700}
.acct{margin:-2px 0 10px;padding:0 0 0 14px;border-left:2px solid var(--c-line)}
.acct .field{margin:0}
.acct-st{display:flex;align-items:center;gap:6px;margin-top:8px;padding:0 2px;font-size:13px;font-weight:600;color:var(--c-help)}
.acct-st.ok{color:var(--c-news)}
.acct .pbar{margin:8px 2px 0}
.ob-foot .btnrow{margin-top:0}
.st-link.inl{display:inline;margin:0;padding:0}
/* 일당 풀이 줄 */
.calcbox{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--c-page);text-align:left}
.calcbox .rm b{font-size:14px;font-weight:700}
.calcbox .rm span{margin-top:2px;font-size:12.5px;color:var(--c-body)}
.formula{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--c-page);font-size:13.5px;font-weight:600;line-height:1.55;color:var(--c-ink)}
.paper .kv:first-of-type{padding-top:4px}
/* 한 화면 한 메시지: 가운데 */
.one{padding:20px 8px 8px;text-align:center}
.one h2{font-size:24px;font-weight:700;line-height:1.35;letter-spacing:-.03em}
.one p{margin-top:8px;font-size:14.5px;line-height:1.6;color:var(--c-body)}
.one .tags{justify-content:center;margin-bottom:10px}
/* 비교 상자 */
.diff span{display:block;margin-top:2px;font-size:12px;color:var(--c-mute)}
.diff .acc{box-shadow:inset 0 0 0 2px var(--c-ink)}
.memo{width:100%;height:84px;padding:14px;border:0;outline:0;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--c-line);font-size:14.5px;resize:none}
/* 근무 달력 */
.cal{margin-top:14px;padding:14px 10px 12px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--c-line)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px;text-align:center}
.cal-g .wd{padding-bottom:2px;font-size:11.5px;font-weight:600;color:var(--c-mute)}
.cal-g .d{height:42px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:14px;font-weight:600;color:#b9b6b0;text-align:center}
.cal-g .d small{font-size:9.5px;font-weight:600;line-height:1.1}
.cal-g .d.kept{background:var(--c-ink);color:#fff}
.cal-g .d.edited{background:var(--c-help-soft);color:var(--c-help)}
.cal-g .d.pending{border:1.5px dashed var(--c-help);color:var(--c-help)}
.cal-g .d.missing{background:var(--c-urgent-soft);color:var(--c-urgent)}
.cal-g .d.left{border:1.5px dashed #cfccc6;color:var(--c-body)}
.cal-g .d.today{box-shadow:0 0 0 2px var(--c-accent)}
.cal-leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;padding:0 4px;font-size:11.5px;color:var(--c-mute)}
.cal-leg span{display:flex;align-items:center;gap:5px}
.cal-leg i{width:10px;height:10px;border-radius:3px;background:var(--c-ink)}
.cal-leg i.e{background:var(--c-help-soft);box-shadow:inset 0 0 0 1px var(--c-help)}
.cal-leg i.p{background:none;border:1.5px dashed var(--c-help)}
.cal-leg i.l{background:none;border:1.5px dashed #cfccc6}
/* 불러오는 중 */
.sk{border-radius:12px;background:linear-gradient(90deg,#e8e6e1 25%,#f0eeea 37%,#e8e6e1 63%);background-size:400% 100%;animation:sk 1.4s ease infinite}
@keyframes sk{from{background-position:100% 50%}to{background-position:0 50%}}
.sk + .sk{margin-top:8px}
.sk-h{width:84px;height:18px;margin:28px 2px 12px!important}

.opt.off,.row.off{cursor:default;background:#f7f6f3;box-shadow:inset 0 0 0 1px var(--c-line2)}

.pc-line + .pc-line{margin-top:8px}

.pc-line.total{padding-top:8px;border-top:1px dashed var(--c-line)}

.cal-g .d small{font-size:9px;letter-spacing:-.04em;white-space:nowrap}

function entries() {

    // 이의 결과: 받아들여지면 내 기록대로, 아니면 사장님 기록대로 보관
    if (e.k === 'h1114' && S.disputeResult === 'ok') return { ...e, st:'kept', amt:e.mine };
    if (e.k === 'h1114' && S.disputeResult === 'no') return { ...e, st:'kept', h:e.bossH, outAt:e.bossOut };

function totals() {

  entries().forEach(e => {
    if (e.st === 'kept' || e.st === 'edited' || e.st === 'disputed') kept += e.amt;
    if (e.st === 'pending') pending += e.amt;
    if (e.st === 'missing') { missing += e.amt; if (e.type === 'shift') { mDays++; mShift += e.amt; } else mWeek += e.amt; }
  });
  return { kept, pending, missing, mDays, mShift, mWeek };
}

function entryRow(e) {

}

function row({ icon, tone = '', t, tCls = '', s = '', tags = '', trail = '', trailCls = '', go, act, attrs = '', arrow, lead = '' }) {
  const tap = go || act;
  return `<div class="row ${tap ? 'tap' : ''}" ${go ? `data-go="${go}"` : ''} ${act ? `data-act="${act}"` : ''} ${attrs}>

    ${trail ? `<span class="rr ${trailCls}">${trail}</span>` : ''}
    ${(arrow ?? !!tap) ? chev() : ''}
  </div>`;
}
function step({ icon, state = '', t, s = '', right = '', rightCls = '', extra = '', top = true }) {

}

// 이번 달 근무 칸
function slotsHTML() {
  const p = P(), map = Object.fromEntries(entries().map(e => [e.k, e.st]));
  const cells = p.slots.map(k => {
    if (k === 'today') {
      const st = S.clock === 'done' ? S.todaySt : 'today';
      return `<span class="slot ${st === 'kept' ? 'kept' : st === 'pending' ? 'pending' : 'today'}">${st === 'kept' ? ic('check', 12) : ''}</span>`;
    }
    const st = map[k];
    if (!st) return `<span class="slot"></span>`;
    const cls = st === 'missing' ? 'missing' : st === 'pending' ? 'pending' : 'kept';
    return `<span class="slot ${cls}">${cls === 'kept' && p.slots.length < 12 ? ic('check', 12) : ''}</span>`;
  }).join('');
  const t = totals();
  return `<div class="slots ${p.slots.length > 12 ? 'dense' : ''}">${cells}</div>

}

  cal: {
    title: () => '11월 근무 달력',
    info: true,
    render() {
      const p = P(), es = entries(), byDay = {};
      const dnum = d => +d.replace(/^.*월 /, '').replace('일', '');
      es.filter(e => e.type === 'shift').forEach(e => { byDay[dnum(e.date)] = e; });

      const label = { kept:'보관됨', edited:'고친 기록', disputed:'이의 제기', pending:'확정 대기', missing:'안 들어옴' };
      const cls = { kept:'kept', edited:'edited', disputed:'edited', pending:'pending', missing:'missing' };
      let cells = ['일', '월', '화', '수', '목', '금', '토'].map(w => `<span class="wd">${w}</span>`).join('');
      for (let d = 1; d <= 30; d++) {
        const e = byDay[d];
        if (e) cells += `<button class="d ${cls[e.st]}" data-go="day:${e.k}">${d}<small>${label[e.st]}</small></button>`;
        else if (d === todayN) cells += `<span class="d left today">${d}<small>오늘</small></span>`;
        else if (left.includes(d)) cells += `<span class="d left">${d}<small>예정</small></span>`;
        else cells += `<span class="d">${d}</span>`;
      }
      const sh = es.filter(e => e.type === 'shift');
      const pick = st => sh.filter(e => st.includes(e.st));
      const kept = pick(['kept']), edited = pick(['edited', 'disputed']), pend = pick(['pending']), miss = pick(['missing']);
      const wk = es.filter(e => e.type === 'weekly' && e.st !== 'missing');
      const leftN = left.length + (todayN ? 1 : 0), days = list => list.map(e => dnum(e.date)).sort((a, b) => a - b).join(', ');
      const sum = list => won(list.reduce((a, e) => a + e.amt, 0));
      const parts = [kept.length && `보관됨 ${kept.length}일`, edited.length && `고친 기록 ${edited.length}일`, pend.length && `확정 대기 ${pend.length}일`, miss.length && `안 들어옴 ${miss.length}일`, `남은 근무 ${leftN}일`].filter(Boolean);
      return `<div class="sum"><div class="sum-k">2026년 11월 · ${p.shiftLabel}</div><div class="c-title big">11월에 ${sh.length + leftN}일 일해요</div>
          <div class="sum-s">${parts.join(' · ')}</div></div>
        <div class="cal"><div class="cal-g">${cells}</div>
          <div class="cal-leg"><span><i></i>보관됨</span><span><i class="p"></i>확정 대기</span><span><i class="e"></i>고친 기록</span><span><i class="l"></i>남은 근무</span></div></div>
        <div class="group mt12">
          ${kept.length ? row({ icon:'lock', tone:'ok', t:`보관됨 ${kept.length}일`, s:`11월 ${days(kept)}일`, trail:sum(kept), trailCls:'strong' }) : ''}
          ${edited.length ? row({ icon:'edit', tone:'warn', t:`고친 기록 ${edited.length}일`, s:`11월 ${days(edited)}일 · 사장님이 퇴근 시간을 고쳤어요`, trail:sum(edited), trailCls:'strong', go:`day:${edited[0].k}` }) : ''}
          ${pend.length ? row({ icon:'clock', tone:'warn', t:`확정 대기 ${pend.length}일`, s:`11월 ${days(pend)}일 · 확정되면 바로 보관돼요`, trail:sum(pend), go:`day:${pend[0].k}` }) : ''}
          ${row({ icon:'calendar', t:`남은 근무 ${leftN}일`, s:`11월 ${(todayN ? [todayN] : []).concat(left).join(', ')}일` })}
          ${wk.length ? row({ icon:'coin', tone:'acc', t:`주휴수당 ${wk.length}주`, s:'개근한 주마다 따로 보관돼요', trail:sum(wk), trailCls:'strong', go:'wcalc' }) : ''}
        </div>`;
    },
  },

/* =========================================================
   이동 (탭마다 쌓이는 화면)
   ========================================================= */
const viewport = $('#viewport');
let curEl = null, busy = false;
const stack = () => S.stacks[S.tab];
const topEntry = () => stack()[stack().length - 1];
const parseGo = s => { const [id, k] = s.split(':'); return { id, p:{ k } }; };

function clockPill() {
  const w = S.persona === 'haneul' && S.clock === 'working';
  return `<button class="head-pill ${w ? 'on' : ''}" data-act="clockOpen">${ic(w ? 'exit' : 'login', 17)}${w ? '퇴근하기' : '출퇴근'}</button>`;
}
function bell() { const n = unreadCount(); return `<button class="head-ic" data-go="notices" aria-label="알림">${ic('bell', 22)}${n ? `<b>${n}</b>` : ''}</button>`; }
function buildView(entry, idx) {
  const sc = SCREENS[entry.id], p = entry.p || {}, root = idx === 0;
  const el = document.createElement('section');
  el.className = 'view' + (root ? ' root' : '');
  const dock = !root && sc.dock ? sc.dock(p) : '';
  el.innerHTML = `<div class="vtop"></div>
    ${root
      ? `<header class="tab-head"><div class="tt"><small>${entry.id === 'home' ? `${S.noOut ? '11월 22일 일요일' : '11월 21일 토요일'} · ${P().store}` : P().store}</small><h1>${sc.title(p)}</h1></div><span class="sp"></span>${clockPill()}${bell()}</header>`
      : `<header class="back-head"><button class="head-ic" data-act="back" aria-label="뒤로 가기">${ic('arrowL', 22)}</button><h2>${sc.title(p)}</h2>${sc.action ? sc.action(p) : '<span></span>'}</header>`}
    <div class="scroll">${sc.render(p)}${sc.info ? foot() : ''}</div>
    ${dock ? `<div class="dock">${dock}</div>` : ''}`;
  return el;
}
const scrollOf = el => el.querySelector('.scroll');
function syncNav(el) { const s = scrollOf(el), h = el.querySelector('.tab-head,.back-head'); if (s && h) h.classList.toggle('scrolled', s.scrollTop > 2); }
function saveScroll() { const s = curEl && scrollOf(curEl); if (s) topEntry().scroll = s.scrollTop; }
function restoreScroll(el) { const s = scrollOf(el); if (s) s.scrollTop = topEntry().scroll || 0; syncNav(el); }

function after() { renderTabbar(); updatePanel(); }
function showTab(anim) {
  viewport.innerHTML = '';
  curEl = buildView(topEntry(), stack().length - 1);
  if (anim) curEl.classList.add('fade');
  viewport.append(curEl);
  restoreScroll(curEl);
  after();
}
function push(id, p) {
  if (busy) return;
  saveScroll();
  stack().push({ id, p });
  const el = buildView(topEntry(), stack().length - 1);
  el.classList.add('enter');
  viewport.append(el);
  el.offsetWidth;
  busy = true;
  const old = curEl;
  old.classList.add('under');
  el.classList.remove('enter');
  curEl = el;
  setTimeout(() => { old.remove(); busy = false; }, 300);
  after();
}
function pop() {
  if (busy || stack().length < 2) return;
  stack().pop();
  const el = buildView(topEntry(), stack().length - 1);
  el.classList.add('under');
  viewport.insertBefore(el, curEl);
  restoreScroll(el);
  el.offsetWidth;
  busy = true;
  const old = curEl;
  el.classList.remove('under');
  old.classList.add('enter');
  curEl = el;
  setTimeout(() => { old.remove(); busy = false; }, 300);
  after();
}
function refresh() {
  const s = scrollOf(curEl), y = s ? s.scrollTop : 0;
  const el = buildView(topEntry(), stack().length - 1);
  viewport.replaceChild(el, curEl);
  curEl = el;
  if (scrollOf(el)) scrollOf(el).scrollTop = y;
  syncNav(el);
  after();
}
function switchTab(t) {
  closeSheet();
  if (t === S.tab) { if (stack().length > 1) { S.stacks[t] = [stack()[0]]; showTab(true); } return; }
  saveScroll();
  S.tab = t;
  showTab(true);
}
function jump(tab, ids, persona) {
  if (persona) S.persona = persona;
  closeModal(true); closeSheet(); closeDialog();
  Object.keys(S.stacks).forEach(k => { S.stacks[k] = [S.stacks[k][0]]; });
  S.tab = tab;

const dlg = $('#dialogLayer');
let dlgFn = null;
function dialog({ title, msg, ok, fn, danger, no = '닫기', key = null }) {
  dlgFn = fn; S.dlg = key;
  dlg.innerHTML = `<section class="dialog" role="dialog" aria-modal="true"><h2>${title}</h2>${msg ? `<p>${msg}</p>` : ''}
    <div class="dialog-actions"><button data-act="dlgCancel">${no}</button><button class="${danger ? 'danger' : 'primary'}" data-act="dlgOk">${ok}</button></div></section>`;
  dlg.offsetWidth;
  dlg.classList.add('open');
  updatePanel();
}
function closeDialog() { dlg.classList.remove('open'); if (S.dlg) { S.dlg = null; updatePanel(); } }

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.innerHTML = `<span>${msg}</span>`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a) {
    if (a === dlg && e.target !== dlg) return;
    if (!a.disabled && ACT[a.dataset.act]) ACT[a.dataset.act](a.dataset, a);
    return;
  }
  const g = e.target.closest('[data-go]');
  if (g) { const { id, p } = parseGo(g.dataset.go); closeSheet(); push(id, p); return; }
  const t = e.target.closest('[data-tab]');
  if (t) switchTab(t.dataset.tab);
});
document.addEventListener('scroll', e => { const t = e.target; if (t.classList && t.classList.contains('scroll')) syncNav(t.closest('.view')); }, true);

  const t = topEntry();
  let k = `${S.persona}/${S.tab}/${t.id}`;
  if (t.id === 'contract') k += '/' + (S.contract === 'none' ? (S.contractAsked ? 'none/asked' : 'none') : ['fixed', 'requested', 'agreed'].includes(S.contract) ? S.contract : 'missing');
  if ((t.id === 'day' || t.id === 'dres') && t.p) k += '/' + t.p.k;
  if (t.id === 'day' && t.p && S.disputed.has(t.p.k)) k += '/disputed';
  if (t.id === 'day' && t.p && t.p.k === 'today' && S.lateConfirm) k += S.reAsked ? '/late/asked' : '/late';
  if (t.id === 'home' && S.loading) k += '/loading';
  if (t.id === 'home' && S.loadFail) k += '/loadfail';
  // v7: 누른 뒤에만 열리던 오늘 화면 상태
  if (t.id === 'home' && S.persona === 'haneul' && !S.loading && !S.loadFail) {
    if (S.noOut) k += '/noout';
    else if (S.clock === 'working') k += '/working';
    else if (S.clock === 'done') k += '/done/' + S.todaySt;
  }
  if (t.id === 'noout' && S.noOutSent) k += '/sent';
  if (t.id === 'norest' && S.noRestSent) k += '/sent';
  if (t.id === 'settle' && S.settled) k += '/settled';
  if (t.id === 'missing' && S.resolved) k += '/resolved';
  else if (t.id === 'missing' && S.promised) k += '/promised';
  else if (t.id === 'missing' && S.nudged) k += '/nudged';
  if (t.id === 'work' && S.workFilter === 'need' && !entries().some(e => ['edited', 'pending', 'missing', 'disputed'].includes(e.st))) k += '/empty';
  return k;
}
function renderPanel() {
  let i = 0;
  $('#panel').innerHTML = `<h2>화면 목록</h2><p class="sub">체무팀 근로자 파트 프로토타입 v7<br>이성재 v3 기반<br>A: 주말 편의점 야간 알바<br>B: 평일 점심 식당 알바<br><span style="color:#5b4bdb;font-weight:700">새</span> 표시는 v7에서 더한 항목<br>0~51번은 v6과 같은 번호</p>` + PANEL.map(([g, items]) =>
    `<h3>${g}</h3>${items.map(it => `<button data-act="jump" data-i="${i++}" data-key="${it.key}">${it.l}${it.v7 ? '<span class="nw">새</span>' : ''}</button>`).join('')}`).join('')
    + `<div class="pnote" id="pnote"></div>`;
}
function updatePanel() {
  const k = currentKey();
  let hit = -1;
  document.querySelectorAll('#panel button').forEach(b => { const on = b.dataset.key === k; b.classList.toggle('on', on); if (on) hit = +b.dataset.i; });
  const it = PANEL_ITEMS[hit >= 0 ? hit : S.lastPanel], box = $('#pnote');
  if (!box) return;
  box.innerHTML = it ? `<b>${it.l}</b>${it.note.split(' / ').map(s => { const [h, ...r] = s.split(': '); return `<span><i>${h}</i> ${r.join(': ')}</span>`; }).join('')}` : '<b>기획 주석</b><span>화면을 고르면 이 화면이 답하는 질문과 오가는 길이 여기에 보여요.</span>';
}

/* =========================================================
   폰 크기 맞추기 + 시작
   ========================================================= */
function fit() {
  const s = Math.min(1, (innerHeight - 32) / 876, (innerWidth - 24) / 417);
  document.documentElement.style.setProperty('--s', s);
}
addEventListener('resize', fit);
fit();
renderPanel();
showTab();
openModal('onboarding', obHTML(), true);
</script>
