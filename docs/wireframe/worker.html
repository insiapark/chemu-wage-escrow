<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체무 알바생 앱 v60</title>
<style>
/* =========================================================
   체무 알바생 앱 v15: 제목만 읽어도 상태가 보이게, 3D는 한 메시지 화면의 히어로에만 (v15_고칠목록_worker.md, COMPONENTS_worker.md)
   v14: 움직임은 완료 순간에만 짧게 (떠오름 320ms, 체크 그리기 240ms, 반복 없음, 움직임 줄이기에서 모두 끔)
   v13: 에러, 실패, 빈 상태를 한 틀로 (토스 좋은 에러 메시지 6원칙)
   v10: 접근성 마무리 (누르는 대상 44px, 대상 사이 8px, 대화상자 포커스, 글자 크기 200%, 움직임 줄이기)
   v9: 역할 이름 토큰, 글자 일곱 단계(rem), 명암비
   v8 뼈대(TDS, SEED 구조 대조)는 그대로 두고 값을 토큰으로 바꿈.
   토큰 이름과 값은 사장님 앱 v9(TOKENS.md, tokens.json)와 같고, 알바생 앱에만 있는 것은 TOKENS_worker.md
   색은 속성(fg, bg, stroke) x 역할(neutral, brand, positive, warning, critical, informative, layer) [SEED-Color]
   글자 30, 26, 22, 20, 17, 15, 13px 일곱 단계만, rem으로 [TDS-Type, SEED-Type, HIG-A11y]
   본문 글자 4.5:1, 큰 글자와 UI 부품 3:1 [WCAG22 1.4.3, WCAG-1.4.11]
   ========================================================= */
:root{
  /* 글자와 아이콘 (fg) */
  --fg-neutral:#19181d;                    /* 제목, 강한 글자 (v2 --c-ink) */
  --fg-neutral-secondary:#47454f;          /* 설명 글자 (v2 --c-body) */
  --fg-neutral-muted-on-basement:#66636e;  /* 보조 글자, 화면 바탕과 옅은 색 바탕 위 (v2 --c-mute #8a8792) */
  --fg-neutral-muted:var(--fg-neutral-muted-on-basement);  /* 쓰는 이름. 흰 카드 안에서는 아래 값으로 바뀜 */
  --fg-neutral-muted-on-layer:#6e6b76;     /* 보조 글자, 흰 카드 위 */
  --fg-neutral-ui:#8a8792;                 /* 화살표 같은 UI 아이콘 (3:1 부품) */
  --fg-neutral-inverted:#ffffff;           /* 먹색 위 글자 */
  --fg-neutral-inverted-muted:rgba(255,255,255,.7);
  --fg-neutral-inverted-subtle:rgba(255,255,255,.6);
  --fg-brand:#5b4bdb;                      /* 글자 버튼, 강조 배지 글자 (v2 --c-accent) */
  --fg-brand-on-dark:#a89dff;              /* 먹색 위 강조 (v2 --c-accent-light) */
  --fg-informative:#0a6658;                /* 안내 글자 (v2 --c-news #0f8574) */
  --fg-informative-icon:#0f8574;           /* 안내 아이콘과 점 */
  --fg-warning:#8f5200;                    /* 주의 글자 (v2 --c-help #c27200) */
  --fg-warning-icon:#c27200;               /* 주의 아이콘과 점 */
  --fg-critical:#d6383e;                   /* 위험 글자, 흰 바탕 위 (v2 --c-urgent) */
  --fg-critical-on-weak:#c02a30;           /* 위험 글자, 옅은 빨강 바탕 위 */
  --fg-positive:var(--fg-informative);     /* 보관됨, 확정: 체무는 초록 계열 하나를 안내와 함께 씀 */
  --fg-positive-icon:var(--fg-informative-icon);
  --fg-disabled:var(--fg-neutral-muted-on-basement);
  /* 바탕 (bg) */
  --bg-layer-basement:#f4f3f0;             /* 화면 바탕, 따뜻한 회색 (v2 --c-page) */
  --bg-layer-default:#ffffff;              /* 카드, 목록 묶음 (v2 --c-card) */
  --bg-layer-default-pressed:#fafaf8;
  --bg-layer-floating:#ffffff;             /* 다이얼로그 */
  --bg-neutral-solid:#19181d;              /* 채운 주 버튼, 토스트, 보관된 날 칸 */
  --bg-neutral-solid-pressed:#000000;
  --bg-neutral-inverted:rgba(25,24,29,.94);
  --bg-neutral-weak:#ecebe8;               /* 회색 배지, 비활성 버튼, 단계 표시 바탕 (v2 --c-daily-soft) */
  --bg-neutral-weak-alpha:rgba(25,24,29,.07);         /* 옅은 버튼 */
  --bg-neutral-weak-alpha-pressed:rgba(25,24,29,.12);
  --bg-neutral-strong:#8a8792;             /* 확정 대기 칸 (3:1) */
  --bg-brand-solid:#5b4bdb;                /* 읽지 않음 점 */
  --bg-brand-weak:#ece9fd;                 /* 강조 배지, 강조 안내 상자 (v2 --c-accent-soft) */
  --bg-informative-solid:#0f8574;          /* 보관 단계 표시 */
  --bg-informative-weak:#e1f2ef;           /* (v2 --c-news-soft) */
  --bg-positive-weak:var(--bg-informative-weak);
  --bg-positive-solid:var(--bg-informative-solid);
  --bg-warning-weak:#faefdc;               /* (v2 --c-help-soft) */
  --bg-critical-solid:#d6383e;             /* 안 들어온 돈 안내 상자 */
  --bg-critical-weak:#fbe8e8;              /* (v2 --c-urgent-soft) */
  --bg-overlay:rgba(25,24,29,.45);         /* 시트와 다이얼로그 딤 */
  /* 선 (stroke) */
  --stroke-neutral-weak:#e6e4df;           /* 카드 테두리, 상단 바 아래 선 (v2 --c-line) */
  --stroke-neutral-subtle:#efede9;         /* 목록 행 사이 구분선 (v2 --c-line2) */
  --stroke-neutral-strong:#8a8792;         /* 입력칸, 체크 상자, 칩, 남은 근무 칸 테두리 (3:1) */
  --stroke-neutral-solid:#19181d;          /* 고른 선택 줄, 근무 중 카드 테두리 */
  --stroke-informative:#0f8574;
  --stroke-inverted-subtle:rgba(255,255,255,.12);
  /* 간격 [SEED-Spacing] */
  --space-gutter:24px; --space-gutter-table:20px; --space-component:12px; --space-section:24px; --space-screen-bottom:56px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px;
  /* 모서리 [SEED-Radius] */
  --radius-s:8px; --radius-m:16px; --radius-l:24px; --radius-full:9999px;
  /* 글자 크기: TDS Typography 1~7과 같은 일곱 단계, rem이라 사용자 글자 크기를 따름 [TDS-Type] */
  --type-t1:1.875rem;  /* 30 */
  --type-t2:1.625rem;  /* 26 */
  --type-t3:1.375rem;  /* 22 */
  --type-t4:1.25rem;   /* 20 */
  --type-t5:1.0625rem; /* 17 */
  --type-t6:.9375rem;  /* 15 */
  --type-t7:.8125rem;  /* 13 */
  /* 알바생 앱에만 있는 토큰 (TOKENS_worker.md) */
  --space-safe-bottom:34px;                /* 시안 폰 틀의 아래 안전 영역. 하단 CTA 아래 여백 max(이 값, env, 20px) [TDS-BottomCTA] */
  --space-dock-bottom:max(var(--space-safe-bottom),env(safe-area-inset-bottom,0px),20px);
  --bg-stripe-critical:repeating-linear-gradient(45deg,var(--fg-critical) 0 2px,var(--bg-layer-default) 2px 5px); /* 안 들어온 날 빗금: 색 말고 무늬로도 알림 */
  --font:'IBM Plex Sans KR', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  /* v14: 움직임 토큰 (사장님 앱 v14와 같은 값) */
  --motion-rise:320ms;        /* 3D 그림이 아래에서 8px 떠오름 */
  --motion-draw:240ms;        /* 체크 표시 그리기 */
  --motion-draw-delay:80ms;   /* 떠오름이 조금 진행된 뒤 그리기 시작, 끝은 320ms */
  --motion-toast:200ms;       /* 토스트가 아래에서 올라옴 */
  --motion-sheet:240ms;       /* 바텀시트 */
  --motion-screen:300ms;      /* 화면 전환 (v3 값 유지) */
  --motion-modal:320ms;       /* 전체 화면 열기 (v3 값 유지) */
  --motion-rise-distance:8px;
  --ease-out:cubic-bezier(.2,.8,.2,1);
}
/* 흰 카드 위 보조 글자는 흰 바탕용 값으로 (#6e6b76, 5.21:1) */
.group,.card,.pcard,.paper,.steps,.diff > div,.flow,.cal,.msg,.field,.opt,.dialog,.tabbar{--fg-neutral-muted:var(--fg-neutral-muted-on-layer)}
.result .steps,.payday .steps,.diff .boss,.row.off,.opt.off{--fg-neutral-muted:var(--fg-neutral-muted-on-basement)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:#d6d6d6;color:var(--fg-neutral);overflow:hidden;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
.i *{vector-effect:non-scaling-stroke}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* 무대 (휴대폰 틀은 측정 대상이 아님, px 그대로) */
.stage{height:100vh;display:flex;align-items:center;justify-content:center;gap:48px}
.device{flex:none;width:417px;height:876px;padding:12px;border-radius:67px;background:#111;box-shadow:0 0 0 2px #333;transform:scale(var(--s,1))}
.screen{position:relative;width:393px;height:852px;border-radius:55px;overflow:hidden;background:var(--bg-layer-basement)}
.island{position:absolute;z-index:600;top:11px;left:50%;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000}
.statusbar{position:absolute;z-index:500;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 28px 0 50px;pointer-events:none;font-weight:600;font-size:16px;color:var(--fg-neutral)}
.statusbar .sb-r{display:flex;gap:6px;align-items:center}
.home-ind{position:absolute;z-index:600;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--fg-neutral);pointer-events:none}
@media (max-width:900px){.stage{justify-content:flex-start;padding-left:11px}}

/* 화면 목록 패널 (휴대폰 밖, 발표용이라 px 그대로) */
.panel{width:240px;max-height:86vh;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;padding:0;border-radius:0;background:transparent}
.panel::-webkit-scrollbar{display:none}
.panel h2{font-size:22px;font-weight:800;color:var(--fg-neutral);margin-bottom:4px;letter-spacing:-.03em}
.panel .sub{font-size:12.5px;color:#666;margin-bottom:8px;line-height:1.5}
.panel h3{font-size:12px;font-weight:700;color:#5b4bdb;margin:16px 0 4px;letter-spacing:0}
.panel button{display:block;width:100%;min-height:34px;padding:7px 12px;border-radius:10px;font-size:14px;font-weight:600;color:#333;line-height:1.35}
.panel button:hover{background:rgba(0,0,0,.06)}
.panel button.on{background:var(--bg-neutral-solid);color:#fff}
.panel button .nw{display:inline-block;margin-left:6px;padding:0 5px;border-radius:5px;background:#ece9fd;color:#5b4bdb;font-size:10.5px;font-weight:700;line-height:17px;vertical-align:1px}
.panel button.on .nw{background:rgba(255,255,255,.2);color:#fff}
.panel button .nw.v13{background:#fbe8e8;color:#c02a30}
.panel .pnote{position:sticky;bottom:0;margin-top:14px;padding:12px 12px 14px;border-radius:12px;background:#fff;box-shadow:0 -8px 16px #d6d6d6;font-size:12px;line-height:1.55;color:#333}
.panel .pnote b{display:block;margin-bottom:4px;font-size:12.5px;color:#5b4bdb}
.panel .pnote span{display:block}
.panel .pnote i{font-style:normal;font-weight:700;color:#111}
@media (max-width:900px){.panel{display:none}}

/* 화면 틀 */
#viewport{position:absolute;inset:0;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg-layer-basement);transition:transform var(--motion-screen) var(--ease-out)}
.view.enter{transform:translateX(100%)}
.view.under{transform:translateX(-24%)}
.view.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.vtop{flex:none;height:54px;background:var(--bg-layer-basement)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:0 var(--space-gutter) var(--space-6)}
.scroll.wide{padding-left:var(--space-gutter-table);padding-right:var(--space-gutter-table)}
.scroll::-webkit-scrollbar,.chips::-webkit-scrollbar,.sheet-body::-webkit-scrollbar,.ob-body::-webkit-scrollbar,.mbody::-webkit-scrollbar{display:none}
.view.root .scroll{padding-bottom:calc(86px + 1.5rem)}

/* 상단 바 56px [SEED-TopNav]와 큰 제목 영역 [TDS-Top] */
.tab-head{flex:none;display:flex;align-items:center;gap:var(--space-2);height:56px;padding:0 14px 0 var(--space-gutter);background:var(--bg-layer-basement);transition:box-shadow .2s}
.tab-head .sp{flex:1}
.tab-head .tab-name{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--type-t5);font-weight:700;line-height:1.3;color:var(--fg-neutral)}
/* v21: 탭 첫 화면 위쪽 바는 작은 이름표(오늘, 기록, 급여, 나), 본문 첫 줄이 상태 제목 (사장님 앱과 같은 모양) */
.head-ic{position:relative;flex:none;width:44px;height:44px;border-radius:var(--radius-full);display:grid;place-items:center;color:var(--fg-neutral);background:transparent}
.head-ic:active{background:var(--stroke-neutral-subtle)}
.head-ic svg{width:24px;height:24px}
.head-ic b{position:absolute;top:2px;right:2px;min-width:20px;height:20px;padding:0 5px;border-radius:var(--radius-full);border:2px solid var(--bg-layer-basement);background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted);font-size:var(--type-t7);font-weight:700;line-height:16px;text-align:center}
.head-pill{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 12px;border-radius:var(--radius-m);background:var(--bg-neutral-weak-alpha);color:var(--fg-neutral);font-size:var(--type-t6);font-weight:600}
.head-pill svg{width:20px;height:20px}
.head-pill.on{background:var(--bg-informative-weak);color:var(--fg-neutral)}
.back-head{flex:none;display:flex;align-items:center;gap:var(--space-1);height:56px;padding:0 14px;background:var(--bg-layer-basement);transition:box-shadow .2s}
.back-head h2{flex:1;font-size:var(--type-t5);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back-head .act{font-size:var(--type-t6);font-weight:600;color:var(--fg-brand);padding:0 var(--space-2);height:44px;white-space:nowrap}
.back-head > span{display:none}
.scrolled{box-shadow:0 1px 0 var(--stroke-neutral-weak)}
.top{padding:var(--space-2) 0 var(--space-6)}
.top h1{font-size:var(--type-t2);line-height:1.35;font-weight:700;letter-spacing:-.03em;color:var(--fg-neutral)}
.top p{margin-top:var(--space-1);font-size:var(--type-t5);line-height:1.5;font-weight:500;color:var(--fg-neutral-secondary)}

/* 하단 고정 CTA [TDS-BottomCTA]: 위 12, 좌우 24, 아래 max(안전 영역, 20px), 위쪽 24px 페이드만 그라데이션 */
.dock{position:relative;flex:none;display:flex;flex-wrap:wrap;gap:var(--space-2);padding:var(--space-3) var(--space-gutter) var(--space-dock-bottom);background:var(--bg-layer-basement)}
.dock::before,.ob-foot::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:var(--space-6);background:linear-gradient(rgba(244,243,240,0),var(--bg-layer-basement));pointer-events:none}
.dock .btn.full{flex:0 0 100%}
.dock .hint-t{flex:0 0 100%;display:flex;align-items:center;justify-content:center;gap:6px;margin:0 0 var(--space-2);font-size:var(--type-t7);line-height:1.5;color:var(--fg-neutral-muted)}
/* 시트나 다이얼로그가 열리면 아래 화면은 inert. 덮인 하단 CTA는 가림 [APG-Dialog] */
.screen.layer-open #viewport .dock,.screen.layer-open .modal .dock{visibility:hidden}

/* 하단 탭 네 칸 [AIT-UX] */
.tabbar{position:absolute;z-index:50;left:0;right:0;bottom:0;min-height:84px;display:flex;gap:var(--space-2);padding:6px 8px 28px;background:var(--bg-layer-default);border-top:1px solid var(--stroke-neutral-weak);transition:transform var(--motion-screen) var(--ease-out)}
.tabbar.hide{transform:translateY(160%)}
.tabbar svg{width:24px;height:24px}
.tabbar > button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:var(--radius-s);font-size:var(--type-t7);font-weight:500;line-height:1.2;color:var(--fg-neutral-muted)}
.tabbar > button.on{color:var(--fg-neutral);font-weight:700}
.tabbar .gap,.fab,.store-pill{display:none}

/* 공통 부품 */
.mt8{margin-top:var(--space-2)}.mt12{margin-top:var(--space-component)}.mt16{margin-top:var(--space-4)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin:var(--space-section) 0 var(--space-3);font-size:var(--type-t6);font-weight:700;color:var(--fg-neutral)}
.sec-h button{min-height:44px;padding:0 4px;margin-right:-4px;font-size:var(--type-t7);font-weight:500;color:var(--fg-brand)}
.sec-h:first-child{margin-top:var(--space-2)}

/* 버튼 [TDS-Button, SEED-ActionButton]: 채운 버튼은 화면에 하나, 나머지는 옅은 버튼 */
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:54px;padding:0 var(--space-4);border-radius:var(--radius-m);background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted);font-size:var(--type-t5);font-weight:600;white-space:nowrap;transition:transform .12s,background .12s}
.btn:active{transform:scale(.98);background:var(--bg-neutral-solid-pressed)}
.btn > svg{width:24px;height:24px}
.btn.sec,.btn.line{background:var(--bg-neutral-weak-alpha);color:var(--fg-neutral)}
.btn.sec:active,.btn.line:active{background:var(--bg-neutral-weak-alpha-pressed)}
.btn.danger{background:var(--bg-critical-solid)}
.btn.done{background:var(--bg-informative-weak);color:var(--fg-informative)}
.btn.sm{min-height:44px;font-size:var(--type-t6)}
.dock .btn.full.sec{min-height:54px;font-size:var(--type-t5)}
/* 비활성: 무엇을 기다리는지 읽히게 글자도 4.5:1 */
.btn[disabled]{background:var(--bg-neutral-weak);color:var(--fg-disabled);transform:none;cursor:default}
.btnrow{display:flex;gap:var(--space-2);margin-top:var(--space-4)}

/* 배지 [TDS-Badge]: 옅은 바탕에 글자. 상태는 늘 글자로 [SEED-Inclusive] */
.tags{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.tag{display:inline-flex;align-items:center;min-height:24px;padding:0 var(--space-2);border-radius:var(--radius-full);font-size:var(--type-t7);font-weight:600;white-space:nowrap;background:var(--bg-neutral-weak);color:var(--fg-neutral-secondary)}
.tag.ok{background:var(--bg-positive-weak);color:var(--fg-positive)}
.tag.warn{background:var(--bg-warning-weak);color:var(--fg-warning)}
.tag.danger{background:var(--bg-critical-weak);color:var(--fg-critical-on-weak)}
.tag.acc{background:var(--bg-brand-weak);color:var(--fg-brand)}

/* 알약 칩: 고른 칩은 먹색 바탕과 굵은 글자 */
.chips{display:flex;gap:var(--space-2);overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--space-gutter));padding:0 var(--space-gutter)}
.scroll.wide .chips{margin:0 calc(-1 * var(--space-gutter-table));padding:0 var(--space-gutter-table)}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 var(--space-4);border-radius:var(--radius-full);background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-strong);color:var(--fg-neutral-secondary);font-size:var(--type-t7);font-weight:600;transition:transform .12s}
.chip.on{background:var(--bg-neutral-solid);box-shadow:none;color:var(--fg-neutral-inverted);font-weight:700}
.chip:active{transform:scale(.96)}
.chip .cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:var(--radius-full);background:var(--bg-layer-default);color:var(--fg-neutral);font-size:var(--type-t7)}
.chip:not(.on) .cnt{background:var(--bg-neutral-weak)}

/* 카드 */
.card{display:block;width:100%;padding:var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-weak);text-align:left;position:relative}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--bg-layer-default-pressed)}
.card.acc{box-shadow:inset 0 0 0 2px var(--stroke-neutral-solid)}
.card + .card{margin-top:var(--space-component)}
.c-row{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);margin-top:var(--space-2)}
.c-title{font-size:var(--type-t5);font-weight:700;line-height:1.4}
.tags + .c-title{margin-top:var(--space-2)}
.c-title.big{font-size:var(--type-t3);font-weight:700;line-height:1.36;letter-spacing:-.02em}
.c-body{margin-top:var(--space-1);font-size:var(--type-t6);line-height:1.5;color:var(--fg-neutral-secondary)}
.c-price{flex:none;font-size:var(--type-t5);font-weight:700}

/* 홈 위 카드: 보관된 돈 */
.pcard{display:block;width:100%;padding:var(--space-6) var(--space-4) var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-weak);color:var(--fg-neutral);text-align:left;overflow:hidden;position:relative}
.pc-top{position:relative;display:flex;align-items:flex-start;gap:var(--space-3)}
.pc-ic{flex:none;order:2;width:40px;height:40px;border-radius:var(--radius-m);overflow:hidden;background:var(--bg-layer-basement)}
.pc-ic img{display:block;width:40px;height:40px}
.pc-dday{flex:none;order:2;display:grid;place-items:center;min-height:40px;padding:0 var(--space-3);border-radius:var(--radius-full);background:var(--bg-neutral-weak);color:var(--fg-neutral);font-size:var(--type-t7);font-weight:700}
.pc-top .m{flex:1;min-width:0}
.pc-top small{display:block;font-size:var(--type-t7);font-weight:500;color:var(--fg-neutral-muted)}
.pc-top b{display:block;margin:var(--space-1) 0;font-size:var(--type-t1);font-weight:700;letter-spacing:-.03em}
.pc-top b.pc-name{font-size:var(--type-t3)}
.pc-top p{font-size:var(--type-t7);font-weight:500;color:var(--fg-neutral-secondary)}
.pc-top .pc-link{display:flex;align-items:center;min-height:44px;cursor:pointer}
.pc-bot{position:relative;margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--stroke-neutral-subtle)}
.pc-line{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);font-size:var(--type-t6);font-weight:600}
.pc-line + .pc-line{margin-top:var(--space-2)}
.pc-line span{font-weight:500;color:var(--fg-neutral-muted)}
.pc-line .acc{color:var(--fg-neutral);font-weight:700}
.pc-line .red{color:var(--fg-critical);font-weight:700}
.pc-line.total{padding-top:var(--space-2);border-top:1px dashed var(--stroke-neutral-weak)}
.pc-bot small{display:block;margin-top:var(--space-2);font-size:var(--type-t7);line-height:1.5;color:var(--fg-neutral-muted)}
/* 근무 칸: 보관됨은 먹색과 체크, 확정 대기는 회색과 시계, 안 들어옴은 빗금, 남은 근무는 점선 (색만으로 알리지 않음) */
.slots{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.slot{width:24px;height:24px;border-radius:var(--radius-s);border:1.5px dashed var(--stroke-neutral-strong);display:grid;place-items:center;color:var(--fg-neutral-inverted)}
.slot.kept{border:0;background:var(--bg-neutral-solid)}
.slot.pending{border:0;background:var(--bg-neutral-strong)}
.slot.missing{background:var(--bg-stripe-critical);border:1.5px solid var(--fg-critical)}
.slot.today{border:1.5px solid var(--stroke-neutral-solid);background:var(--bg-layer-default)}
.slots.dense .slot{width:14px;height:14px}
.slot-legend{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-3);margin-top:var(--space-3);font-size:var(--type-t7);color:var(--fg-neutral-muted)}
.slot-legend span{display:flex;align-items:center;gap:5px}
.slot-legend i{width:10px;height:10px;border-radius:var(--radius-full);background:var(--bg-neutral-solid)}
.slot-legend i.p{background:var(--bg-neutral-strong)}
.slot-legend i.m{background:var(--bg-stripe-critical);border:1px solid var(--fg-critical)}
.slot-legend i.n{background:none;border:1.5px dashed var(--stroke-neutral-strong)}

/* 목록 [TDS-ListRow]: 행 위아래 12, 왼쪽 40px 3D 아이콘(v27), 들여쓴 구분선 */
.group{border-radius:var(--radius-m);overflow:hidden;background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-weak)}
.row{position:relative;display:flex;align-items:center;gap:var(--space-3);width:100%;min-height:56px;padding:var(--space-3) var(--space-4);text-align:left}
.row + .row::before{content:'';position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--stroke-neutral-subtle)}
.row + .row:has(> .ri)::before{left:68px}
.row + .row:has(> .ck)::before{left:52px}
.row.tap{cursor:pointer}
.row.tap:active{background:var(--bg-layer-default-pressed)}
/* v27: 행 아이콘은 3D 아이콘 하나, 40px 상한. 모든 행 같은 처리(모서리 16px 정사각 바탕 #F4F3F0 위에 아이콘, 빈 alt), 상태는 오른쪽 글자나 배지로 [GRAPHIC_RULES 4.3, TDS-ListRow 3D 이모지 높이 40] */
.ri{flex:none;width:40px;height:40px;border-radius:var(--radius-m);overflow:hidden;display:block;background:var(--bg-layer-basement)}
.ri img{display:block;width:40px;height:40px;object-fit:contain}
.rm{flex:1;min-width:0;display:flex;flex-direction:column}
.rt{font-size:var(--type-t6);font-weight:600;line-height:1.4}
.rt.mute{color:var(--fg-neutral-muted)}
.rs{margin-top:2px;font-size:var(--type-t7);line-height:1.45;color:var(--fg-neutral-muted)}
.rm .tags{margin-top:var(--space-2)}
.rr{flex:none;font-size:var(--type-t6);color:var(--fg-neutral-muted);text-align:right}
.rr svg{width:24px;height:24px}
.rr.strong{color:var(--fg-neutral);font-weight:700}
.rr.acc{color:var(--fg-brand);font-weight:700}
.rr.red{color:var(--fg-critical);font-weight:700}
.chev{flex:none;display:flex;color:var(--fg-neutral-ui)}
.chev svg{width:24px;height:24px}
.dot{flex:none;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bg-brand-solid)}   /* v27: 인라인 span이라 폭이 0이던 읽지 않음 점을 보이게(행의 상태는 오른쪽) */
.ck{position:relative;flex:none;width:24px;height:24px;border-radius:var(--radius-s);border:2px solid var(--stroke-neutral-strong);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.ck::before{content:'';position:absolute;inset:-9px}
.ck.on{border-color:var(--bg-neutral-solid);background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted)}
.rk{flex:none;display:flex;color:transparent}
.rk svg{width:24px;height:24px}
.rk.on{color:var(--fg-neutral)}
/* 고를 수 없는 줄: 바탕과 글자("법이 정비되면 열려요")로 알림 */
.opt.off,.row.off{cursor:default;background:var(--bg-layer-basement);box-shadow:inset 0 0 0 1px var(--stroke-neutral-subtle)}
.opt.off .rm b,.row.off .rt,.opt.off .rm > span,.row.off .rs{color:var(--fg-disabled)}

/* 단계 목록: 40px 원과 가는 선 */
.steps{display:flex;flex-direction:column;padding:0 var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-weak)}
.result .steps,.payday .steps{background:transparent;padding:0;box-shadow:none}
.step{position:relative;display:flex;align-items:center;gap:var(--space-3);width:100%;padding:var(--space-3) 0;text-align:left}
.step::before{content:'';position:absolute;left:19.5px;top:52px;bottom:-12px;width:1px;background:var(--stroke-neutral-weak)}
.steps > :last-child::before{display:none}
.step.top{align-items:flex-start}
.st-c{position:relative;z-index:1;flex:none;width:40px;height:40px;border-radius:var(--radius-full);display:grid;place-items:center;background:var(--bg-neutral-weak);color:var(--fg-neutral-muted-on-basement);transition:background .3s,color .3s}
.st-c svg{width:24px;height:24px}
.step.cur .st-c,.step.done .st-c{background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted)}
.step.ok .st-c{background:var(--bg-positive-solid);color:var(--fg-neutral-inverted)}
.step.warn .st-c{background:var(--bg-warning-weak);color:var(--fg-warning-icon)}
.step.bad .st-c{background:var(--bg-critical-solid);color:var(--fg-neutral-inverted)}
.st-m{flex:1;min-width:0}
.step.top .st-m{padding-top:var(--space-2)}
.st-t{font-size:var(--type-t6);font-weight:600;line-height:1.4}
.step.next .st-t{color:var(--fg-neutral-muted)}
.st-s{margin-top:2px;font-size:var(--type-t7);line-height:1.5;color:var(--fg-neutral-muted)}
.st-m .tags{margin-top:var(--space-2)}
.st-r{flex:none;font-size:var(--type-t7);font-weight:700;color:var(--fg-brand);padding-top:6px}
.st-r.mute{font-weight:500;color:var(--fg-neutral-muted)}
.st-link{display:inline-flex;align-items:center;gap:2px;min-height:44px;margin-top:0;font-size:var(--type-t7);font-weight:600;color:var(--fg-brand);text-decoration:underline;text-underline-offset:3px}
.st-link.inl{display:inline-flex;min-height:44px;vertical-align:middle;margin:0;padding:0}

/* 화면 첫 묶음 [TDS-Top]: 위 15, 금액 26, 아래 17 */
.sum{padding:0}
.sum-k{font-size:var(--type-t6);font-weight:500;line-height:1.5;color:var(--fg-neutral-muted)}
.sum-big{margin-top:var(--space-1);font-size:var(--type-t2);font-weight:700;line-height:1.3;letter-spacing:-.03em}
.sum-big.acc{color:var(--fg-neutral)}
.sum-big.red{color:var(--fg-critical)}
.sum-s{margin-top:var(--space-2);font-size:var(--type-t5);line-height:1.5;color:var(--fg-neutral-secondary)}
.sum .tags{margin-top:var(--space-3)}
.sum-wrap{display:flex;align-items:flex-start;gap:var(--space-2)}
.sum-wrap .sum{flex:1;min-width:0}
.state-h{margin:var(--space-1) 0 0;font-size:var(--type-t3);font-weight:700;line-height:1.35;letter-spacing:-.03em}
.empathy{margin-top:var(--space-2);font-size:var(--type-t6);font-weight:600;color:var(--fg-brand)}

.diff{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-3)}
.diff div{padding:var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-weak)}
.diff small{display:block;font-size:var(--type-t7);font-weight:500;color:var(--fg-neutral-muted)}
.diff b{display:block;margin-top:var(--space-1);font-size:var(--type-t4);font-weight:700}
.diff span{display:block;margin-top:2px;font-size:var(--type-t7);color:var(--fg-neutral-muted)}
.diff .boss{background:var(--bg-warning-weak)}
.diff .boss b{color:var(--fg-warning)}
.diff .acc{box-shadow:inset 0 0 0 2px var(--stroke-neutral-solid)}

/* 안내 상자: 24px 아이콘과 굵은 제목을 함께 (색만으로 알리지 않음) */
.callout{display:flex;gap:var(--space-3);margin-top:var(--space-component);padding:var(--space-4);border-radius:var(--radius-m);background:var(--bg-warning-weak)}
.callout > .i{flex:none;width:24px;height:24px;margin-top:1px;color:var(--fg-warning-icon)}
.callout b{display:block;font-size:var(--type-t6);font-weight:700;line-height:1.5;color:var(--fg-warning)}
.callout span{font-size:var(--type-t7);line-height:1.55;color:var(--fg-neutral-secondary)}
.callout.danger{background:var(--bg-critical-solid)}
.callout.danger .i,.callout.danger b,.callout.danger span,.callout.danger .chev{color:var(--fg-neutral-inverted)}
.callout.danger .btn.sec{background:var(--bg-layer-default);color:var(--fg-critical)}
.callout.ok{background:var(--bg-informative-weak)}
.callout.ok > .i{color:var(--fg-informative-icon)}
.callout.ok b{color:var(--fg-informative)}
.callout.acc{background:var(--bg-brand-weak)}
.callout.acc > .i,.callout.acc b{color:var(--fg-brand)}
.callout .btnrow{margin-top:var(--space-3)}
.callout .btn.sm{min-height:44px;font-size:var(--type-t6)}
.callout.tap{cursor:pointer}
.callout .chev{align-self:center}
.note{display:flex;gap:var(--space-2);margin-top:var(--space-3);font-size:var(--type-t7);line-height:1.55;color:var(--fg-neutral-muted)}
.note > .i{flex:none;width:24px;height:24px}

.paper{margin-top:var(--space-component);padding:var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-weak)}
.paper h3{font-size:var(--type-t5);font-weight:700}
.paper .pm{margin-top:var(--space-1);font-size:var(--type-t7);color:var(--fg-neutral-muted);line-height:1.55}
.paper table{width:100%;margin-top:var(--space-3);border-collapse:collapse;font-size:var(--type-t7)}
.paper th{padding:var(--space-2) 4px;border-bottom:1px solid var(--stroke-neutral-weak);text-align:left;font-weight:600;color:var(--fg-neutral-muted)}
.paper td{padding:var(--space-2) 4px;border-bottom:1px solid var(--stroke-neutral-subtle)}
.paper td:last-child,.paper th:last-child{text-align:right}
.paper .red{color:var(--fg-critical);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:var(--space-2);padding:var(--space-3) 0;border-bottom:1px dashed var(--stroke-neutral-weak);font-size:var(--type-t6)}
.kv span{color:var(--fg-neutral-muted)}
.kv b{font-weight:600}
.kv.total{border-bottom:0;padding-top:var(--space-4)}
.kv.total b{font-size:var(--type-t3);font-weight:700;color:var(--fg-neutral)}
.paper .kv:first-of-type{padding-top:4px}

.empty{padding:var(--space-6) 0;text-align:center}
.empty b{display:block;font-size:var(--type-t5);font-weight:700}
.empty p{margin:var(--space-2) 0 var(--space-6);font-size:var(--type-t6);color:var(--fg-neutral-muted)}
.empty.full{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.empty.full .btn{flex:none}
.foot{padding:var(--space-6) 0 0;text-align:center;font-size:var(--type-t7);color:var(--fg-neutral-muted)}

/* 전체 화면 (독립 흐름): 상단 바 56px 왼쪽 닫기 [SEED-TopNav] */
.modal{position:absolute;z-index:250;inset:0;padding-top:54px;display:flex;flex-direction:column;background:var(--bg-layer-basement);transform:translateY(100%);transition:transform var(--motion-modal) var(--ease-out)}
.modal.open{transform:none}
.modal.noanim{transition:none}
.mhead{flex:none;display:flex;align-items:center;gap:var(--space-1);height:56px;padding:0 14px}
.mhead span{font-size:var(--type-t5);font-weight:700;color:var(--fg-neutral)}
.mbody{flex:1;overflow-y:auto;padding:0 var(--space-gutter);scrollbar-width:none;display:flex;flex-direction:column}
.modal .dock{background:var(--bg-layer-basement)}

.clock{flex:1;display:flex;flex-direction:column;align-items:stretch;justify-content:center;text-align:left;padding-bottom:var(--space-6)}
.clock small{font-size:var(--type-t6);font-weight:500;color:var(--fg-neutral-muted)}
.clock h2{margin-top:var(--space-1);font-size:var(--type-t2);font-weight:700;line-height:1.3;letter-spacing:-.03em}
.clock .sched{margin-top:var(--space-1);font-size:var(--type-t5);color:var(--fg-neutral-secondary)}
.big-btn{position:relative;width:100%;min-height:168px;margin:var(--space-6) 0 var(--space-4);border-radius:var(--radius-m);background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:4px;padding:var(--space-6);font-size:var(--type-t2);font-weight:700;text-align:left;transition:transform .12s}
.big-btn > svg{position:absolute;top:24px;right:24px;width:40px;height:40px;opacity:.9}
.big-btn:active{transform:scale(.98)}
.big-btn span{font-size:var(--type-t7);font-weight:500;color:var(--fg-neutral-inverted-muted)}
.big-btn[disabled]{background:var(--bg-neutral-weak);color:var(--fg-disabled);cursor:default;transform:none}
.big-btn[disabled] span{color:var(--fg-disabled)}
/* v19: 버튼 위 한 줄(비활성 이유, 누르면 일어날 일). 버튼 안에는 행동 이름만 */
.btn-why{flex:none;width:100%;margin:0 0 var(--space-2);font-size:var(--type-t6);line-height:1.5;color:var(--fg-neutral-secondary);text-align:center}
.clock .btn-why{margin:var(--space-6) 0 0;text-align:left}
.clock .btn-why + .big-btn{margin-top:var(--space-2)!important}
.loc{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 var(--space-3);border-radius:var(--radius-full);background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-weak);color:var(--fg-neutral);font-size:var(--type-t7);font-weight:600}
.timer{margin-top:var(--space-2);font-size:var(--type-t1);font-weight:700;letter-spacing:-.03em}

.result{padding-top:var(--space-3)}
.result .r-ic{width:56px;height:56px;border-radius:var(--radius-m);display:grid;place-items:center;background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted);margin:var(--space-2) 0 var(--space-4)}
.result h2{font-size:var(--type-t2);font-weight:700;line-height:1.3;letter-spacing:-.03em}
.result .amt{margin-top:var(--space-2);font-size:var(--type-t5);line-height:1.5;color:var(--fg-neutral-secondary)}
.result .steps{margin-top:var(--space-6)}

.payday{flex:1;display:flex;flex-direction:column;padding-top:var(--space-2)}
.payday .pk{margin-top:var(--space-6);font-size:var(--type-t6);font-weight:500;color:var(--fg-neutral-muted)}
.payday .pa{margin-top:var(--space-1);font-size:var(--type-t1);font-weight:700;letter-spacing:-.03em}
.payday .pd{margin-top:2px;font-size:var(--type-t5);line-height:1.5;color:var(--fg-neutral-secondary);min-height:22px}
.payday h2.pa{font-size:var(--type-t2);line-height:1.3}
/* v15: 상단 바 제목이 상태를 말하므로 말줄임 없이 두 줄까지 보임 */
.back-head{height:auto;min-height:56px;padding-top:var(--space-1);padding-bottom:var(--space-1)}
.back-head h2{white-space:normal;overflow:visible;line-height:1.4}
.payday .steps{margin:var(--space-6) 0 0}
.pt{margin-top:var(--space-2);font-size:var(--type-t3);font-weight:700;line-height:1.35;letter-spacing:-.03em}


/* 가입 */
.ob-top{flex:none;position:relative;height:56px}
.ob-top .head-ic{position:absolute;left:14px;top:6px}
.ob-body{flex:1;overflow-y:auto;padding:0 var(--space-gutter);scrollbar-width:none}
.ob-title{margin:var(--space-4) 0 var(--space-2);font-size:var(--type-t2);line-height:1.3;font-weight:700;letter-spacing:-.03em}
.ob-lead{margin-bottom:var(--space-6);font-size:var(--type-t5);line-height:1.5;color:var(--fg-neutral-secondary)}
.opt{display:flex;align-items:center;gap:var(--space-3);width:100%;margin-bottom:var(--space-2);padding:var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default);text-align:left;box-shadow:inset 0 0 0 1px var(--stroke-neutral-weak);transition:box-shadow .15s}
.opt.on{box-shadow:inset 0 0 0 2px var(--stroke-neutral-solid)}
.opt .rm b{font-size:var(--type-t6);font-weight:700}
.opt .rm > span{margin-top:2px;font-size:var(--type-t7);color:var(--fg-neutral-muted);line-height:1.5}
.opt .rm .tags{margin-top:var(--space-2)}
.ob-foot{flex:none;position:relative;padding:var(--space-2) var(--space-gutter) var(--space-dock-bottom)}
.ob-foot .btnrow{margin-top:0}
/* 진행 점: 지금 단계는 길고 진하게 (모양과 색) */
.dots{display:flex;justify-content:flex-start;gap:6px;padding:0 0 var(--space-4)}
.dots i{width:12px;height:4px;border-radius:var(--radius-full);background:var(--stroke-neutral-strong);transition:background .2s,width .2s}
.dots i.on{width:24px;background:var(--bg-neutral-solid)}
.field{position:relative;margin-bottom:var(--space-2);padding:var(--space-3) var(--space-4);border-radius:var(--radius-s);background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-strong)}
.field.on{box-shadow:inset 0 0 0 2px var(--stroke-neutral-solid)}
.field small{display:block;font-size:var(--type-t7);font-weight:500;color:var(--fg-neutral-muted)}
.field > b{display:block;margin-top:var(--space-1);font-size:var(--type-t5);font-weight:600;letter-spacing:.01em}
.field .tags{position:absolute;right:14px;top:12px}
.field .ftime{position:absolute;right:16px;top:12px;font-size:var(--type-t7);font-weight:600;color:var(--fg-warning)}
.otp{display:flex;gap:var(--space-2);margin-top:var(--space-2)}
.otp i{width:38px;height:44px;border-radius:var(--radius-s);background:var(--bg-layer-basement);display:grid;place-items:center;font-style:normal;font-size:var(--type-t4);font-weight:700}
.acct{margin:0 0 var(--space-3);padding:0 0 0 14px;border-left:2px solid var(--stroke-neutral-weak)}
.acct .field{margin:0}
.acct-st{display:flex;align-items:center;gap:6px;margin-top:var(--space-2);padding:0 2px;font-size:var(--type-t7);font-weight:600;color:var(--fg-warning)}
.acct-st.ok{color:var(--fg-informative)}
.acct .pbar{margin:var(--space-2) 0 0}

/* 시트 [SEED-BottomSheet, TDS-BottomSheet]: 제목 필수, 최대 90%, 위쪽 24, 좌우 16 */
.sheet-layer{position:absolute;z-index:300;inset:0;pointer-events:none}
.scrim{position:absolute;inset:0;background:var(--bg-overlay);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;display:flex;flex-direction:column;border-radius:var(--radius-l) var(--radius-l) 0 0;background:var(--bg-layer-basement);transform:translateY(110%);transition:transform var(--motion-sheet) var(--ease-out)}
.sheet-layer.open{pointer-events:auto}
.sheet-layer.open .scrim{opacity:1}
.sheet-layer.open .sheet{transform:none}
.sheet .handle{flex:none;width:36px;height:4px;margin:var(--space-2) auto 0;border-radius:var(--radius-full);background:var(--stroke-neutral-strong)}
.sheet-h{flex:none;display:grid;grid-template-columns:1fr auto;column-gap:var(--space-2);padding:var(--space-6) var(--space-4) var(--space-4)}
.sheet-h > h2,.sheet-h > p{grid-column:1}
.sheet-h h2{font-size:var(--type-t4);font-weight:700;line-height:1.4;letter-spacing:-.02em}
.sheet-h p{margin-top:var(--space-1);font-size:var(--type-t6);line-height:1.5;color:var(--fg-neutral-secondary)}
.sheet-x{grid-column:2;grid-row:1 / span 2;align-self:start;width:52px;height:52px;margin:-14px -14px 0 0;border-radius:var(--radius-full);display:grid;place-items:center;color:var(--fg-neutral)}
.sheet-x svg{width:24px;height:24px}
.sheet-x:active{background:var(--bg-neutral-weak-alpha)}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 var(--space-4) var(--space-2);scrollbar-width:none}
.sheet .dock{padding:var(--space-3) var(--space-4) var(--space-dock-bottom)}
.sheet textarea{width:100%;height:84px;margin-top:var(--space-3);padding:var(--space-3) var(--space-4);border:0;outline:0;border-radius:var(--radius-s);background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-strong);font-size:var(--type-t6);resize:none}

/* 다이얼로그 [TDS-Dialog, AIT-UX]: 왼쪽 닫기, 짧으면 가로 같은 너비, 길면 세로 */
.dialog-layer{position:absolute;z-index:400;inset:0;display:flex;align-items:flex-end;padding:0 var(--space-4) var(--space-dock-bottom);background:var(--bg-overlay);opacity:0;pointer-events:none;transition:opacity .16s}
.dialog-layer.open{opacity:1;pointer-events:auto}
.dialog{width:100%;max-height:calc(100% - 64px);overflow-y:auto;padding:var(--space-6);border-radius:var(--radius-l);background:var(--bg-layer-floating);text-align:left;transform:translateY(20px);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.dialog-layer.open .dialog{transform:none}
.dialog h2{font-size:var(--type-t4);line-height:1.4;font-weight:700}
.dialog p{margin:var(--space-2) 0 var(--space-6);font-size:var(--type-t6);line-height:1.6;color:var(--fg-neutral-secondary);white-space:pre-line}
.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.dialog-actions.stack{grid-template-columns:1fr}
.dialog-actions button{min-height:54px;border-radius:var(--radius-m);background:var(--bg-neutral-weak-alpha);font-size:var(--type-t6);font-weight:600;color:var(--fg-neutral);text-align:center}
.dialog-actions .primary{background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted)}
.dialog-actions .danger{background:var(--bg-critical-solid);color:var(--fg-neutral-inverted)}

/* 토스트 [TDS-Toast]: 하단 CTA 위, 3초 */
.toast{position:absolute;z-index:450;left:var(--space-gutter);right:var(--space-gutter);bottom:var(--toast-b,42px);display:flex;align-items:center;gap:10px;padding:var(--space-3) var(--space-4);border-radius:var(--radius-m);background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted);font-size:var(--type-t6);line-height:1.45;
  box-shadow:0 10px 26px rgba(0,0,0,.2);transform:translateY(var(--motion-rise-distance));opacity:0;pointer-events:none;transition:opacity var(--motion-toast) var(--ease-out),transform var(--motion-toast) var(--ease-out)}
.toast::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;background:var(--fg-neutral-inverted)}
.toast.show{opacity:1;transform:none;pointer-events:auto}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* 3D는 화면에 하나, 번짐 마스크 없이 모서리 16 틀 [AIT-UX, TDS-Asset]
   v29: 크기는 세 단계뿐. 히어로 200px(사물 여러 개 장면 iso_*, 제목 위 가운데), 작은 사물 96px(icon3d_lg, data-iso="scene", 제목 위 가운데), 행 아이콘 40px(.ri) [GRAPHIC_RULES 4.1~4.4] */
.iso{display:block;object-fit:contain;border-radius:var(--radius-m)}
.iso.hero,.iso.hero.s{width:200px;height:200px;margin:0 auto var(--space-6)}
/* 탭 첫 화면은 히어로를 위쪽 바 아래, 상태 제목 위에 */
.scroll > .iso.hero,.scroll > .iso.obj{margin-top:var(--space-2)}
.scroll > .iso.hero + .top,.scroll > .iso.obj + .top{padding-top:0}
.top + .state{padding-top:0}
/* v26: 작은 사물(사물 하나, icon3d 웹용) 96px. 금액이 결과인 화면에서 제목 위 가운데 [GRAPHIC_RULES 4.2, TDS-Result] */
.iso.obj{width:96px;height:96px;flex:none;margin:0 auto var(--space-4)}
.result.has-obj > h2,.result.has-obj > .amt,.payday.has-obj .pk,.payday.has-obj .pa,.payday.has-obj .pd,.payday.has-obj .empathy,.sum.center{text-align:center}
.payday.has-obj .pk{margin-top:0}
/* v37: 금액 결과 화면 한 틀(15 퇴근 일당 보관, 33 급여일 자동 입금, 47 안 들어온 돈이 보관됨). 작은 사물, 금액 제목, 보조 줄은 가운데, 그 아래 진행 단계 목록은 왼쪽.
   사장님 앱 10, 28, 45와 같은 틀 [BRIEF v30 판단 14, GRAPHIC_RULES R15] */
.rframe{text-align:center}
/* v38: 사장님이 남긴 이유(사장님 앱 시간 고치기 이유 칸과 같은 말). 비교 카드 아래 [ds_task_2 고칠 것 1] */
.why{margin-top:var(--space-2);padding:var(--space-3) var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-weak)}
.why small{display:block;font-size:var(--type-t7);font-weight:500;color:var(--fg-neutral-muted)}
.why p{margin-top:var(--space-1);font-size:var(--type-t6);line-height:1.5;color:var(--fg-neutral)}
.rframe > .iso.obj{margin-left:auto;margin-right:auto}
.rframe .steps{margin-top:var(--space-6);padding:0;background:transparent;box-shadow:none;text-align:left;--fg-neutral-muted:var(--fg-neutral-muted-on-basement)}
/* v26: 시트나 확인 창이 뜨면 덮인 화면의 그림은 숨김. 한 화면에 핵심 그래픽 하나 [GRAPHIC_RULES R2] */
.iso.hero,.iso.obj{transition:opacity .2s}
.screen.layer-open #viewport .iso.hero,.screen.layer-open #viewport .iso.obj,.screen.layer-open .modal .iso.hero,.screen.layer-open .modal .iso.obj{opacity:0}
/* v31: 바탕 위에 바로 놓인 작은 사물은 그림 바탕 상자 경계가 보이지 않게 밝기를 조금 올리고 darken으로 겹침(사장님 앱과 같은 처리). 행 아이콘은 v27대로 16px 정사각 바탕 [BRIEF v30 판단 8] */
.iso.obj{filter:brightness(1.06);mix-blend-mode:darken}
/* v31: 짧은 화면(화면 높이 700px 이하, 360x640)에서는 히어로 168px, 작은 사물 80px. 480x1200 기준 크기는 그대로 [BRIEF v30 판단 1, GRAPHIC_RULES R3] */
.screen{container-type:size}
@container (max-height:700px){.iso.hero,.iso.hero.s{width:168px;height:168px}.iso.obj{width:80px;height:80px}}
/* v31: 켜고 끄는 알림 줄의 스위치. 줄 전체가 누르는 대상(role=switch)이고 스위치는 모양만 */
/* v46: 행 오른쪽 .rr 안의 span이라 block으로 그려야 보임(0x0이던 것). 크기는 사장님 앱과 같은 46x28, 손잡이 22 [BRIEF v51 판단 5] */
.sw{display:block;position:relative;flex:none;width:46px;height:28px;border-radius:var(--radius-full);background:var(--bg-neutral-strong);transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--bg-layer-default);transition:transform .15s}
.sw.on{background:var(--bg-neutral-solid)}
.sw.on::after{transform:translateX(18px)}
/* v31: 결근으로 남은 날 칸 */
.slot.absent{border:1.5px solid var(--stroke-neutral-strong);background:var(--bg-neutral-weak)}
/* v33: 자주 묻는 질문. 질문은 굵게, 답은 두 문장 안팎 */
.faq-i{padding:var(--space-4)}
.faq-i + .faq-i{border-top:1px solid var(--stroke-neutral-subtle)}
.faq-i h3{font-size:var(--type-t6);font-weight:700;line-height:1.45;color:var(--fg-neutral)}
.faq-i p{margin-top:var(--space-1);font-size:var(--type-t6);line-height:1.6;color:var(--fg-neutral-secondary)}
/* v35: 화면 읽기. 보이는 글은 .say(aria-hidden), 읽는 말은 .sr(눈에는 안 보임). .say는 둘레 글 모양을 그대로 물려받음 */
.screen span.say{display:inline;margin:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit}
.screen span.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0;opacity:0}

/* 진행 막대 */
.pbar{position:relative;height:4px;margin:0 32px;border-radius:var(--radius-full);background:var(--stroke-neutral-weak);overflow:hidden}
/* v14: 진행 막대는 되풀이하지 않고 지금 단계만큼 채워 둠 */
.pbar::after{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--pbar-w,40%);border-radius:var(--radius-full);background:var(--fg-brand)}
.loadmsg{display:flex;flex-direction:column;gap:var(--space-2);margin:0 0 var(--space-4);font-size:var(--type-t6);font-weight:600;color:var(--fg-neutral-secondary)}
.loadmsg .pbar{margin:0}

/* 일당 풀이 줄과 풀이 상자 */
.calcbox{display:flex;align-items:center;gap:var(--space-3);width:100%;margin-top:var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-basement);text-align:left}
.calcbox.on-layer{background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-weak)}
.calcbox .rm b{font-size:var(--type-t6);font-weight:700}
.calcbox .rm span{margin-top:2px;font-size:var(--type-t7);color:var(--fg-neutral-secondary)}
.formula{margin-top:var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--radius-s);background:var(--bg-layer-basement);font-size:var(--type-t7);font-weight:600;line-height:1.55;color:var(--fg-neutral)}
/* 한 화면 한 메시지 */
.one{padding:var(--space-6) 0 var(--space-2);text-align:center}
.one h2{font-size:var(--type-t3);font-weight:700;line-height:1.35;letter-spacing:-.03em}
.one p{margin-top:var(--space-2);font-size:var(--type-t5);line-height:1.5;color:var(--fg-neutral-secondary)}
.one .tags{justify-content:center;margin-bottom:var(--space-3)}
.memo{width:100%;height:84px;padding:var(--space-3) var(--space-4);border:0;outline:0;border-radius:var(--radius-s);background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-strong);font-size:var(--type-t6);resize:none}
.msg{margin-top:var(--space-2);padding:var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-weak);font-size:var(--type-t6);line-height:1.65;color:var(--fg-neutral)}
.msg small{display:block;margin-bottom:6px;font-size:var(--type-t7);font-weight:600;color:var(--fg-neutral-muted)}

/* 근무 달력: 칸마다 상태 글자(13px)를 두 줄까지 */
.cal{margin:var(--space-4) -6px 0;padding:var(--space-4) 4px var(--space-3);border-radius:var(--radius-m);background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-weak)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--space-2);text-align:center}
.cal-g .wd{padding-bottom:2px;font-size:var(--type-t7);font-weight:600;color:var(--fg-neutral-muted)}
.cal-g .d{min-height:44px;padding:4px 0;border-radius:var(--radius-s);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--type-t6);font-weight:600;color:var(--fg-neutral-muted);text-align:center}
.cal-g .d small{font-size:var(--type-t7);font-weight:600;line-height:1.15;letter-spacing:-.04em;word-break:keep-all}
.cal-g .d.kept{background:var(--bg-neutral-solid);color:var(--fg-neutral-inverted)}
.cal-g .d.edited{background:var(--bg-warning-weak);color:var(--fg-warning)}
.cal-g .d.pending{border:1.5px dashed var(--fg-warning-icon);color:var(--fg-warning)}
.cal-g .d.missing{background:var(--bg-critical-weak);color:var(--fg-critical-on-weak)}
.cal-g .d.left{border:1.5px dashed var(--stroke-neutral-strong);color:var(--fg-neutral-secondary)}
.cal-g .d.today{box-shadow:0 0 0 2px var(--fg-brand)}
.cal-leg{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);margin-top:var(--space-3);padding:0 4px;font-size:var(--type-t7);color:var(--fg-neutral-muted)}
.cal-leg span{display:flex;align-items:center;gap:5px}
.cal-leg i{width:10px;height:10px;border-radius:var(--radius-full);background:var(--bg-neutral-solid)}
.cal-leg i.e{background:var(--bg-warning-weak);box-shadow:inset 0 0 0 1px var(--fg-warning-icon)}
.cal-leg i.p{background:none;border:1.5px dashed var(--fg-warning-icon)}
.cal-leg i.l{background:none;border:1.5px dashed var(--stroke-neutral-strong)}

/* 불러오는 중: 스켈레톤만 그라데이션 [SEED-Gradient] */
/* v14: 뼈대는 반짝이지 않음 (무한 반복 없음) */
.sk{border-radius:var(--radius-m);background:var(--bg-neutral-weak)}
.sk + .sk{margin-top:var(--space-2)}
.sk-h{width:84px;height:18px;margin:var(--space-6) 0 var(--space-3)!important}

/* v28: 돈이 움직이는 길 네 칸 장면. 칸마다 그림 하나(칸 폭에 맞춤, 히어로 한 화면 하나 규칙의 예외)와 단계 이름, 한 줄 */
.fpath{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4) var(--space-3);margin-top:var(--space-4)}
.fp-cell{display:flex;flex-direction:column;min-width:0}
.iso.fp{width:100%;height:auto;aspect-ratio:1 / 1;margin:0 0 var(--space-2)}
.fp-t{font-size:var(--type-t6);font-weight:700;line-height:1.4;color:var(--fg-neutral)}
.fp-s{margin-top:2px;font-size:var(--type-t7);line-height:1.5;color:var(--fg-neutral-secondary)}
.fp-krw{display:flex;gap:var(--space-2);margin-top:var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-weak);font-size:var(--type-t7);line-height:1.5;color:var(--fg-neutral-secondary)}
.fp-krw b{flex:none;font-weight:700;color:var(--fg-neutral)}
html[data-fs="200"] .fpath{grid-template-columns:1fr}
html[data-fs] .fp-krw{flex-wrap:wrap}
/* 돈이 움직이는 길 (v7~v27: 그림 없이 행 다섯 개) */
.flow{margin-top:var(--space-4);padding:var(--space-2) var(--space-4);border-radius:var(--radius-m);background:var(--bg-layer-default);box-shadow:inset 0 0 0 1px var(--stroke-neutral-weak)}
.fl-node{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) 0}
.fl-node .rt{font-size:var(--type-t6);font-weight:700}
.fl-edge{display:flex;align-items:center;gap:var(--space-3);min-height:24px}
.fl-ar{flex:none;width:40px;display:flex;justify-content:center;color:var(--fg-neutral-ui)}
.fl-ar svg{width:24px;height:24px}
.fl-l{padding:4px var(--space-2);border-radius:var(--radius-s);background:var(--bg-brand-weak);color:var(--fg-brand);font-size:var(--type-t7);font-weight:600;line-height:1.4}

/* =========================================================
   v10: 접근성 마무리 [HIG-A11y, SEED-Inclusive, WCAG22, APG-Dialog, FF-a11y]
   ========================================================= */
/* 키보드 포커스가 보이게 [FF-a11y, SEED-Inclusive] */
:focus{outline:none}
:focus-visible{outline:2px solid var(--fg-brand);outline-offset:2px}
.row:focus-visible,.callout:focus-visible,.card:focus-visible,.calcbox:focus-visible,.opt:focus-visible,.cal-g .d:focus-visible{outline-offset:-2px}
/* 글자 크기 전환 (휴대폰 밖 패널, px) */

   - 3D 그림이 아래에서 8px 떠오르며 나타남 320ms, 체크 표시 그리기 240ms(80ms 뒤 시작)
   - 금액 숫자는 세지 않음. 무한 반복과 꾸밈 움직임 없음
   - .moment는 그 화면이 완료 상태로 처음 그려질 때 붙였다가 450ms 뒤 떼므로, 다시 그려져도 되풀이되지 않음
   - 움직임 줄이기와 캡처(?i=N)에서는 모두 꺼지고 끝난 모습만 보임 (기본 모습이 곧 끝난 모습)
   ========================================================= */
@keyframes rise{from{opacity:0;transform:translateY(var(--motion-rise-distance))}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.moment .iso.hero,.moment .iso.obj{animation:rise var(--motion-rise) var(--ease-out) both}
.moment .step.mark .st-c .draw,.step.just .st-c .draw{vector-effect:none;stroke-dasharray:1;animation:draw var(--motion-draw) var(--motion-draw-delay) var(--ease-out) both}

/* 캡처할 때(?i=N)는 움직임을 끈다 */
.cap *,.cap *::before,.cap *::after{transition:none!important;animation:none!important}

function row({ icon, tone = '', t, tCls = '', s = '', tags = '', trail = '', trailCls = '', go, act, attrs = '', arrow, lead = '' }) {

  return `<div class="row ${tap ? 'tap' : ''}" ${go ? `data-go="${go}"` : ''} ${act ? `data-act="${act}"` : ''} ${kb} ${attrs}>

function slotsHTML() {
  const p = P(), map = Object.fromEntries(entries().map(e => [e.k, e.st]));
  const cells = p.slots.map(k => {
    if (k === 'today') {
      const st = S.clock === 'done' ? S.todaySt : 'today';
      return `<span class="slot ${st === 'kept' ? 'kept' : st === 'pending' ? 'pending' : 'today'}">${st === 'kept' ? ic('check', 12) : st === 'pending' ? ic('clock', 12) : ''}</span>`;
    }
    const st = map[k];
    if (!st) return `<span class="slot"></span>`;
    const cls = st === 'missing' ? 'missing' : st === 'pending' ? 'pending' : st === 'absent' ? 'absent' : 'kept';
    return `<span class="slot ${cls}">${p.slots.length < 12 ? (cls === 'kept' ? ic('check', 12) : cls === 'pending' ? ic('clock', 12) : '') : ''}</span>`;

  const n = c => (cells.match(new RegExp(`class="slot${c ? ' ' + c : ''}"`, 'g')) || []).length;

  return `<div class="slots ${p.slots.length > 12 ? 'dense' : ''}" role="img" aria-label="${say}">${cells}</div>

}

        ${list.length ? `<div class="group mt16">${list.map(e => entryRow(need.includes(e) ? { ...e, needTag:true } : e)).join('')}</div>` : ''}

  /* ---------- 하루 상세 ---------- */
  day: {

      if (e.type === 'weekly') return e.st === 'missing' ? `이번 주 주휴수당 ${won(e.amt)}이 아직 안 들어왔어요` : `체무가 주휴수당 ${won(e.amt)}을 보관했어요`;

      if (e.st === 'missing') return `${e.date} 일당 ${won(e.amt)}이 아직 안 들어왔어요`;

          ${secH('지금 단계')}<div class="steps">

            ${step({ icon:'bank', state:'next', t:pay, s: miss ? '체무가 보관하면 함께 들어와요' : '오전 9:00에 들어와요' })}

      }
      // v31: 사장님이 결근으로 남긴 날. 일했다면 다르다고 알릴 수 있음(사장님 앱 결근 확인 창 "다르다고 알릴 때만 다시 정할 수 있어요"와 같은 길, BRIEF v30 판단 12)

      const pic = e.st === 'missing' ? ISO('iso_26_missing_day', 'hero s') : late && S.reAsked ? ISO('iso2_49_confirm_resent', 'hero s') : '';

        ${e.st === 'missing' ? `<div class="callout ok">${ic('shield', 18)}<div><b>사장님이 근무를 확정했어요</b><span class="c-money">사장님이 채우면 ${won(e.amt)}도 급여일에 함께 들어와요</span><span>기록은 그대로 남아요.</span></div></div>` : ''}

      const diff = edited ? `<div class="diff"><div><small>내 퇴근 기록</small><b>${e.outAt}</b></div><div class="boss"><small>사장님이 확정한 시간</small><b>${e.bossOut}</b></div></div>${e.why ? `<div class="why"><small>사장님이 남긴 이유</small><p>"${e.why}"</p></div>` : ''}

      const conf = e.st === 'missing'
        ? step({ icon:'check', state:'done', t:'사장님 확정', s:e.conf })
        : e.st === 'pending' ? step({ icon:'clock', state:'warn', t:'사장님 확정 대기', s: late ? '11월 22일 오전 8:00부터 기다리는 중' : '사장님이 확정하면 바로 알려 드려요' })
        : step({ icon: edited ? 'edit' : 'check', state: edited ? 'warn' : 'done', t: edited ? '사장님이 시간을 고쳐서 확정' : '사장님 확정', s:e.conf });
      const keep = e.st === 'missing'
        ? step({ icon:'alert', state:'bad', t:'일당 안 들어옴', s:'사장님이 채우면 체무가 바로 보관해요' })
        : e.st === 'pending' ? step({ icon:'lock', state:'next', t:'일당 보관', s:'채워 둔 돈에서 바로 보관해요' })
        : step({ icon:'lock', state:'ok', t:`${won(e.amt)} 보관됨`, s:e.conf, extra: e.k === 'h1114' ? `<a class="st-link" href="${VERIFY_URL}" target="_blank" rel="noopener">기록 원본 보기 ${ic('chevR', 14)}</a>` : `<button class="st-link" data-act="txView">기록 원본 보기 ${ic('chevR', 14)}</button>` });

     급여일 전날까지 바꾸면 이번 급여일부터, 급여일 당일에 바꾸면 다음 급여일부터 새 받을 곳으로 들어옴.
     입금이 안 된 뒤(E11) 고치면 바로 다시 보냄. 바꾸기 전에 본인 확인을 다시 거침 [BRIEF v31~v34 내용 결정] */
  recv: {

    render(q) {
      const p = P(), fail = q.k === 'fail', today = q.k === 'payday';
      // v37: 새 계좌 주인 이름이 가입한 이름과 다를 때. 에러 틀(무슨 일은 제목, 둘째 줄은 월급이 어디로 가는지, 다시 적기). 민감 정보 입력이라 그림 없음
      if (S.recvStep === 'mismatch') return `${stateBlock({ kind:'fail', tone:'warn', hero:'none', title:'', money: fail ? `${won(984528)}은 그대로 보관돼 있어요` : `월급은 지금 받을 곳 ${p.account}로 그대로 들어와요`, desc:`${p.short}님 이름으로 된 계좌를 다시 적어 주세요.` })}

        <div class="field"><small>계좌번호</small><b class="num">3333-07-4410</b><span class="tags">${tag('warn', '이름 다름')}</span></div>
        <p class="note">${ic('info', 16)}<span>${p.short}님 이름으로 된 계좌만 등록할 수 있어요.</span></p>`;
      if (S.recvStep === 'verify') return `<p class="ob-lead">받을 곳을 ${fail ? '고치기' : '바꾸기'} 전에 한 번 더 확인해요.</p>
        <div class="field"><small>내 휴대폰 번호</small><b class="num">010-1234-5678</b><span class="tags">${tag('ok', '가입한 번호')}</span></div>
        <div class="field on"><small>문자로 받은 인증번호 6자리</small><span class="ftime num">2:48</span>

      if (S.recvStep === 'done') return `${OBJ('ic_bankbook')}<div class="sum"><div class="sum-k">새 받을 곳</div><div class="sum-big">${NEW_ACCT}</div>
          <div class="sum-s">${today ? `다음 급여일부터 이 계좌로 들어와요. 오늘 월급은 ${p.account}로 들어와요.` : `${p.next} 급여일부터 이 계좌로 들어와요.`}</div><div class="tags">${tag('ok', '이름 같음')}</div></div>
        <div class="group mt16">${row({ icon:'ic_bankbook', t:'전에 받던 곳', s:p.account })}</div>
        <p class="note">${ic('shield', 16)}<span>보관된 ${won(totals().kept)}은 그대로 있어요.</span></p>`;
      const when = fail ? `<div class="callout">${ic('alert', 18)}<div><b>받을 곳을 고치면 체무가 바로 다시 보내요</b><span class="c-money">${won(984528)}은 그대로 보관돼 있어요</span></div></div>`

        : `<div class="callout ok">${ic('calendar', 18)}<div><b>급여일 전날까지 바꾸면 ${p.next} 급여일부터 새 받을 곳으로 들어와요</b></div></div>`;
      return `${when}
        <div class="field mt16"><small>지금 받을 곳</small><b>${p.account}</b>${fail ? `<span class="tags">${tag('warn', '은행 정보와 다름')}</span>` : ''}</div>
        ${secH('새 받을 곳')}
        <div class="field"><small>은행</small><b>카카오뱅크</b></div>
        <div class="field on"><small>계좌번호</small><b class="num">3333-12-1029</b><span class="tags">${tag('ok', '이름 같음')}</span></div>

        <p class="note">${ic('info', 16)}<span>${p.short}님 이름으로 된 계좌만 등록할 수 있어요.</span></p>`;
    },
    dock: q => S.recvStep === 'mismatch' ? `<button class="btn" data-act="recvRetry">계좌 다시 적기</button>` : S.recvStep === 'verify' ? `<button class="btn" data-act="recvVerify">${q.k === 'fail' ? '받을 곳 고치기' : '받을 곳 바꾸기'}</button>`
      : S.recvStep === 'done' ? `<button class="btn" data-act="goHome">오늘 화면 보기</button>`
      : `<button class="btn" data-act="recvNext">본인 확인하기</button>`,
  },

  /* ---------- v31: 알림 설정 ----------
     돈이 움직이는 알림(보관, 입금, 입금 안 됨, 안 들어온 돈, 정산)은 끌 수 없고 묶음 아래 이유 한 줄. 사장님이 기록을 고쳤을 때(E04)는 보관 금액이 바뀌는 알림이라 같은 묶음.
     근무 전날 알림, 계약 소식, 소식과 안내는 끌 수 있음. 휴대폰 알림이 꺼져 있으면 맨 위에 한 줄과 [알림 켜기] [BRIEF v31~v34 내용 결정] */
  notiset: {
    // v36: 제목은 지금 상태(사장님 54와 같은 틀). 모두 켜져 있으면 알림을 모두 받고 있어요, 끈 것이 있으면 알림 n개를 꺼 뒀어요 [BRIEF v35 판단 9]
    title: () => { if (S.notiOff) return '휴대폰에서 체무 알림이 꺼져 있어요'; const off = Object.values(S.noti).filter(v => !v).length; return off ? `알림 ${off}개를 꺼 뒀어요` : '알림을 모두 받고 있어요'; },
    render() {
      const sw = (k, icon, t, s) => row({ icon, t, s, act:'notiToggle', attrs:`role="switch" aria-checked="${S.noti[k]}" data-v="${k}"`, arrow:false, trail:`<span class="sw ${S.noti[k] ? 'on' : ''}" aria-hidden="true"></span>` });
      // v46: 휴대폰 알림이 꺼져 있으면 오른쪽은 꺼짐(04 알림 허용과 같은 규칙). 늘 켜짐과 꺼진 휴대폰 알림이 함께 보여 헷갈리지 않게
      const on = (icon, t, s) => row({ icon, t, s, trail: S.notiOff ? '꺼짐' : '늘 켜짐', trailCls: S.notiOff ? '' : 'acc' });
      return `${S.notiOff ? `<div class="callout">${ic('bell', 18)}<div style="flex:1"><b>알림을 켜 두면 일당이 안 들어온 다음 날 오전 9:00에 알려요</b><div class="btnrow"><button class="btn sm" data-act="notiOnSet">${ic('bell', 20)}알림 켜기</button></div></div></div>` : ''}
        ${secH('돈이 움직이는 알림')}
        <div class="group">
          ${NOTI_MONEY.map(([icon, t, s]) => on(icon, t, s)).join('')}
        </div>
        <p class="note">${ic('info', 16)}<span>${S.notiOff ? '내 돈이 움직일 때 바로 알 수 있게 받는 알림이라 끌 수 없어요. 휴대폰 알림을 켜면 여섯 알림이 늘 켜져요.' : '내 돈이 움직일 때 바로 알 수 있게 받는 알림이라 끌 수 없어요.'}</span></p>
        ${secH('끌 수 있는 알림')}
        <div class="group">
          ${sw('eve', 'ic_calendar', '근무 전날 알림', '근무 시간과 가게를 하루 전에 알려요')}
          ${sw('contract', 'ic2_contract', '계약 소식', '사장님이 계약서를 보내거나 고치면 알려요')}
          ${sw('news', 'ic_envelope', '소식과 안내', '체무의 새 기능과 쓰는 법을 알려요')}
        </div>`;
    },
  },

  /* ---------- v32: 탈퇴 전 확인 ----------
     끝나야 할 일이 하나라도 있으면 탈퇴 버튼 대신 이유(제목)와 끝나는 날(둘째 줄), 기록 내보내기를 권함.
     아무 돈도 남지 않았을 때만 [탈퇴하기]. 법적 보존 기간은 확인하지 않은 법 내용이라 쓰지 않음 [BRIEF v31~v34 내용 결정] */
  leave: {
    title: () => { const it = leaveItems()[0]; return it ? it.title : '남은 돈이 없어 탈퇴할 수 있어요'; },
    render() {
      const items = leaveItems(), first = items[0], keep = '기록은 탈퇴 전에 내보내기로 받아 둘 수 있어요.';
      if (!first) return `${stateBlock({ kind:'empty', tone:'info', hero:'none', title:'', desc:keep })}
        ${secH('탈퇴 전에 끝나야 할 일')}
        <div class="group">
          ${row({ icon:'ic_check', t:'보관된 돈', s:'모두 받을 곳으로 들어왔어요' })}
          ${row({ icon:'ic_check', t:'확정 대기 근무', s:'없어요' })}
          ${row({ icon:'ic_check', t:'다르다고 알린 기록', s:'사장님 답까지 끝났어요' })}
          ${row({ icon:'ic_check', t:'안 들어온 돈', s:'없어요' })}
          ${row({ icon:'ic_check', t:'급여일 입금', s:'마지막 월급까지 들어왔어요' })}
        </div>`;
      return `${stateBlock({ kind:'wait', tone:'info', hero:'none', title:'', money:first.money || `받을 돈이 남아 있어 ${P().next} 급여일에 들어온 뒤 탈퇴할 수 있어요`, desc: first.end ? `${first.end} ${keep}` : keep })}
        ${secH('탈퇴 전에 끝나야 할 일')}
        <div class="group">${items.map(it => row({ icon:it.icon, t:it.t, s:it.s, trail:it.trail || '', trailCls: it.red ? 'red' : 'strong', go:it.go, act:it.act, attrs: it.act ? 'role="link"' : '' })).join('')}</div>
        ${first.k === 'kept' ? `${secH('그만두었다면')}<div class="group">${row({ icon:'ic_box', t:'그만두고 정산 받기', s:'그만두면 다음 날 보관된 돈을 받아요', go:'settle' })}</div>` : ''}`;
    },
    // v37: 월급이 안 들어온 경우는 바로 푸는 받을 곳 고치기가 주 버튼(v13 틀 4)
    dock: () => leaveItems().length ? (leaveItems()[0].k === 'payfail' ? `<button class="btn sec" data-go="export">기록 내보내기</button><button class="btn" data-act="recvFromFail">받을 곳 고치기</button>` : `<button class="btn" data-go="export">기록 내보내기</button>`)
      : `<button class="btn sec" data-go="export">기록 내보내기</button><button class="btn" data-act="leaveAsk">탈퇴하기</button>`,
  },

    info: true,

        ['사장님이 확정을 늦게 하면 어떻게 하나요?', '확정을 기다린 지 하루가 지나면 확정 요청을 다시 보낼 수 있어요. 일한 기록은 그대로 남아 있어요.'],
        ['내 기록과 사장님 기록이 다르면요?', '내 기록이 맞다면 다르다고 알리기로 사장님에게 알릴 수 있어요. 사장님이 답할 때까지 체무가 차이 나는 돈을 따로 남겨 둬요.'],
        ['급여일에 월급이 안 들어오면요?', '월급은 그대로 보관돼 있어요. 받을 곳 정보가 달라 못 보냈다면 받을 곳을 고칠 때 체무가 바로 다시 보내요.'],
        ['그만두면 돈은 언제 받나요?', '그만둔다고 알리면 다음 날 오전 9:00에 보관된 돈이 들어와요. 급여일을 기다리지 않아도 돼요.'],

        </div>`;

            ${step({ icon:'lock', state:'ok', t:`차이 나는 ${won(gap)} 보관됨`, s:'체무가 따로 남겨 둔 돈을 일당에 더했어요' })}

      return `${stateBlock({ kind:'result', tone:'warn', hero:ISO('iso_25_next_step', 'hero s'), title:'',

        <div class="why" style="margin:0 0 var(--space-2)"><small>사장님이 남긴 이유</small><p>"${e.why}"</p></div>
        ${secH('다음에 할 수 있는 일')}
        <div class="group">
          ${row({ icon:'ic2_scale', t:'고용노동부 상담 1350', s:'물어보기만 해도 돼요 · 평일 오전 9:00 ~ 오후 6:00', act:'call', attrs:'data-v="1350"', arrow:true })}
        </div>
        <p class="note">${ic('shield', 16)}<span>내가 보낸 기록과 사장님 답은 그대로 남아요.</span></p>`;

      const left = CAL_LEFT[S.persona], todayN = S.persona === 'haneul' && S.clock !== 'done' ? 21 : 0;
      const label = { kept:'보관됨', edited:'고친 기록', disputed:'다르다고 알림', pending:'확정 대기', missing:'안 들어옴', absent:'결근' };
      const cls = { kept:'kept', edited:'edited', disputed:'edited', pending:'pending', missing:'missing', absent:'edited' };
      let cells = ['일', '월', '화', '수', '목', '금', '토'].map(w => `<span class="wd">${w}</span>`).join('');
      for (let d = 1; d <= 30; d++) {
        const e = byDay[d];
        if (e) cells += `<button class="d ${cls[e.st]}" data-go="day:${e.k}" aria-label="11월 ${d}일, ${label[e.st]}">${d}<small>${label[e.st]}</small></button>`;   // v35: 날짜 칸 읽기 이름
        else if (d === todayN) cells += `<span class="d left today">${d}<small>오늘</small></span>`;

        else cells += `<span class="d">${d}</span>`;

      const kept = pick(['kept']), edited = pick(['edited', 'disputed']), pend = pick(['pending']), miss = pick(['missing']);

/* =========================================================
   이동 (탭마다 쌓이는 화면)
   ========================================================= */
const viewport = $('#viewport');
// v10: 움직임 줄이기를 켠 기기에서는 화면 전환 대기 시간도 없앰 [HIG-A11y]
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
// v14: 완료 순간에만 .moment를 붙였다가 450ms 뒤 뗌(떠오름 320ms, 체크 그리기 80ms 뒤 240ms가 끝난 뒤). 움직임 줄이기에서는 붙이지 않음 [MOTION_worker.md]
const VIEW_MOMENTS = { dres: p => p.k === 'ok', missing: () => S.resolved, settle: () => S.settled };
S.momentDone = new Set();
function playMoment(el) {
  if (REDUCED || !el) return;
  el.classList.add('moment');
  clearTimeout(el._mt);
  el._mt = setTimeout(() => el.classList.remove('moment'), 450);
}
let curEl = null, busy = false;
const stack = () => S.stacks[S.tab];
const topEntry = () => stack()[stack().length - 1];
const parseGo = s => { const [id, k] = s.split(':'); return { id, p:{ k } }; };

function clockPill() {
  const w = S.persona === 'haneul' && S.clock === 'working';
  return `<button class="head-pill ${w ? 'on' : ''}" data-act="clockOpen"${w ? ' aria-label="출퇴근, 근무 중"' : ''}>${ic(w ? 'exit' : 'login', 17)}출퇴근</button>`;   // v35: 근무 중 상태를 읽기 이름으로
}
function bell() { const n = unreadCount(); return `<button class="head-ic" data-go="notices" aria-label="알림${n ? `, 읽지 않은 알림 ${n}개` : ''}">${ic('bell', 24)}${n ? `<b aria-hidden="true">${n}</b>` : ''}</button>`; }
const TAB_NAME = { home:'오늘', work:'기록', pay:'급여', me:'나' };   // v21: 위쪽 바 이름표
function buildView(entry, idx) {
  const sc = SCREENS[entry.id], p = entry.p || {}, root = idx === 0;
  const el = document.createElement('section');
  el.className = 'view' + (root ? ' root' : '');
  // v14: 완료 화면이 처음 그려질 때만 움직임 (이의 받아들여짐, 안 들어온 돈이 보관됨, 정산 요청 뒤)
  const mk = VIEW_MOMENTS[entry.id] && VIEW_MOMENTS[entry.id](p) ? `${S.persona}/${entry.id}` : null;
  if (mk && !S.momentDone.has(mk)) { S.momentDone.add(mk); playMoment(el); }
  const dock = !root && sc.dock ? sc.dock(p) : '';
  el.innerHTML = `<div class="vtop"></div>
    ${root
      ? `<header class="tab-head"><p class="tab-name">${TAB_NAME[entry.id] || ''}</p>${clockPill()}${bell()}</header>`
      : `<header class="back-head"><button class="head-ic" data-act="back" aria-label="뒤로 가기">${ic('arrowL', 24)}</button><h2>${sc.title(p)}</h2>${sc.action ? sc.action(p) : '<span></span>'}</header>`}
    <div class="scroll${sc.wide ? ' wide' : ''}">${root ? `${sc.hero ? sc.hero(p) : ''}<div class="top"><h1>${sc.title(p)}</h1><p>${entry.id === 'home' ? `${S.noOut ? '11월 22일 일요일' : '11월 21일 토요일'} · ${P().store}` : entry.id === 'me' ? `${P().boss} · 급여일 ${P().payday}` : P().store}</p></div>` : ''}${sc.render(p)}${sc.info ? foot() : ''}</div>
    ${dock ? `<div class="dock">${dock}</div>` : ''}`;
  return el;
}
const scrollOf = el => el.querySelector('.scroll');
function syncNav(el) { const s = scrollOf(el), h = el.querySelector('.tab-head,.back-head'); if (s && h) h.classList.toggle('scrolled', s.scrollTop > 2); }
function saveScroll() { const s = curEl && scrollOf(curEl); if (s) topEntry().scroll = s.scrollTop; }
function restoreScroll(el) { const s = scrollOf(el); if (s) s.scrollTop = topEntry().scroll || 0; syncNav(el); }

function after() { renderTabbar(); updatePanel(); }
function showTab(anim) {
  viewport.innerHTML = '';
  curEl = buildView(topEntry(), stack().length - 1);
  if (anim) curEl.classList.add('fade');
  viewport.append(curEl);
  restoreScroll(curEl);
  after();
}
function push(id, p) {
  if (busy) return;
  saveScroll();
  stack().push({ id, p });
  const el = buildView(topEntry(), stack().length - 1);
  el.classList.add('enter');
  viewport.append(el);
  el.offsetWidth;
  busy = true;
  const old = curEl;
  old.classList.add('under');
  el.classList.remove('enter');
  curEl = el;
  setTimeout(() => { old.remove(); busy = false; }, REDUCED ? 0 : 300);
  after();
}
function pop() {
  if (busy || stack().length < 2) return;
  stack().pop();
  const el = buildView(topEntry(), stack().length - 1);
  el.classList.add('under');
  viewport.insertBefore(el, curEl);
  restoreScroll(el);
  el.offsetWidth;
  busy = true;
  const old = curEl;
  el.classList.remove('under');
  old.classList.add('enter');
  curEl = el;
  setTimeout(() => { old.remove(); busy = false; }, REDUCED ? 0 : 300);
  after();
}
// v10: 다시 그려도 키보드 포커스가 같은 단추에 남게
const focusKey = a => { if (!a || !a.dataset) return null; for (const k of ['act', 'go', 'tab']) if (a.dataset[k]) return `[data-${k}="${CSS.escape(a.dataset[k])}"]${a.dataset.v ? `[data-v="${CSS.escape(a.dataset.v)}"]` : ''}`; return null; };
function refocus(root, key) { if (!key) return; const g = root.querySelector(key); if (g) g.focus({ preventScroll:true }); }
function refresh() {
  const s = scrollOf(curEl), y = s ? s.scrollTop : 0;
  const key = curEl.contains(document.activeElement) ? focusKey(document.activeElement) : null;
  const el = buildView(topEntry(), stack().length - 1);
  viewport.replaceChild(el, curEl);
  curEl = el;
  if (scrollOf(el)) scrollOf(el).scrollTop = y;
  syncNav(el);
  after();
  if (!topLayer()) refocus(el, key);
}
function switchTab(t) {
  closeSheet();
  if (t === S.tab) { if (stack().length > 1) { S.stacks[t] = [stack()[0]]; showTab(true); } return; }
  saveScroll();
  S.tab = t;
  showTab(true);
}
function jump(tab, ids, persona) {
  if (persona) S.persona = persona;
  closeModal(true); closeSheet(); closeDialog();
  Object.keys(S.stacks).forEach(k => { S.stacks[k] = [S.stacks[k][0]]; });
  S.tab = tab;
  S.stacks[tab] = ids.map(parseGo);
  showTab(true);
}
function renderTabbar() {
  const t = (k, l, i) => `<button class="${S.tab === k ? 'on' : ''}" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${ic(i, 24)}<span>${l}</span></button>`;

  bar.innerHTML = t('home', '오늘', 'home') + t('work', '기록', 'calendar') + t('pay', '급여', 'wallet') + t('me', '나', 'user');
  bar.classList.toggle('hide', stack().length > 1);
}

const LOCKED_SHEETS = new Set(['dispute', 'disputeFail', 'nudge', 'settle', 'receive']);
function openSheet(key, html) {

// v8: 시트나 다이얼로그가 열리면 아래 화면을 inert로 막음 [APG-Dialog]
// v10: 닫힌 층(전체 화면, 시트, 다이얼로그)도 inert로 두어 Tab이 보이지 않는 곳으로 가지 않게 함
function syncLayer() {
  const mo = !!S.modal, sh = !!S.sheet, dl = document.querySelector('#dialogLayer').classList.contains('open');
  document.querySelector('.screen').classList.toggle('layer-open', sh || dl);
  const set = (q, on) => { const el = document.querySelector(q); if (on) el.setAttribute('inert', ''); else el.removeAttribute('inert'); };
  set('#viewport', mo || sh || dl); set('#tabbar', mo || sh || dl);
  set('#modal', !mo || sh || dl); document.querySelector('#modal').setAttribute('aria-hidden', String(!mo));
  set('#sheetLayer', !sh || dl); set('#dialogLayer', !dl);

// v10: 대화상자를 열면 안으로 포커스를 옮기고, 닫으면 연 단추로 돌려준다 [APG-Dialog, Radix-Dialog]
const FOCUSABLE = 'button:not([disabled]),[href],input,textarea,select,[tabindex]:not([tabindex="-1"])';
const focusStack = [];
function layerOpened(layer, first) {
  const opener = document.activeElement && document.activeElement !== document.body ? document.activeElement : null;
  focusStack.push(opener);
  if (!opener) return;   // 화면 목록에서 바로 연 경우는 포커스를 옮기지 않음 (Tab을 누르면 가둠이 첫 요소로 보냄)
  const f = first || layer.querySelector(FOCUSABLE);
  (f || layer).focus({ preventScroll:true });
}
function layerClosed() {
  const el = focusStack.pop();
  if (!el) return;
  if (document.contains(el) && !el.closest('[inert]')) { el.focus({ preventScroll:true }); return; }
  const L = topLayer() || curEl;
  const f = L && L.querySelector(FOCUSABLE);
  if (f) f.focus({ preventScroll:true });
}
function topLayer() {
  if (document.querySelector('#dialogLayer').classList.contains('open')) return document.querySelector('#dialogLayer .dialog');
  if (S.sheet) return sheet;
  if (S.modal) return modal;
  return null;
}

function toast(msg) {

  const sc = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s')) || 1;
  const scr = document.querySelector('.screen').getBoundingClientRect(), bar = $('#tabbar');
  const cta = [S.sheet && sheet.querySelector('.dock'), S.modal && modal.querySelector('.dock,.ob-foot'),
    !S.modal && curEl && curEl.querySelector('.dock'), !S.modal && !bar.classList.contains('hide') && bar].filter(Boolean)[0];
  const edge = cta ? (scr.bottom - cta.getBoundingClientRect().top) / sc : 34;
  t.style.setProperty('--toast-b', Math.round(edge + 8) + 'px');
  t.classList.add('show');
  clearTimeout(toastTimer);

}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a) {
    if (a === dlg && e.target !== dlg) return;
    if (!a.disabled && ACT[a.dataset.act]) ACT[a.dataset.act](a.dataset, a);
    return;
  }
  const g = e.target.closest('[data-go]');
  if (g) { const { id, p } = parseGo(g.dataset.go); closeSheet(); push(id, p); return; }
  const t = e.target.closest('[data-tab]');
  if (t) switchTab(t.dataset.tab);
});
// v10: 키보드. 대화상자 안에서 Tab 순환, Esc로 닫기, role 줄은 Enter(link)와 Enter, Space(button, radio, checkbox) [APG-Dialog, FF-a11y]
document.addEventListener('keydown', e => {
  const L = topLayer();
  if (e.key === 'Escape' && L) {
    e.preventDefault();
    if (L === sheet) closeSheet(); else if (L === modal) { if (S.modal !== 'onboarding') ACT.modalClose(); } else closeDialog();
    return;
  }
  if (e.key === 'Tab' && L) {
    const f = [...L.querySelectorAll(FOCUSABLE)].filter(x => x.getClientRects().length);
    if (!f.length) { e.preventDefault(); return; }
    const first = f[0], last = f[f.length - 1], a = document.activeElement;
    if (!L.contains(a)) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
    else if (e.shiftKey && a === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if (e.target.matches && e.target.tagName !== 'BUTTON' && ((e.key === 'Enter' && e.target.matches('[role=link]')) || ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button],[role=radio],[role=checkbox],[role=switch]')))) {
    e.preventDefault(); e.target.click();
  }
});
document.addEventListener('scroll', e => { const t = e.target; if (t.classList && t.classList.contains('scroll')) syncNav(t.closest('.view')); }, true);

      note:'질문: 알림이 꺼져 있으면 안 들어온 돈을 어떻게 알게 되나 / 들어옴: 받을 곳 등록 다음 단계(휴대폰 알림 권한이 꺼져 있을 때) / 나감: 알림 켜기, 다음에 뒤 계약 확인 / 사장님 앱: B님에게 간 알림 확인 / v6: 알림 항목을 버튼에서 설정 행(이름, 설명 한 줄, 오른쪽 켜짐 또는 꺼짐)으로 바꿈. 안 들어온 날 알림은 오전 9시에 한 번뿐이라고 밝히고, 끌 수 없는 이유는 아래 한 줄로 / v8: 보조 버튼 "다음에"를 옅은 버튼 "알림 없이 계약 보기"로 바꿈. 행 아이콘 40px 원, 상단 바 56px / v9: 알림 줄 보조 글자 13px #6e6b76, "끌 수 없음" 배지 13px, 켜짐과 꺼짐은 글자로 표시 / v10: 가입 화면 role dialog와 제목 연결. 닫기 단추가 없는 흐름이라 Esc로 닫지 않음 / v16: 부정 두 번 문장을 켜 두면 알려요로, 이의 제기를 사장님에게 알릴 수 있어요로 / v18: 제목을 휴대폰에서 체무 알림이 꺼져 있어요로, 같은 말 안내 상자는 뺌 / v19: 물러나는 버튼을 다음에로 / v20: 알림 설명을 사장님이 확정하고 체무가 일당을 보관하면으로 / v22: 떼일 돈, 끌 수 없어요를 늘 켜 두는 이유로(빨리 챙길 수 있어요), 배지 끌 수 없음을 늘 켜 두는 알림으로 / v24: 금액, 날짜, 시각 표기를 92,880원, 11월 14일 토요일, 오전 9:00 꼴로(화면 읽기도 같은 값) / v26: 히어로 iso_17 알림 켬을 제목 위에 / v27: 행 아이콘을 3D 아이콘 40px로(ic_safe, ic_bell, ic_magnifier), 모든 행 모서리 16px 바탕에 같은 처리, 상태는 오른쪽 글자나 배지로 / v31: 히어로 iso_17(켠 종) 대신 작은 사물 ic_bell 96px. 꺼짐을 말하는 화면에 켠 모습 그림을 쓰지 않음(BRIEF v30 판단 3) / v34: 다음에를 누르면 계약 확인 뒤 오늘 탭이 처음 연 날(100) / v35: 진행 점에 읽기 이름(4단계 가운데 4단계) / v36: 알림 묶음과 줄 이름을 알림 설정(88)과 같게(돈이 움직이는 알림 여섯 줄, 사장님이 기록을 고치거나 정할 때). 휴대폰 알림이 꺼져 있어 오른쪽은 꺼짐 / v46: 라이터 검토: 알림을 켜 두면 일당이 안 들어온 다음 날 오전 9:00에 알려요(E08 시각). 일당이 안 들어왔을 때 줄을 다음 날부터 날마다 오전 9:00에 한 번 알려요로(41 알림 단계와 같은 사실) [고칠 것 2] / v47: 모의 사용: 끌 수 없는 이유를 먼저(메모 예문의 놓치지는 UX-05a 금지어라 바로 알 수 있게로, 내 돈이 움직일 때 바로 알 수 있게 받는 알림이라 끌 수 없어요. 휴대폰 알림을 켜면 여섯 알림이 늘 켜져요) [ds_review_memo v47 고칠 것 1]' },

      note:'질문: 가입했는데 왜 아직 일당 보관이 시작되지 않나 / 들어옴: 가입 마지막 단계, 나 탭 근로계약서 / 나감: 사장님께 계약서 요청하기, 계약서가 오면 계약 확인 / 사장님 앱: 알바생 초대 상태, 근로계약 올리기 / v6: 제목을 "아직 계약서가 안 왔어요"로, 본문을 "계약에 동의한 날부터 일당이 보관돼요. 그 전 근무는 기록으로 남아요"로 분명히 / v8: 가운데 제목 22px과 설명 17px, 3D 번짐 마스크를 빼고 모서리 16 틀에, 좌우 여백 24 / v9: 가운데 제목 22, 설명 17, 대기 버튼 글자를 #a5a2ab(1.94:1)에서 #66636e(4.93:1)로 / v10: 누르는 줄과 안내 상자에 tabindex와 role, 키보드 포커스에 2px 보라 테두리 / v13: 빈 상태 틀. 왜 비어 있는지 한 줄(계약에 동의한 날부터 보관)과 다음 할 일 하나(사장님께 계약서 요청하기). 한 메시지 화면이라 3D 하나, 안내라 초록 / v16: 사장님에게 계약서 요청하기 / v18: 제목을 계약서를 기다리고 있어요로 하나만, 본문 첫 줄 계약을 확정한 날부터 일당이 보관돼요 / v21: 본문 3문장을 2문장으로(계약서가 오면 알린다는 문장은 요청한 뒤 화면에만) / v29: 히어로 220px을 200px로(히어로 크기 하나) / v46: 라이터 검토: 계약을 확정하면 사장님이 근무를 확정할 때마다 체무가 그날 일당을 보관해요(근무 확정 때 보관하는 다른 화면과 맞춤) [고칠 것 3] / v58: 히어로 iso_02를 2판 iso2_54(기다림, 빈 인장 자리와 모래시계)로. 체크된 계약서가 끝난 계약처럼 읽히던 것' },

    { l:'급여일 자동 입금 (12월 10일, 결정 뒤)',  key:'m:payday', run:() => { jump('home', ['home'], H); startPayday(); },
      note:'질문: 아무도 누르지 않아도 월급이 들어왔나 / 들어옴: 급여일 오전 9시 알림 / 나감: 급여명세서 보기, 확인 / 사장님 앱: 급여일 / v6: "수수료 없음"을 "바꾸는 수수료는 A님이 내지 않아요"로 / 미정: 수수료 부담 주체 미정 / v8: 버튼을 "확인"에서 "오늘 화면 보기"로 바꿈. 급여명세서 보기는 옅은 버튼, 금액 28px, 단계 아이콘 40px 원 / v9: 월급 금액 28을 30(t1)으로, 단계 보조 글자 13px #66636e / v10: 전체 화면 role dialog와 aria-modal, 상단 바 제목 연결, Esc로 닫으면 연 단추로 포커스가 돌아옴. 하단 버튼은 130% 이상에서 세로로 쌓음 / v14: 완료 순간. 열 때 3D 떠오름 320ms, 단계가 끝날 때마다 그 단계 체크만 한 번 그림(240ms). 진행 막대는 되풀이하지 않고 단계만큼 채움. 캡처는 입금을 마친 모습 / v15: 끝난 모습의 제목 "₩984,528이 들어왔어요"(h2)와 공감 한 줄 "이번 달도 고생 많으셨어요" / v16: 원화로 바꾸기 단계를 받을 곳으로 보내기로, 이체 대신 누르지 않아도 자동으로, 고생 많았어요 / v17: 제목을 E10 월급 ₩984,528이 들어왔어요로 / v20: 누르지 않아도 체무가 모아서 보내요 / v21: 받은 계좌를 위 줄과 단계에서 두 번 쓰지 않기 / v24: 금액, 날짜, 시각 표기를 92,880원, 11월 14일 토요일, 오전 9:00 꼴로(화면 읽기도 같은 값) / v26: 금액이 결과인 입금이라 히어로를 빼고 작은 사물 ic_coins 96px을 제목 위 가운데 / v31: 작은 사물 바탕 상자를 darken으로 지움(판단 8) / v37: 금액 결과 한 틀(rframe)로 15, 47과 같게. 실패(35)는 에러 틀 그대로 / v38: 과제 4: 끝난 단계 이름을 모음, 받을 곳으로 보냄, 은행 계좌에 입금됨으로(할 일처럼 읽히지 않게) / v58: PANEL 이름에 시점(월급 984,528원은 11월 14일을 A님 기록 9시간으로 바꾼 뒤 금액). 키는 그대로(판단 v49-3)' },

/* =========================================================
   폰 크기 맞추기 + 시작
