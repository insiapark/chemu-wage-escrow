/* =========================================================
   v35: 화면 읽기 이름 [GRAPHIC_RULES R33~R35, UX_WRITING_RULES v25 화면 밖 문구]
   - 금액(92,880원)과 날짜(11월 21일 토요일)는 그대로 읽히므로 두고, 기호가 든 글만 말로 바꿔 .sr에 둔다. 보이는 글은 .say(aria-hidden)
     시각 오후 10:00 → 오후 10시, 범위 ~ → 부터 까지, 계산식 × − ÷ = → 곱하기 빼기 나누기 하면, 가운뎃점 → 쉼표,
     가린 계좌 ***-21-3021 → 계좌, 끝자리 3021, 30m → 30미터, 근무 시간 2:14:08 → 근무한 시간 2시간 14분 8초
   - 누르는 줄(role link, button, switch)은 제목, 설명, 배지, 오른쪽 금액, 새 알림 표시를 쉼표로 묶은 이름 하나로 읽는다
   - 진행 단계는 상태(끝남, 지금, 확인 필요, 문제 있음, 다음)를 앞에, 목록(role list)으로
   - 그림은 계속 alt="" aria-hidden="true"
   - 화면 덤프(textdump)는 보이는 글만 읽으므로 화면 문구와 숫자는 v34와 같다
   ========================================================= */
const hmSay = (h, mm) => +mm ? `${+h}시 ${+mm}분` : `${+h}시`;
function sayFix(t, el) {
  if (el.closest('.timer')) return /^\d+:\d\d:\d\d$/.test(t.trim()) ? t.trim().replace(/^(\d+):(\d\d):(\d\d)$/, (m, h, mi, s) => `근무한 시간 ${+h}시간 ${+mi}분 ${+s}초`) : t;
  if (el.closest('.ftime')) return /^\d+:\d\d$/.test(t.trim()) ? t.trim().replace(/^(\d+):(\d\d)$/, (m, mi, s) => `남은 시간 ${+mi}분 ${+s}초`) : t;
  if (el.closest('.cnt')) return /^\d+$/.test(t.trim()) ? `${t.trim()}개` : t;
  if (el.closest('.pc-dday')) return `급여일까지 ${t.trim()}`;
  return t
    .replace(/(?<![가-힣\d])([월화수목금토일])((?:, [월화수목금토일])+)(?=[\s을를이가은는의과와]|$)/g, (m, a, rest) => [a, ...rest.split(', ').slice(1)].map(d => d + '요일').join(', '))   // v38: 요일 묶음 토, 일은 토요일, 일요일로 [UX_WRITING_RULES 8절]
    .replace(/(오전|오후) (\d{1,2}):(\d\d) ~ (오전|오후) (\d{1,2}):(\d\d)/g, (m, a, h, mm, b, h2, mm2) => `${a} ${hmSay(h, mm)}부터 ${b} ${hmSay(h2, mm2)}까지`)
    .replace(/(오전|오후) (\d{1,2}):(\d\d)/g, (m, a, h, mm) => `${a} ${hmSay(h, mm)}`)
    .replace(/(\d+월 )?(\d+)일 ~ (\d+월 )?(\d+)일/g, (m, a, d, b, d2) => `${a || ''}${d}일부터 ${b || ''}${d2}일까지`)
    .replace(/ ~ /g, '부터 ')
    .replace(/\s*×\s*/g, ' 곱하기 ').replace(/\s*÷\s*/g, ' 나누기 ').replace(/\s*−\s*/g, ' 빼기 ').replace(/\s+=\s+/g, ' 하면 ')
    .replace(/ · /g, ', ')
    .replace(/([가-힣]+) \*{3}-\d+-(\d+)/g, '$1 계좌, 끝자리 $2')
    .replace(/\d{3}-\*{4}-(\d{4})/g, '끝자리 $1인 번호')
    .replace(/(\d+)m(?![a-z])/g, '$1미터')
    .replace(/(?<![\d,])1350(?![\d,])/g, '1 3 5 0')   // v36: 상담 전화는 한 자리씩 [UX_WRITING_RULES 8절]
    .replace(/^ +/, '').replace(/ {2,}/g, ' ');
}
const SAY_SKIP = 'script,style,textarea,.sr,.say,[aria-hidden="true"]';
function rowSay(r) {
  const bits = [];
  const add = el => { if (!el) return; const t = el.textContent.replace(/\s+/g, ' ').trim(); if (t) bits.push(sayFix(t, el)); };
  const rm = r.querySelector(':scope > .rm');
  if (rm) { add(rm.querySelector(':scope > .rt, :scope > b')); add(rm.querySelector(':scope > .rs, :scope > span:not(.rt):not(.tags)')); rm.querySelectorAll('.tag').forEach(add); }
  add(r.querySelector(':scope > .rr'));
  if (r.querySelector('.dot')) bits.push('새 알림');
  return bits.join(', ');
}
function sayPass(root) {
  if (!root || root.nodeType !== 1 || root.closest(SAY_SKIP)) return;
  root.querySelectorAll('.steps').forEach(el => { el.setAttribute('role', 'list'); [...el.children].forEach(c => { if (c.classList.contains('step')) c.setAttribute('role', 'listitem'); }); });
  const rows = root.matches('.row[role]') ? [root] : [];
  rows.push(...root.querySelectorAll('.row[role]'));
  rows.forEach(r => { if (r.dataset.say || r.hasAttribute('aria-label') || /radio|checkbox/.test(r.getAttribute('role'))) return; const s = rowSay(r); if (s) r.setAttribute('aria-label', s); r.dataset.say = '1'; });
  // 줄바꿈(br)으로 나뉜 한 덩어리 글은 통째로 하나의 .say와 .sr로 (보이는 글과 덤프 줄은 그대로)
  const brs = [...root.querySelectorAll('br')].map(b => b.parentElement).filter((el, k, arr) => el && arr.indexOf(el) === k && !el.closest(SAY_SKIP) && [...el.childNodes].every(c => c.nodeType === 3 || c.nodeName === 'BR'));
  for (const el of brs) {
    const whole = [...el.childNodes].map(c => c.nodeType === 3 ? c.textContent : ' ').join('').replace(/\s+/g, ' ').trim();
    const s = sayFix(whole, el); if (s === whole) continue;
    const a = document.createElement('span'); a.className = 'say'; a.setAttribute('aria-hidden', 'true'); a.append(...el.childNodes);
    const b = document.createElement('span'); b.className = 'sr'; b.textContent = s;
    el.append(a, b);
  }
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = [];
  let n; while ((n = w.nextNode())) list.push(n);
  for (const tn of list) {
    const el = tn.parentElement;
    if (!el || el.closest(SAY_SKIP)) continue;
    const t = tn.textContent; if (!/\S/.test(t)) continue;
    const s = sayFix(t, el); if (s === t) continue;
    const a = document.createElement('span'); a.className = 'say'; a.setAttribute('aria-hidden', 'true'); a.textContent = t;
    const b = document.createElement('span'); b.className = 'sr'; b.textContent = /^\s/.test(t) ? ' ' + s : s;
    tn.replaceWith(a, b);
  }
}
/* v36: 긴 글 점검 모드(주소 끝 ?long=1 또는 &long=1). 기본 데이터는 그대로 두고 화면에 그릴 때만 바꾼다:
   가게 이름 20자, 사장님 이름 6자, 10원~999,999원 금액은 같은 숫자 뒤에 0을 붙여 7자리로(92,880원은 9,288,000원).
   숫자 비교(textdump)는 기본 화면만 쓰고 이 모드 값은 넣지 않는다 */
const LONG = new URLSearchParams(location.search).get('long') === '1';
const LONG_SWAP = [['새싹편의점 연희점', '새싹편의점 서울연희동 연세로스무번길점'], ['동네 식당', '동네식당 연남동 경의선숲길 골목 본점'], ['박정민', '선우하늘보리'], ['최영숙', '제갈영숙보람']];
const longAmt = t => t.replace(/(?<![\d,])(\d{1,3}(?:,\d{3})*)원(?!화)/g, (m, n) => { const v = +n.replace(/,/g, ''); return v < 10 || v >= 1e6 ? m : (v * 10 ** (7 - String(v).length)).toLocaleString('ko-KR') + '원'; });
function longPass(root) {
  if (!LONG || !root || root.nodeType !== 1 || root.closest('script,style,textarea,.say,.sr')) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = [];
  let n; while ((n = w.nextNode())) list.push(n);
  for (const tn of list) { if (!tn.parentElement || tn.parentElement.closest('script,style,textarea,.say,.sr')) continue; let t = tn.textContent; const o = t; for (const [a, b] of LONG_SWAP) t = t.split(a).join(b); t = longAmt(t); if (t !== o) tn.textContent = t; }
}
new MutationObserver(ms => { for (const m of ms) m.addedNodes.forEach(x => { const r = x.nodeType === 1 ? x : x.parentElement; longPass(r); sayPass(r); }); })
  .observe(document.querySelector('.screen'), { childList:true, subtree:true });
function fit() {
  const s = Math.min(1, (innerHeight - 32) / 876, (innerWidth - 24) / 417);
  document.documentElement.style.setProperty('--s', s);
}
addEventListener('resize', fit);
fit();
setFontScale(+(new URLSearchParams(location.search).get('fs') || 100));   // v10: ?fs=130, ?fs=200 으로도 열 수 있음
renderPanel();
showTab();
